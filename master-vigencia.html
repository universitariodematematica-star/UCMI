<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI - Panel de Vigencia Operativa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { 
            --dorado-ucmi: #c5a059; 
            --cristal-claro: rgba(255, 255, 255, 0.05);
            --sidebar-width: 260px;
            --rojo-peligro: #e74c3c;
            --purpura-neon: #bc13fe;
            --cian-tech: #00f2ff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png') no-repeat center center fixed;
            background-size: cover;
        }    

.app-wrapper {
    display: flex;
    min-height: 100vh;
}

        /* ===== SIDEBAR UCMI (INTEGRADO) ===== */
.sidebar {
    background: rgba(26, 42, 58, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255,255,255,0.15);
    width:260px;
    flex-shrink:0;
    padding:25px 15px;
    display:flex;
    flex-direction:column;
}

.logo-sidebar {
    height:100px;
    width:auto;
    margin-bottom:30px;
    display:block;
    margin-left:auto;
    margin-right:auto;
}

        .sidebar-nav { flex-grow: 1; }

        .nav-item-ucmi {
            display: flex;
            align-items: center;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            padding: 10px 15px;
            margin-bottom: 5px;
            border-radius: 10px;
            transition:0.3s all ease;
            font-size: 0.85rem;
        }

        .nav-item-ucmi i {
            margin-right: 12px;
            font-size: 1.1rem;
        }

        .nav-item-ucmi:hover {
            color: white;
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

.nav-item-ucmi.active {
    background:rgba(197,160,89,0.15);
    color:var(--dorado-ucmi);
    font-weight:600;
    box-shadow: inset 0 0 10px rgba(197,160,89,0.1);
}

.btn-sidebar-action {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4) !important;
    color: white !important;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.7rem;
    border-radius: 50px;
    padding: 10px;
    text-decoration: none;
    text-align: center;
    transition: all 0.3s ease-in-out;
    display: block;
    margin-bottom: 10px;
}

.btn-sidebar-action:hover {
    background: rgba(255,255,255,0.1);
    border-color: white !important;
    color: white !important;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    transform: translateY(-2px);
}

.btn-logout {
    border-color: rgba(231,76,60,0.4) !important;
    color: rgba(231,76,60,0.8) !important;
}

.btn-logout:hover {
    background: rgba(231,76,60,0.1) !important;
    border-color: #e74c3c !important;
    color: white !important;
    box-shadow: 0 0 10px rgba(231,76,60,0.5);
}

        /* ===== CONTENIDO ===== */
        .main-content {
    flex-grow: 1;
    overflow-y: auto;
    padding: 0 40px;
}

.glass-panel {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(25px);
    border-radius: 30px;
    padding: 40px;

    width: 100%;
    max-width: none;
    margin: 40px 0 0 0;
}

        .table {
            --bs-table-bg: transparent;
            --bs-table-color: white;
            border-spacing: 0 12px;
        }

        .progress {
            background: rgba(255,255,255,0.1);
            height: 8px;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--purpura-neon), var(--cian-tech));
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(0,255,136,0.1);
            border: 1px solid rgba(0,255,136,0.3);
            color: #00ff88;
        }

#inputBusqueda::placeholder {
    color: white !important;
    opacity: 1;
}

#inputBusqueda::-webkit-input-placeholder {
    color: white !important;
}

#inputBusqueda::-moz-placeholder {
    color: white !important;
}

#inputBusqueda:-ms-input-placeholder {
    color: white !important;
}
        
    </style>
</head>

<body>

<div class="overlay"></div>

<div class="app-wrapper">

    <!-- ===== SIDEBAR INTEGRADO ===== -->
    
<div id="sidebar-ucmi"></div>

    <!-- ===== CONTENIDO ===== -->
    <<main class="super-overlay">

        <div class="glass-panel">

            <div class="d-flex justify-content-between mb-4">
                <h3 class="fw-bold text-uppercase">Panel de Vigencia Operativa</h3>

                <input type="text"
                       id="inputBusqueda"
                       class="form-control w-25 bg-transparent text-white border-secondary"
                       placeholder="Buscar...">
            </div>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Entidad</th>
                            <th>Nombre</th>
                            <th>Perfil</th>
                            <th>Activación</th>
                            <th>Progreso</th>
                            <th>Expiración</th>
                            <th>Restan</th>
                        </tr>
                    </thead>
                    <tbody id="listaVigencia"></tbody>
                </table>
            </div>

        </div>

    </main>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const app = initializeApp({
    apiKey: "AIzaSyA2eMtX0I2u1iKdtHjNisMrqVSlpJbzHNI",
    authDomain: "ucmi-13796634.firebaseapp.com",
    projectId: "ucmi-13796634"
});

const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById("btnLogout").onclick = () =>
    signOut(auth).then(() => window.location.href = "index.html");

let usuariosMaster = [];

function renderizar(lista) {
    const cont = document.getElementById("listaVigencia");
    cont.innerHTML = "";

    const ahora = new Date();

    lista.forEach(u => {

        const inicio = u.fechaActivacion?.toDate
            ? u.fechaActivacion.toDate()
            : new Date(u.fechaActivacion || ahora);

        const fin = u.expiracionTimestamp
    ? new Date(u.expiracionTimestamp)
    : ahora;

        const total = Math.max(fin - inicio, 1);
        const trans = ahora - inicio;

        const porcentaje = Math.min(Math.max((trans / total) * 100, 0), 100);

        const dias = Math.ceil((fin - ahora) / 86400000);

        cont.innerHTML += `
            <tr>
                <td>${u.entidad || "-"}</td>
                <td>${u.nombreResponsable || "-"}</td>
                <td>${u.perfil || "-"}</td>
                <td>${inicio.toLocaleDateString()}</td>
                <td style="width:200px">
                    <div class="progress">
                        <div class="progress-bar" style="width:${porcentaje}%"></div>
                    </div>
                    <small>${Math.floor(porcentaje)}%</small>
                </td>
                <td>${fin.toLocaleDateString()}</td>
                <td>
                    <span class="status-badge">
                        ${dias > 0 ? dias + " días" : "Expirado"}
                    </span>
                </td>
            </tr>
        `;
    });
}

onSnapshot(collection(db, "usuarios"), (snapshot) => {

    let rawDocs = snapshot.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(u => u.status !== "eliminado");

    const academiasMap = {};

    rawDocs.forEach(u => {

        if (u.expiracionTimestamp) {

            academiasMap[u.entidad] = {
                exp: u.expiracionTimestamp,
                act: u.fechaActivacion
            };

        }

    });

    usuariosMaster = rawDocs.map(u => ({
        ...u,

        expiracionTimestamp:
            u.expiracionTimestamp ||
            academiasMap[u.entidad]?.exp,

        fechaActivacion:
            u.fechaActivacion ||
            academiasMap[u.entidad]?.act
    }));

    renderizar(usuariosMaster);

});

document.getElementById("inputBusqueda").addEventListener("input", e => {
    const t = e.target.value.toLowerCase();
    renderizar(
        usuariosMaster.filter(u =>
            (u.entidad + u.nombreResponsable + u.perfil)
            .toLowerCase()
            .includes(t)
        )
    );
});
</script>
<script type="module" src="js/alertas-globales.js"></script>
<script src="js/sidebar-ucmi.js"></script>    
</body>
</html>
