<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editor de Contenido</title>

<style>

body{
    margin:0;
    font-family:Segoe UI;
    background:#06090f;
    color:white;
    padding:40px;
}

/* CRISTAL */
.panel{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    padding:20px;
}

/* editor */
textarea{
    width:100%;
    height:300px;
    background:#0f172a;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#c5a059;
    color:#111;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
}

#btnVolver{
    margin-left:10px;
}

</style>

</head>


<body>


<div class="panel">


<h2>Editor de Contenido</h2>


<h4 id="titulo">
Cargando tópico...
</h4>


<textarea 
id="editor"
placeholder="Escribe HTML aquí...">
</textarea>


<button id="btnGuardar">
Guardar contenido
</button>


<button id="btnVolver">
← Volver a tópicos
</button>



<h3 style="margin-top:20px;">
Vista previa
</h3>



<iframe
id="preview"
class="panel"
style="
width:100%;
min-height:700px;
background:white;
border:none;
border-radius:15px;
">
</iframe>



</div>



<script type="module">


import { db } from "./firebase-config.js";


import {
doc,
getDoc,
collection,
query,
where,
getDocs,
addDoc,
updateDoc
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



const params = new URLSearchParams(window.location.search);


const topicoId = params.get("topicoId");

const ramaId = params.get("ramaId");


const editor = document.getElementById("editor");

const preview = document.getElementById("preview");



// ===============================
// VISTA PREVIA CON KATEX
// ===============================


editor.addEventListener(
"input",
actualizarVistaPrevia
);



function actualizarVistaPrevia(){


const documento = preview.contentWindow.document;


documento.open();



documento.write(`

<!DOCTYPE html>

<html lang="es">


<head>


<meta charset="UTF-8">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">



<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"><\/script>



<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"><\/script>



<style>

body{

font-family:Segoe UI,sans-serif;

padding:20px;

line-height:1.6;

color:#222;

}


img{

max-width:100%;

}


table{

border-collapse:collapse;

}


table,td,th{

border:1px solid #ccc;

padding:6px;

}


.formula{

background:#eef7fa;

padding:15px;

border-left:5px solid #2980b9;

}


</style>


</head>



<body>



${editor.value}



<script>


document.addEventListener(
"DOMContentLoaded",
function(){


renderMathInElement(
document.body,
{

delimiters:[

{
left:"$$",
right:"$$",
display:true
},

{
left:"$",
right:"$",
display:false
},

{
left:"\\\\(",
right:"\\\\)",
display:false
},

{
left:"\\\\[",
right:"\\\\]",
display:true
}

],

throwOnError:false

}

);


}

);


<\/script>



</body>


</html>


`);



documento.close();


}





let contenidoId=null;



// ===============================
// CARGAR TOPICO
// ===============================


async function cargarTopico(){


const snap = await getDoc(
doc(db,"topicos",topicoId)
);



if(snap.exists()){

document.getElementById("titulo").innerText =
snap.data().tema;

}


}




// ===============================
// CARGAR CONTENIDO
// ===============================


async function cargarContenido(){


const q=query(

collection(db,"contenidos"),

where("topicoId","==",topicoId)

);



const snap=await getDocs(q);



if(!snap.empty){


const data=snap.docs[0];


contenidoId=data.id;


editor.value=data.data().html || "";


actualizarVistaPrevia();


}


}





// ===============================
// GUARDAR
// ===============================


async function guardar(){



const html=editor.value;

const parser = new DOMParser();

const documento = parser.parseFromString(html, "text/html");

const codigoContenido =
documento.body.dataset.codigoContenido || "";

if(contenidoId){


await updateDoc(

doc(db,"contenidos",contenidoId),

{

codigoContenido,
html

}

);



}else{


await addDoc(

collection(db,"contenidos"),

{

topicoId,

codigoContenido,

html,

creado:new Date()

}

);


}



alert("Contenido guardado");


window.location.href=
`topicos.html?ramaId=${ramaId}`;


}





// ===============================
// EVENTOS
// ===============================


document
.getElementById("btnGuardar")
.addEventListener(
"click",
guardar
);



document
.getElementById("btnVolver")
.addEventListener(
"click",
()=>{

window.location.href=
`topicos.html?ramaId=${ramaId}`;

}

);




// iniciar

cargarTopico();

cargarContenido();



</script>



</body>

</html>
```
