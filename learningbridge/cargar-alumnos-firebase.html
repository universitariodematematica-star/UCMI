<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Bridge - Cargar Alumnos</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            color: #222;
        }

        h1 {
            margin: 0;
            padding: 20px;
            background-color: #5c1d53;
            color: white;
            text-align: center;
        }

        h2 {
            margin: 0;
            padding: 15px;
            background-color: #178a75;
            color: white;
            text-align: center;
        }

        .contenedor-principal {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .panel {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.10);
        }

        .bloque {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input[type="file"] {
            width: 100%;
            max-width: 600px;
            padding: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
        }

        .contenedor-botones {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
        }

        #btnProbarFirebase {
            background-color: #178a75;
            color: white;
        }

        #btnGuardarAlumnos {
            background-color: #5c1d53;
            color: white;
        }
        
        #btnGuardarAlumnos:hover {
            opacity: .88;
        }
        
        #btnProbarFirebase:hover {
            opacity: .88;
        }
        
        button[onclick] {
            background-color: #5c1d53;
            color: white;
        }
        
        button[onclick]:hover {
            opacity: .88;
        }

        #estado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #e9ecef;
            display: none;
        }

        #resultado {
            margin-top: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #5c1d53;
            color: white;
        }

        .exito {
            background-color: #d1fae5 !important;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .error {
            background-color: #fee2e2 !important;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

    </style>

</head>

<body>

    <h1>Learning Bridge</h1>

    <h2>Cargar alumnos</h2>

    <div class="contenedor-principal">

        <div class="panel">

<div class="bloque">

    <label>
        Archivo de alumnos
    </label>

    <input
        type="file"
        id="archivoAlumnos"
        accept=".xlsx,.xls">

<div class="contenedor-botones">

    <button id="btnProbarFirebase">
        Probar conexión
    </button>

    <button id="btnGuardarAlumnos">
        Guardar alumnos en Firebase
    </button>

    <button
        type="button"
        onclick="window.location.href='asistencia.html'">
        Volver a asistencia
    </button>

</div>

</div>

            <div id="estado"></div>

            <div id="resultado"></div>

        </div>

    </div>

    <!-- ==================================================
     EXCELJS
     ================================================== -->

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>


    <!-- ==================================================
         FIREBASE
         ================================================== -->

    <script type="module">

        import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    setDoc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==================================================
        // CONFIGURACIÓN FIREBASE - LEARNING BRIDGE
        // ==================================================

        const firebaseConfig = {

            apiKey: "AIzaSyDRtE0WVvfZpQBGqaIAlo4DgT9KIDxP8Kk",

            authDomain: "learning-bridge-c8080.firebaseapp.com",

            projectId: "learning-bridge-c8080",

            storageBucket: "learning-bridge-c8080.firebasestorage.app",

            messagingSenderId: "133644983307",

            appId: "1:133644983307:web:e2740b73d58dc62026fb0e"

        };


        // ==================================================
        // INICIALIZAR FIREBASE
        // ==================================================

       const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

        // ==================================================
// COMPROBAR SESIÓN
// ==================================================

onAuthStateChanged(auth, function(usuario) {

    if (usuario) {

        console.log(
            "Usuario autenticado:",
            usuario.email
        );

    } else {

        console.log(
            "No hay usuario autenticado."
        );

    }

});


       // ==================================================
// ELEMENTOS DE LA PÁGINA
// ==================================================

const archivoAlumnos =
    document.getElementById("archivoAlumnos");

const btnProbarFirebase =
    document.getElementById("btnProbarFirebase");

const btnGuardarAlumnos =
    document.getElementById("btnGuardarAlumnos");

const estado =
    document.getElementById("estado");

const resultado =
    document.getElementById("resultado");

// ==================================================
// ALUMNOS LEÍDOS DESDE EXCEL
// ==================================================

let alumnosExcel = [];


        // ==================================================
        // MOSTRAR ESTADO
        // ==================================================

        function mostrarEstado(mensaje, tipo = "") {

            estado.textContent = mensaje;

            estado.className = tipo;

            estado.style.display = "block";

        }

        // ==================================================
// LEER ARCHIVO DE ALUMNOS
// ==================================================

archivoAlumnos.addEventListener(
    "change",
    async function() {

        const archivo = archivoAlumnos.files[0];

        if (!archivo) {
            return;
        }

        resultado.innerHTML = "";

        mostrarEstado(
            "Leyendo archivo de alumnos..."
        );

        try {

            const buffer =
                await archivo.arrayBuffer();

            const workbook =
                new ExcelJS.Workbook();

            await workbook.xlsx.load(buffer);

            const hoja =
                workbook.worksheets[0];

            if (!hoja) {

                mostrarEstado(
                    "El archivo no contiene ninguna hoja.",
                    "error"
                );

                return;
            }


            // ==========================================
            // LEER ENCABEZADOS
            // ==========================================

            const encabezados = [];

            hoja.getRow(1).eachCell(
                function(cell, numeroColumna) {

                    encabezados[numeroColumna] =
                        String(cell.value || "").trim();

                }
            );


            const encabezadosEsperados = [
                "N°",
                "Apellidos",
                "Nombres",
                "Student ID",
                "Teléfono",
                "Grupo"
            ];


            // ==========================================
            // COMPROBAR ESTRUCTURA
            // ==========================================

            let estructuraCorrecta = true;

            for (
                let i = 0;
                i < encabezadosEsperados.length;
                i++
            ) {

                if (
                    encabezados[i + 1] !==
                    encabezadosEsperados[i]
                ) {

                    estructuraCorrecta = false;

                    break;
                }

            }


            if (!estructuraCorrecta) {

                mostrarEstado(
                    "La estructura del archivo no coincide con la estructura esperada.",
                    "error"
                );

                resultado.innerHTML = `
                    <p>
                        La primera fila debe contener exactamente:
                    </p>

                    <p>
                                            <strong>
                                            <strong>
                    N° | Apellidos | Nombres | Student ID | Teléfono | Grupo
                    </strong>
                                            </strong>
                                        </p>
                                    `;
                    
                                    return;
                                }


            // ==========================================
            // LEER ALUMNOS
            // ==========================================

            const alumnos = [];

            for (
                let numeroFila = 2;
                numeroFila <= hoja.rowCount;
                numeroFila++
            ) {

                const fila =
                    hoja.getRow(numeroFila);

                const alumno = {

                    numero:
                        String(
                            fila.getCell(1).value || ""
                        ).trim(),

                    apellidos:
                        String(
                            fila.getCell(2).value || ""
                        ).trim(),

                    nombres:
                        String(
                            fila.getCell(3).value || ""
                        ).trim(),

                    studentId:
                        String(
                            fila.getCell(4).value || ""
                        ).trim(),
                    
                    telefono:
                        String(
                            fila.getCell(5).value || ""
                        ).trim(),

                    grupo:
                        String(
                            fila.getCell(6).value || ""
                        ).trim()

                };


                // Ignorar filas completamente vacías

                if (
                    !alumno.apellidos &&
                    !alumno.nombres &&
                    !alumno.telefono &&
                    !alumno.studentId &&
                    !alumno.grupo
                ) {

                    continue;

                }


                alumnos.push(alumno);

            }


            // ==========================================
            // MOSTRAR PREVISUALIZACIÓN
            // ==========================================

            if (alumnos.length === 0) {

                mostrarEstado(
                    "El archivo no contiene alumnos.",
                    "error"
                );

                return;
            }


            let html = `

                <h3>
                    Vista previa de alumnos
                </h3>

                <p>
                    Registros encontrados:
                    <strong>${alumnos.length}</strong>
                </p>

                <table>

                    <thead>

                        <tr>
                            <th>N°</th>
                            <th>Apellidos</th>
                            <th>Nombres</th>
                            <th>Student ID</th>
                            <th>Teléfono</th>
                            <th>Grupo</th>
                        </tr>

                    </thead>

                    <tbody>

            `;


            alumnos.forEach(function(alumno) {

                html += `

                    <tr>

                        <td>
                            ${alumno.numero}
                        </td>

                        <td>
                            ${alumno.apellidos}
                        </td>

                        <td>
                            ${alumno.nombres}
                        </td>

                        <td>
                            ${alumno.studentId}
                        </td>
                        
                        <td>
                            ${alumno.telefono}
                        </td>

                        <td>
                            ${alumno.grupo}
                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            resultado.innerHTML = html;


            mostrarEstado(
                "Archivo leído correctamente.",
                "exito"
            );


            console.log(
                "Alumnos cargados desde Excel:",
                alumnos
            );

            alumnosExcel = alumnos;

            console.log(
                "Alumnos disponibles para guardar en Firebase:",
                alumnosExcel
            );


        } catch (error) {

            console.error(
                "Error al leer el archivo Excel:",
                error
            );

            mostrarEstado(
                "No se pudo leer el archivo Excel: " +
                error.message,
                "error"
            );

        }

    }
);


        // ==================================================
        // PROBAR FIREBASE
        // ==================================================

        btnProbarFirebase.addEventListener(
            "click",
            async function() {

                resultado.innerHTML = "";

                mostrarEstado(
                    "Conectando con Firebase..."
                );

                try {

                    const referencia =
                        collection(db, "alumnos");

                    const snapshot =
                        await getDocs(referencia);


                    mostrarEstado(
                        "Conexión correcta con Firebase y Firestore.",
                        "exito"
                    );


                    // ==========================================
                    // MOSTRAR LOS ALUMNOS EXISTENTES
                    // ==========================================

                    if (snapshot.empty) {

                        resultado.innerHTML = `
                            <p>
                                La conexión funciona, pero la colección
                                <strong>alumnos</strong> está vacía.
                            </p>
                        `;

                        return;
                    }


                    let html = `
                        <table>

                            <thead>

                                <tr>
                                    <th>Student ID</th>
                                    <th>Apellidos</th>
                                    <th>Nombres</th>
                                    <th>Teléfono</th>
                                    <th>Grupo</th>
                                </tr>

                            </thead>

                            <tbody>
                    `;


                    snapshot.forEach(function(doc) {

                        const alumno =
                            doc.data();

                        html += `

                            <tr>

                                <td>
                                    ${alumno.studentId || ""}
                                </td>

                                <td>
                                    ${alumno.apellidos || ""}
                                </td>

                                <td>
                                    ${alumno.nombres || ""}
                                </td>

                                <td>
                                    ${alumno.telefono || ""}
                                </td>

                                <td>
                                    ${alumno.grupo || ""}
                                </td>

                            </tr>

                        `;

                    });


                    html += `
                            </tbody>
                        </table>
                    `;


                    resultado.innerHTML = html;


                } catch (error) {

                    console.error(
                        "Error al conectar con Firebase:",
                        error
                    );


                    mostrarEstado(
                        "Error al conectar con Firebase: " +
                        error.message,
                        "error"
                    );

                }

            }
        );

        // ==================================================
// GUARDAR / ACTUALIZAR ALUMNOS EN FIREBASE
// ==================================================

btnGuardarAlumnos.addEventListener(
    "click",
    async function() {

        if (alumnosExcel.length === 0) {
            mostrarEstado(
                "Primero debe cargar un archivo de alumnos.",
                "error"
            );
            return;
        }

        resultado.innerHTML = "";

        mostrarEstado(
            "Guardando alumnos en Firebase..."
        );

        try {

            let creados = 0;
            let actualizados = 0;

            for (const alumno of alumnosExcel) {

                const studentId =
                    alumno.studentId;

                if (!studentId) {
                    console.warn(
                        "Alumno ignorado porque no tiene Student ID:",
                        alumno
                    );
                    continue;
                }

                const referencia =
                    doc(
                        db,
                        "alumnos",
                        studentId
                    );

                const documento =
                    await getDoc(referencia);

                const datosAlumno = {
                    studentId:
                        alumno.studentId,

                    apellidos:
                        alumno.apellidos,

                    nombres:
                        alumno.nombres,

                    telefono:
                        alumno.telefono,

                    grupo:
                        alumno.grupo
                };

                await setDoc(
                    referencia,
                    datosAlumno
                );

                if (documento.exists()) {
                    actualizados++;
                } else {
                    creados++;
                }
            }

            mostrarEstado(
                "Carga completada correctamente.",
                "exito"
            );

            resultado.innerHTML = `
                <h3>Resultado de la carga</h3>

                <p>
                    Alumnos nuevos:
                    <strong>${creados}</strong>
                </p>

                <p>
                    Alumnos actualizados:
                    <strong>${actualizados}</strong>
                </p>

                <p>
                    Total procesados:
                    <strong>${creados + actualizados}</strong>
                </p>
            `;

            console.log(
                "Alumnos nuevos:",
                creados
            );

            console.log(
                "Alumnos actualizados:",
                actualizados
            );

        } catch (error) {

            console.error(
                "Error al guardar alumnos:",
                error
            );

            mostrarEstado(
                "No se pudieron guardar los alumnos: " +
                error.message,
                "error"
            );
        }
    }
);

    </script>

</body>

</html>
