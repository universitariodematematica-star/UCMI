const archivoAlumnos =
    document.getElementById("archivoAlumnos");

const btnProbarFirebase =

const btnGuardarAlumnos =
    document.getElementById("btnGuardarAlumnos");

// ==================================================
// ALUMNOS LEÍDOS DESDE EXCEL

let alumnosExcel = [];


        // ==================================================
        // MOSTRAR ESTADO
        // ==================================================

        function mostrarEstado(mensaje, tipo = "") {

            estado.textContent = mensaje;

            estado.className = tipo;

            estado.style.display = "block";

        }

        // ==================================================
// LEER ARCHIVO DE ALUMNOS
// ==================================================

archivoAlumnos.addEventListener(
    "change",
    async function() {

        const archivo = archivoAlumnos.files[0];

        if (!archivo) {
            return;
        }

        resultado.innerHTML = "";

        mostrarEstado(
            "Leyendo archivo de alumnos..."
        );

        try {

            const buffer =
                await archivo.arrayBuffer();

            const workbook =
                new ExcelJS.Workbook();

            await workbook.xlsx.load(buffer);

            const hoja =
                workbook.worksheets[0];

            if (!hoja) {

                mostrarEstado(
                    "El archivo no contiene ninguna hoja.",
                    "error"
                );

                return;
            }


            // ==========================================
            // LEER ENCABEZADOS
            // ==========================================

            const encabezados = [];

            hoja.getRow(1).eachCell(
                function(cell, numeroColumna) {

                    encabezados[numeroColumna] =
                        String(cell.value || "").trim();

                }
            );


            const encabezadosEsperados = [
                "N°",
                "Apellidos",
                "Nombres",
                "Student ID",
                "Teléfono",
                "Grupo"
            ];


            // ==========================================
            // COMPROBAR ESTRUCTURA
            // ==========================================

            let estructuraCorrecta = true;

            for (
                let i = 0;
                i < encabezadosEsperados.length;
                i++
            ) {

                if (
                    encabezados[i + 1] !==
                    encabezadosEsperados[i]
                ) {

                    estructuraCorrecta = false;

                    break;
                }

            }


            if (!estructuraCorrecta) {

                mostrarEstado(
                    "La estructura del archivo no coincide con la estructura esperada.",
                    "error"
                );

                resultado.innerHTML = `
                    <p>
                        La primera fila debe contener exactamente:
                    </p>

                    <p>
                                            <strong>
                                            <strong>
                    N° | Apellidos | Nombres | Student ID | Teléfono | Grupo
                    </strong>
                                            </strong>
                                        </p>
                                    `;
                    
                                    return;
                                }


            // ==========================================
            // LEER ALUMNOS
            // ==========================================

            const alumnos = [];

            for (
                let numeroFila = 2;
                numeroFila <= hoja.rowCount;
                numeroFila++
            ) {

                const fila =
                    hoja.getRow(numeroFila);

                const alumno = {

                    numero:
                        String(
                            fila.getCell(1).value || ""
                        ).trim(),

                    apellidos:
                        String(
                            fila.getCell(2).value || ""
                        ).trim(),

                    nombres:
                        String(
                            fila.getCell(3).value || ""
                        ).trim(),

                    studentId:
                        String(
                            fila.getCell(4).value || ""
                        ).trim(),
                    
                    telefono:
                        String(
                            fila.getCell(5).value || ""
                        ).trim(),

                    grupo:
                        String(
                            fila.getCell(6).value || ""
                        ).trim()

                };


                // Ignorar filas completamente vacías

                if (
                    !alumno.apellidos &&
                    !alumno.nombres &&
                    !alumno.telefono &&
                    !alumno.studentId &&
                    !alumno.grupo
                ) {

                    continue;

                }


                alumnos.push(alumno);

            }


            // ==========================================
            // MOSTRAR PREVISUALIZACIÓN
            // ==========================================

            if (alumnos.length === 0) {

                mostrarEstado(
                    "El archivo no contiene alumnos.",
                    "error"
                );

                return;
            }


            let html = `

                <h3>
                    Vista previa de alumnos
                </h3>

                <p>
                    Registros encontrados:
                    <strong>${alumnos.length}</strong>
                </p>

                <table>

                    <thead>

                        <tr>
                            <th>N°</th>
                            <th>Apellidos</th>
                            <th>Nombres</th>
                            <th>Student ID</th>
                            <th>Teléfono</th>
                            <th>Grupo</th>
                        </tr>

                    </thead>

                    <tbody>

            `;


            alumnos.forEach(function(alumno) {

                html += `

                    <tr>

                        <td>
                            ${alumno.numero}
                        </td>

                        <td>
                            ${alumno.apellidos}
                        </td>

                        <td>
                            ${alumno.nombres}
                        </td>

                        <td>
                            ${alumno.studentId}
                        </td>
                        
                        <td>
                            ${alumno.telefono}
                        </td>

                        <td>
                            ${alumno.grupo}
                        </td>

                    </tr>

                `;

            });


            html += `

                    </tbody>

                </table>

            `;


            resultado.innerHTML = html;


            mostrarEstado(
                "Archivo leído correctamente.",
                "exito"
            );


            console.log(
                "Alumnos cargados desde Excel:",
                alumnos
            );

            alumnosExcel = alumnos;

            console.log(
                "Alumnos disponibles para guardar en Firebase:",
                alumnosExcel
            );


        } catch (error) {

            console.error(
                "Error al leer el archivo Excel:",
                error
            );

            mostrarEstado(
                "No se pudo leer el archivo Excel: " +
                error.message,
                "error"
            );

        }

    }
);


        // ==================================================
        // PROBAR FIREBASE
        // ==================================================

        btnProbarFirebase.addEventListener(
            "click",
            async function() {

                resultado.innerHTML = "";

                mostrarEstado(
                    "Conectando con Firebase..."
                );

                try {

                    const referencia =
                        collection(db, "alumnos");

                    const snapshot =
                        await getDocs(referencia);


                    mostrarEstado(
                        "Conexión correcta con Firebase y Firestore.",
                        "exito"
                    );


                    // ==========================================
                    // MOSTRAR LOS ALUMNOS EXISTENTES
                    // ==========================================

                    if (snapshot.empty) {

                        resultado.innerHTML = `
                            <p>
                                La conexión funciona, pero la colección
                                <strong>alumnos</strong> está vacía.
                            </p>
                        `;

                        return;
                    }


                    let html = `
                        <table>

                            <thead>

                                <tr>
                                    <th>Student ID</th>
                                    <th>Apellidos</th>
                                    <th>Nombres</th>
                                    <th>Teléfono</th>
                                    <th>Grupo</th>
                                </tr>

                            </thead>

                            <tbody>
                    `;


                    snapshot.forEach(function(doc) {

                        const alumno =
                            doc.data();

                        html += `

                            <tr>

                                <td>
                                    ${alumno.studentId || ""}
                                </td>

                                <td>
                                    ${alumno.apellidos || ""}
                                </td>

                                <td>
                                    ${alumno.nombres || ""}
                                </td>

                                <td>
                                    ${alumno.telefono || ""}
                                </td>

                                <td>
                                    ${alumno.grupo || ""}
                                </td>

                            </tr>

                        `;

                    });


                    html += `
                            </tbody>
                        </table>
                    `;


                    resultado.innerHTML = html;


                } catch (error) {

                    console.error(
                        "Error al conectar con Firebase:",
                        error
                    );


                    mostrarEstado(
                        "Error al conectar con Firebase: " +
                        error.message,
                        "error"
                    );

                }

            }
        );

        // ==================================================
// GUARDAR / ACTUALIZAR ALUMNOS EN FIREBASE
// ==================================================

btnGuardarAlumnos.addEventListener(
    "click",
    async function() {

        if (alumnosExcel.length === 0) {
            mostrarEstado(
                "Primero debe cargar un archivo de alumnos.",
                "error"
            );
            return;
        }

        resultado.innerHTML = "";

        mostrarEstado(
            "Guardando alumnos en Firebase..."
        );

        try {

            let creados = 0;
            let actualizados = 0;

            for (const alumno of alumnosExcel) {

                const studentId =
                    alumno.studentId;

                if (!studentId) {
                    console.warn(
                        "Alumno ignorado porque no tiene Student ID:",
                        alumno
                    );
                    continue;
                }

                const referencia =
                    doc(
                        db,
                        "alumnos",
                        studentId
                    );

                const documento =
                    await getDoc(referencia);

                const datosAlumno = {
                    studentId:
                        alumno.studentId,

                    apellidos:
                        alumno.apellidos,

                    nombres:
                        alumno.nombres,

                    telefono:
                        alumno.telefono,

                    grupo:
                        alumno.grupo
                };

                await setDoc(
                    referencia,
                    datosAlumno
                );

                if (documento.exists()) {
                    actualizados++;
                } else {
                    creados++;
                }
            }

            mostrarEstado(
                "Carga completada correctamente.",
                "exito"
            );

            resultado.innerHTML = `
                <h3>Resultado de la carga</h3>

                <p>
                    Alumnos nuevos:
                    <strong>${creados}</strong>
                </p>

                <p>
                    Alumnos actualizados:
                    <strong>${actualizados}</strong>
                </p>

                <p>
                    Total procesados:
                    <strong>${creados + actualizados}</strong>
                </p>
            `;

            console.log(
                "Alumnos nuevos:",
                creados
            );

            console.log(
                "Alumnos actualizados:",
                actualizados
            );

        } catch (error) {

            console.error(
                "Error al guardar alumnos:",
                error
            );

            mostrarEstado(
                "No se pudieron guardar los alumnos: " +
                error.message,
                "error"
            );
        }
    }
);

 // ==================================================
// MOSTRAR GRUPOS PARA BORRAR ALUMNOS
// ==================================================

btnBorrarAlumno.addEventListener(
    "click",
    async function() {

        resultado.innerHTML = "";

        mostrarEstado(
            "Cargando grupos..."
        );

        try {

            const consulta =
                await getDocs(
                    collection(db, "alumnos")
                );

            const grupos = new Set();

            consulta.forEach(function(documento) {

                const alumno =
                    documento.data();

                if (alumno.grupo) {
                    grupos.add(
                        alumno.grupo
                    );
                }

            });

            const listaGrupos =
                [...grupos].sort();

            if (listaGrupos.length === 0) {

                mostrarEstado(
                    "No hay grupos registrados.",
                    "error"
                );

                return;
            }

            resultado.innerHTML = `
                <h3>Seleccione un grupo</h3>
                <div id="listaGruposBorrar"></div>
            `;

            const lista =
                document.getElementById(
                    "listaGruposBorrar"
                );

            listaGrupos.forEach(function(grupo) {

                const boton =
                    document.createElement("button");

                boton.type = "button";

                boton.textContent =
                    grupo;

                boton.classList.add(
                    "boton-grupo-borrar"
                );

                boton.addEventListener(
                    "click",
                    async function() {

                        resultado.innerHTML = "";

                        mostrarEstado(
                            "Cargando alumnos del grupo..."
                        );

                        try {

                            const consulta =
                                await getDocs(
                                    collection(db, "alumnos")
                                );

                            const alumnosGrupo = [];

                            consulta.forEach(
                                function(documento) {

                                    const alumno =
                                        documento.data();

                                    if (
                                        alumno.grupo === grupo
                                    ) {

                                        alumnosGrupo.push({
                                            id: documento.id,
                                            ...alumno
                                        });

                                    }

                                }
                            );

                            alumnosGrupo.sort(
                                function(a, b) {

                                    const nombreA =
                                        (
                                            a.apellidos +
                                            " " +
                                            a.nombres
                                        ).toLowerCase();

                                    const nombreB =
                                        (
                                            b.apellidos +
                                            " " +
                                            b.nombres
                                        ).toLowerCase();

                                    return nombreA.localeCompare(
                                        nombreB
                                    );

                                }
                            );

                            if (
                                alumnosGrupo.length === 0
                            ) {

                                mostrarEstado(
                                    "No hay alumnos en este grupo.",
                                    "error"
                                );

                                return;

                            }

                            let html = `
                                <h3>
                                    Alumnos del grupo:
                                    ${grupo}
                                </h3>

                                <table>

                                    <thead>

                                        <tr>
                                            <th>Apellidos</th>
                                            <th>Nombres</th>
                                            <th>Student ID</th>
                                            <th>Teléfono</th>
                                            <th>Acción</th>
                                        </tr>

                                    </thead>

                                    <tbody>
                            `;

                            alumnosGrupo.forEach(
                                function(alumno) {

                                    html += `
                                        <tr id="fila-alumno-${alumno.id}">

                                            <td>
                                                ${alumno.apellidos || ""}
                                            </td>

                                            <td>
                                                ${alumno.nombres || ""}
                                            </td>

                                            <td>
                                                ${alumno.studentId || ""}
                                            </td>

                                            <td>
                                                ${alumno.telefono || ""}
                                            </td>

                                            <td>

                                            <button
                                                type="button"
                                                class="boton-cambiar-datos"
                                                data-id="${alumno.id}">
                                                Cambiar datos
                                            </button>
                                        
                                            <button
                                                type="button"
                                                class="boton-retirar-alumno"
                                                data-id="${alumno.id}"
                                                data-nombre="${alumno.apellidos || ""} ${alumno.nombres || ""}">
                                                Retirar alumno
                                            </button>
                                        
                                        </td>

                                        </tr>
                                    `;

                                }
                            );

                            html += `
                                    </tbody>

                                </table>
                            `;

resultado.innerHTML = html;

                                value="${alumno.nombres || ""}"
                                style="
                                    width: 100%;
                                    padding: 10px;
                                    margin-bottom: 15px;
                                "
                            >

                            <label>
                                Student ID
                            </label>

                            <input
                                type="text"
                                id="editarStudentId"
                                value="${alumno.studentId || ""}"
                                style="
                                    width: 100%;
                                    padding: 10px;
                                    margin-bottom: 15px;
                                "
                            >

                            <label>
                                Teléfono
                            </label>

                            <input
                                type="text"
                                id="editarTelefono"
                                value="${alumno.telefono || ""}"
                                style="
                                    width: 100%;
                                    padding: 10px;
                                    margin-bottom: 15px;
                                "
                            >

                            <label>
                                Grupo
                            </label>
                            
                             <select
                                id="editarGrupo"
                                style="
                                    width: 100%;
                                    padding: 10px;
                                    margin-bottom: 20px;
                                "
                            >
                                <option value="">
                                    Seleccione un grupo
                                </option>
                            
                                ${listaGrupos.map(
                                    function(grupo) {
                            
                                        return `
                                            <option
                                                value="${grupo}"
                                                ${grupo === alumno.grupo ? "selected" : ""}
                                            >
                                                ${grupo}
                                            </option>
                                        `;
                            
                                    }
                                ).join("")}
                            
                            </select>

                            <button
                                type="button"
                                id="btnGuardarCambios"
                                style="
                                    background-color: #178a75;
                                    color: white;
                                    font-weight: bold;
                                    margin-right: 8px;
                                "
                            >
                                Guardar cambios
                            </button>

                            <button
                                type="button"
                                id="btnCancelarCambios"
                                style="
                                    background-color: #5c1d53;
                                    color: white;
                                    font-weight: bold;
                                "
                            >
                                Cancelar
                            </button>

                        </div>
                    `;

                    mostrarEstado(
                        "Modifique los datos del alumno y guarde los cambios.",
                        "exito"
                    );

                    const btnGuardarCambios =
                        document.getElementById(
                            "btnGuardarCambios"
                        );

                    const btnCancelarCambios =
                        document.getElementById(
                            "btnCancelarCambios"
                        );

                    btnCancelarCambios.addEventListener(
                        "click",
                        function() {

                            resultado.innerHTML = "";

                            mostrarEstado(
                                "Edición cancelada.",
                                "exito"
                            );

                        }
                    );

                    btnGuardarCambios.addEventListener(
                        "click",
                        async function() {

                            const apellidos =
                                document
                                    .getElementById(
                                        "editarApellidos"
                                    )
                                    .value
                                    .trim();

                            const nombres =
                                document
                                    .getElementById(
                                        "editarNombres"
                                    )
                                    .value
                                    .trim();

                            const nuevoStudentId =
                                document
                                    .getElementById(
                                        "editarStudentId"
                                    )
                                    .value
                                    .trim();

                            const telefono =
                                document
                                    .getElementById(
                                        "editarTelefono"
                                    )
                                    .value
                                    .trim();

                            const grupo =
                                document
                                    .getElementById(
                                        "editarGrupo"
                                    )
                                    .value
                                    .trim();

                            if (!nuevoStudentId) {

                                mostrarEstado(
                                    "El Student ID no puede estar vacío.",
                                    "error"
                                );

                                return;
                            }

                            btnGuardarCambios.disabled =
                                true;

                            btnGuardarCambios.textContent =
                                "Guardando...";

                            try {

                                const datosAlumno = {

                                    studentId:
                                        nuevoStudentId,

                                    apellidos:
                                        apellidos,

                                    nombres:
                                        nombres,

                                    telefono:
                                        telefono,

                                    grupo:
                                        grupo
                                };

                                // ------------------------------------------
                                // EL STUDENT ID NO CAMBIÓ
                                // ------------------------------------------

                                if (
                                    nuevoStudentId === id
                                ) {

                                    await setDoc(
                                        referencia,
                                        datosAlumno
                                    );

                                }

                                // ------------------------------------------
                                // EL STUDENT ID CAMBIÓ
                                // ------------------------------------------

                                else {

                                    const nuevaReferencia =
                                        doc(
                                            db,
                                            "alumnos",
                                            nuevoStudentId
                                        );

                                    const alumnoExistente =
                                        await getDoc(
                                            nuevaReferencia
                                        );

                                    if (
                                        alumnoExistente.exists()
                                    ) {

                                        throw new Error(
                                            "Ya existe otro alumno con ese Student ID."
                                        );

                                    }

                                    const batch =
                                        writeBatch(db);

                                    batch.set(
                                        nuevaReferencia,
                                        datosAlumno
                                    );

                                    batch.delete(
                                        referencia
                                    );

                                    await batch.commit();

                                }

                                mostrarEstado(
                                    "Los datos del alumno fueron actualizados correctamente.",
                                    "exito"
                                );

                                resultado.innerHTML = `
                                    <h3>
                                        Datos actualizados correctamente
                                    </h3>

                                    <p>
                                        El alumno
                                        <strong>
                                            ${apellidos} ${nombres}
                                        </strong>
                                        fue actualizado.
                                    </p>
                                `;

                            } catch (error) {

                                console.error(
                                    "Error al cambiar datos del alumno:",
                                    error
                                );

                                btnGuardarCambios.disabled =
                                    false;

                                btnGuardarCambios.textContent =
                                    "Guardar cambios";

                                mostrarEstado(
                                    "No se pudieron actualizar los datos: " +
                                    error.message,
                                    "error"
                                );

                            }

                        }
                    );

                } catch (error) {

                    console.error(
                        "Error al cargar datos del alumno:",
                        error
                    );

                    mostrarEstado(
                        "No se pudieron cargar los datos del alumno: " +
                        error.message,
                        "error"
                    );

                }

            }
        );

    }
);

const botonesRetirar =
    document.querySelectorAll(
        ".boton-retirar-alumno"
    );

                            botonesRetirar.forEach(
                                function(boton) {

                                    boton.addEventListener(
                                        "click",
                                        async function() {

                                            const id =
                                                boton.dataset.id;

                                            const nombre =
                                                boton.dataset.nombre;

                                            const confirmar =
                                                confirm(
                                                    "¿Está seguro de que desea retirar al alumno?\n\n" +
                                                    nombre +
                                                    "\n\n" +
                                                    "Sus datos serán guardados en el historial antes de retirarlo de la lista activa."
                                                );

                                            if (!confirmar) {
                                                return;
                                            }

                                            try {

                                                boton.disabled =
                                                    true;

                                                boton.textContent =
                                                    "Retirando...";

                                                /*
                                                 * OBTENER NUEVAMENTE
                                                 * LOS DATOS ACTUALES
                                                 * DEL ALUMNO
                                                 */

                                                const referenciaAlumno =
                                                    doc(
                                                        db,
                                                        "alumnos",
                                                        id
                                                    );

                                                const documentoAlumno =
                                                    await getDoc(
                                                        referenciaAlumno
                                                    );

                                                if (
                                                    !documentoAlumno.exists()
                                                ) {

                                                    throw new Error(
                                                        "El alumno ya no existe en la lista activa."
                                                    );

                                                }

                                                const alumno =
                                                    documentoAlumno.data();

                                                /*
                                                 * CREAR UNA OPERACIÓN
                                                 * ATÓMICA:
                                                 *
                                                 * 1. Guardar historial
                                                 * 2. Retirar de alumnos
                                                 */

                                                const batch =
                                                    writeBatch(db);

                                                const referenciaHistorial =
                                                    doc(
                                                        collection(
                                                            db,
                                                            "historial_alumnos"
                                                        )
                                                    );

                                                batch.set(
                                                    referenciaHistorial,
                                                    {
                                                        studentId:
                                                            alumno.studentId || "",

                                                        apellidos:
                                                            alumno.apellidos || "",

                                                        nombres:
                                                            alumno.nombres || "",

                                                        telefono:
                                                            alumno.telefono || "",

                                                        grupo:
                                                            alumno.grupo || "",

                                                        fechaRetiro:
                                                            serverTimestamp()
                                                    }
                                                );

                                                batch.delete(
                                                    referenciaAlumno
                                                );

                                                await batch.commit();

                                                const fila =
                                                    document.getElementById(
                                                        "fila-alumno-" + id
                                                    );

                                                if (fila) {
                                                    fila.remove();
                                                }

                                                mostrarEstado(
                                                    "El alumno fue retirado correctamente y sus datos fueron guardados en el historial.",
                                                    "exito"
                                                );

                                            } catch (error) {

                                                console.error(
                                                    "Error al retirar alumno:",
                                                    error
                                                );

                                                boton.disabled =
                                                    false;

                                                boton.textContent =
                                                    "Retirar alumno";

                                                mostrarEstado(
                                                    "No se pudo retirar al alumno: " +
                                                    error.message,
                                                    "error"
                                                );

                                            }

                                        }
                                    );

                                }
                            );

                            mostrarEstado(
                                "Seleccione el alumno que desea retirar.",
                                "exito"
                            );

                        } catch (error) {

                            console.error(
                                "Error al cargar alumnos del grupo:",
                                error
                            );

                            mostrarEstado(
                                "No se pudieron cargar los alumnos: " +
                                error.message,
                                "error"
                            );

                        }

                    }
                );

                lista.appendChild(
                    boton
                );

            });

            mostrarEstado(
                "Seleccione el grupo del alumno que desea retirar.",
                "exito"
            );

        } catch (error) {

            console.error(
                "Error al cargar grupos:",
                error
            );

            mostrarEstado(
                "No se pudieron cargar los grupos: " +
                error.message,
                "error"
            );
        }
    }
);       

    </script>

</body>

</html>
