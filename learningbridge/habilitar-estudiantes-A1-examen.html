<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Habilitar estudiantes - Examen A1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #071426;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            width: 100%;
            max-width: 620px;
            padding: 25px;
        }

        .tarjeta {
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .encabezado {
            background: #071426;
            color: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            margin: 0 0 8px 0;
            font-size: 25px;
        }

        .encabezado p {
            margin: 0;
            font-size: 16px;
            color: #d9e1ea;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .campo input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 17px;
            outline: none;
        }

        .campo input:focus {
            border-color: #071426;
            box-shadow: 0 0 0 2px rgba(7, 20, 38, 0.08);
        }

        #cedula {
            letter-spacing: 1px;
        }

        .boton {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: #071426;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .boton:hover {
            background: #102542;
        }

        .boton:disabled {
            background: #7b8794;
            cursor: not-allowed;
        }

        #mensaje {
            display: none;
            margin-top: 22px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            line-height: 1.5;
        }

        #mensaje.exito {
            display: block;
            background: #e8f7ed;
            color: #166534;
            border: 1px solid #a7d7b5;
        }

        #mensaje.error {
            display: block;
            background: #fdecec;
            color: #991b1b;
            border: 1px solid #efb4b4;
        }

        .informacion-prueba {
            margin-top: 25px;
            padding: 15px;
            background: #f8fafc;
            border-left: 4px solid #071426;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.5;
            color: #475569;
        }

        .informacion-prueba strong {
            color: #071426;
        }
    </style>
</head>


<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="encabezado">
                <h1>Habilitar estudiante</h1>
                <p>Examen de Evaluación · Learning Bridge English · A1</p>
            </div>


            <form id="formularioEstudiante">

                <div class="campo">
                    <label for="cedula">
                        Cédula
                    </label>

                    <input
                        type="text"
                        id="cedula"
                        name="cedula"
                        inputmode="numeric"
                        autocomplete="off"
                        maxlength="20"
                        placeholder="Ingrese la cédula"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="nombres">
                        Nombres
                    </label>

                    <input
                        type="text"
                        id="nombres"
                        name="nombres"
                        autocomplete="off"
                        placeholder="Ingrese los nombres"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="apellidos">
                        Apellidos
                    </label>

                    <input
                        type="text"
                        id="apellidos"
                        name="apellidos"
                        autocomplete="off"
                        placeholder="Ingrese los apellidos"
                        required
                    >
                </div>


                <button
                    type="submit"
                    id="btnHabilitar"
                    class="boton"
                >
                    HABILITAR ESTUDIANTE
                </button>

            </form>


            <div id="mensaje"></div>


            <div class="informacion-prueba">
                <strong>Primera prueba:</strong><br>
                Esta página se conecta directamente con el proyecto
                Firebase de UCMI y guarda el estudiante en Firestore.
                El archivo <strong>firebase-config.js</strong> no se modifica.
            </div>

        </div>

    </div>


    <!-- =====================================================
         FIREBASE Y FIRESTORE
         Esta página funciona de manera independiente.
         NO utiliza firebase-config.js
         ===================================================== -->

    <script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    const firebaseConfig = {
        apiKey: "AIzaSyA2eMtX0i2u1iKdtHjNisMrqVSlpJbzHNI",
        authDomain:
            "ucmi-13796634.firebaseapp.com",
        projectId:
            "ucmi-13796634",
        storageBucket:
            "ucmi-13796634.firebasestorage.app",
        messagingSenderId:
            "1090719609536",
        appId:
            "1:1090719609536:web:8d7f269d991d8dc3c6b325",
        measurementId:
            "G-3M3DH25722"
    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    const auth =
        getAuth(app);


    const SUPERADMIN_UID =
        "x0oBFbDP09d7I3VZvWuN6BOODf32";


    let usuarioAutenticado =
        null;


    const formulario =
        document.getElementById("formularioEstudiante");

    const cedulaInput =
        document.getElementById("cedula");

    const nombresInput =
        document.getElementById("nombres");

    const apellidosInput =
        document.getElementById("apellidos");

    const boton =
        document.getElementById("btnHabilitar");

    const mensaje =
        document.getElementById("mensaje");


    function mostrarMensaje(texto, tipo) {

        mensaje.textContent =
            texto;

        mensaje.className =
            tipo;

    }


    /*
     * ================================================
     * VERIFICAR SESIÓN DE FIREBASE AUTHENTICATION
     * ================================================
     */

    onAuthStateChanged(
        auth,
        function(user) {

            console.log(
                "Usuario autenticado:",
                user
                    ? user.uid
                    : "NINGUNO"
            );


            if (!user) {

                usuarioAutenticado =
                    null;

                boton.disabled =
                    true;

                mostrarMensaje(
                    "No hay una sesión de Firebase Authentication activa.",
                    "error"
                );

                return;
            }


            if (user.uid !== SUPERADMIN_UID) {

                usuarioAutenticado =
                    null;

                boton.disabled =
                    true;

                mostrarMensaje(
                    "Acceso no autorizado.",
                    "error"
                );

                return;
            }


            usuarioAutenticado =
                user;

            boton.disabled =
                false;

            mostrarMensaje(
                "Superadministrador autenticado.",
                "exito"
            );

        }
    );


    /*
     * ================================================
     * HABILITAR ESTUDIANTE
     * ================================================
     */

    formulario.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (
                !usuarioAutenticado ||
                usuarioAutenticado.uid !== SUPERADMIN_UID
            ) {

                mostrarMensaje(
                    "No está autorizado para realizar esta operación.",
                    "error"
                );

                return;
            }


            const cedula =
                cedulaInput.value.trim();

            const nombres =
                nombresInput.value.trim();

            const apellidos =
                apellidosInput.value.trim();


            if (
                !cedula ||
                !nombres ||
                !apellidos
            ) {

                mostrarMensaje(
                    "Complete todos los campos.",
                    "error"
                );

                return;
            }


            boton.disabled =
                true;

            boton.textContent =
                "GUARDANDO...";


            mostrarMensaje(
                "",
                ""
            );


            try {

                const referencia =
                    doc(
                        db,
                        "estudiantes_examen",
                        cedula
                    );


                await setDoc(
                    referencia,
                    {

                        cedula:
                            cedula,

                        nombres:
                            nombres,

                        apellidos:
                            apellidos,

                        examen:
                            "A1",

                        habilitado:
                            true,

                        fechaRegistro:
                            serverTimestamp()

                    }
                );


                mostrarMensaje(
                    "Estudiante habilitado correctamente en Firestore.",
                    "exito"
                );


                formulario.reset();

            }
            catch (error) {

                console.error(
                    "ERROR AL GUARDAR EN FIRESTORE:",
                    error
                );


                mostrarMensaje(
                    "No se pudo habilitar el estudiante. " +
                    "Error: " +
                    error.code +
                    " — " +
                    error.message,
                    "error"
                );

            }
            finally {

                boton.disabled =
                    !usuarioAutenticado ||
                    usuarioAutenticado.uid !== SUPERADMIN_UID;

                boton.textContent =
                    "HABILITAR ESTUDIANTE";

            }

        }
    );

</script>

</body>

</html>
