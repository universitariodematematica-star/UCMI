<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Habilitar estudiantes A1 - Examen</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background-color: #f0f2f5;

        }


        .contenedor {

            width: 100%;

            max-width: 600px;

            margin: 20px;

            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(
                    0,
                    0,
                    0,
                    0.12
                );

        }


        .encabezado {

            padding: 30px;

            text-align: center;

            color: white;

            background-color: #071426;

        }


        .logo {

            width: 80px;

            height: 80px;

            margin: 0 auto 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 2px solid white;

            border-radius: 50%;

            font-size: 13px;

            font-weight: bold;

        }


        .encabezado h1 {

            margin: 0;

            font-size: 24px;

        }


        .encabezado p {

            margin: 8px 0 0;

            font-size: 15px;

        }


        .contenido {

            padding: 30px;

        }


        .campo {

            margin-bottom: 20px;

        }


        .campo label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #071426;

        }


        .campo input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cfd4da;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

        }


        .campo input:focus {

            border-color: #071426;

            box-shadow:
                0 0 0 2px rgba(
                    7,
                    20,
                    38,
                    0.08
                );

        }


        #btnHabilitar {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background-color: #071426;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        #btnHabilitar:hover {

            background-color: #102641;

        }


        #btnHabilitar:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #mensaje {

            margin-top: 20px;

            padding: 14px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            display: none;

        }


        #mensaje.exito {

            display: block;

            background-color: #e8f5e9;

            color: #1b5e20;

        }


        #mensaje.error {

            display: block;

            background-color: #ffebee;

            color: #b71c1c;

        }


        #mensaje.info {

            display: block;

            background-color: #e3f2fd;

            color: #0d47a1;

        }

    </style>

</head>


<body>


    <div class="contenedor">


        <div class="encabezado">


            <div class="logo">

                UCMI

            </div>


            <h1>

                HABILITAR ESTUDIANTES

            </h1>


            <p>

                Examen de Evaluación · A1

            </p>


        </div>


        <div class="contenido">


            <div class="campo">

                <label for="cedula">

                    Cédula

                </label>


                <input
                    type="text"
                    id="cedula"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Ingrese la cédula"
                >

            </div>


            <div class="campo">

                <label for="nombres">

                    Nombres

                </label>


                <input
                    type="text"
                    id="nombres"
                    autocomplete="off"
                    placeholder="Ingrese los nombres"
                >

            </div>


            <div class="campo">

                <label for="apellidos">

                    Apellidos

                </label>


                <input
                    type="text"
                    id="apellidos"
                    autocomplete="off"
                    placeholder="Ingrese los apellidos"
                >

            </div>


            <button
                type="button"
                id="btnHabilitar"
            >

                HABILITAR ESTUDIANTE

            </button>


            <div id="mensaje"></div>


        </div>

    </div>


    <!-- =====================================================
         FIREBASE
         ===================================================== -->

    <script type="module">


        /*
         * ==================================================
         * IMPORTAR FIREBASE DESDE TU CONFIGURACIÓN EXISTENTE
         * ==================================================
         */

        import {
            db
        } from "./firebase-config.js";


        /*
         * ==================================================
         * IMPORTAR FUNCIONES DE FIRESTORE
         * ==================================================
         */

        import {
            doc,
            setDoc,
            serverTimestamp
        } from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /*
         * ==================================================
         * ELEMENTOS
         * ==================================================
         */

        const cedula =
            document.getElementById(
                "cedula"
            );


        const nombres =
            document.getElementById(
                "nombres"
            );


        const apellidos =
            document.getElementById(
                "apellidos"
            );


        const boton =
            document.getElementById(
                "btnHabilitar"
            );


        const mensaje =
            document.getElementById(
                "mensaje"
            );


        /*
         * ==================================================
         * CONFIGURACIÓN
         * ==================================================
         */

        const COLECCION =
            "estudiantes_examen";


        const EXAMEN =
            "A1";


        /*
         * ==================================================
         * MOSTRAR MENSAJE
         * ==================================================
         */

        function mostrarMensaje(
            texto,
            tipo
        ) {

            mensaje.textContent =
                texto;

            mensaje.className =
                tipo;

        }


        /*
         * ==================================================
         * HABILITAR ESTUDIANTE
         * ==================================================
         */

        boton.addEventListener(
            "click",
            async function() {


                const valorCedula =
                    cedula.value.trim();


                const valorNombres =
                    nombres.value.trim();


                const valorApellidos =
                    apellidos.value.trim();


                /*
                 * VALIDAR CÉDULA
                 */

                if (
                    !/^\d{10}$/.test(
                        valorCedula
                    )
                ) {

                    mostrarMensaje(
                        "La cédula debe contener exactamente 10 dígitos.",
                        "error"
                    );

                    cedula.focus();

                    return;

                }


                /*
                 * VALIDAR NOMBRES
                 */

                if (
                    valorNombres === ""
                ) {

                    mostrarMensaje(
                        "Ingrese los nombres del estudiante.",
                        "error"
                    );

                    nombres.focus();

                    return;

                }


                /*
                 * VALIDAR APELLIDOS
                 */

                if (
                    valorApellidos === ""
                ) {

                    mostrarMensaje(
                        "Ingrese los apellidos del estudiante.",
                        "error"
                    );

                    apellidos.focus();

                    return;

                }


                /*
                 * DESACTIVAR BOTÓN
                 */

                boton.disabled = true;


                mostrarMensaje(
                    "Conectando con Firebase y guardando estudiante...",
                    "info"
                );


                try {


                    /*
                     * ==================================================
                     * DOCUMENTO DE FIRESTORE
                     *
                     * LA CÉDULA ES EL ID DEL DOCUMENTO
                     * ==================================================
                     */

                    const referencia =
                        doc(
                            db,
                            COLECCION,
                            valorCedula
                        );


                    /*
                     * ==================================================
                     * GUARDAR EN FIRESTORE
                     * ==================================================
                     */

                    await setDoc(
                        referencia,
                        {

                            cedula:
                                valorCedula,

                            nombres:
                                valorNombres,

                            apellidos:
                                valorApellidos,

                            examen:
                                EXAMEN,

                            habilitado:
                                true,

                            fechaRegistro:
                                serverTimestamp()

                        },

                        {
                            merge: true
                        }

                    );


                    /*
                     * ==================================================
                     * CONFIRMACIÓN
                     * ==================================================
                     */

                    mostrarMensaje(
                        "Estudiante habilitado correctamente.",
                        "exito"
                    );


                    /*
                     * LIMPIAR FORMULARIO
                     */

                    cedula.value =
                        "";

                    nombres.value =
                        "";

                    apellidos.value =
                        "";


                    cedula.focus();


                }

                catch (error) {


                    /*
                     * ==================================================
                     * MOSTRAR ERROR REAL
                     * ==================================================
                     */

                    console.error(
                        "ERROR DE FIREBASE:",
                        error
                    );


                    mostrarMensaje(

                        "No fue posible guardar el estudiante. " +

                        (
                            error.code ||
                            "Error desconocido"
                        ) +

                        " — " +

                        (
                            error.message ||
                            ""
                        ),

                        "error"

                    );

                }


                finally {

                    boton.disabled =
                        false;

                }

            }
        );


    </script>


</body>

</html>
