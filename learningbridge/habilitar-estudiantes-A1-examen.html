<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Habilitar estudiantes A1 - Examen</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background-color: #f0f2f5;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;

            margin: 20px;
            padding: 0;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);

            overflow: hidden;
        }

        .encabezado {
            padding: 28px 30px;

            text-align: center;

            color: white;

            background-color: #071426;
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid white;
            border-radius: 50%;

            font-size: 14px;
            font-weight: bold;
        }

        .encabezado h1 {
            margin: 0;

            font-size: 24px;
        }

        .encabezado p {
            margin: 8px 0 0;

            font-size: 15px;
        }

        .contenido {
            padding: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #071426;
        }

        .campo input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cfd4da;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        .campo input:focus {
            border-color: #071426;

            box-shadow:
                0 0 0 2px rgba(7, 20, 38, 0.08);
        }

        #btnHabilitar {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background-color: #071426;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #btnHabilitar:hover {
            background-color: #102641;
        }

        #btnHabilitar:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }

        .mensaje {
            margin-top: 20px;

            padding: 13px;

            border-radius: 8px;

            text-align: center;

            font-weight: bold;

            display: none;
        }

        .mensaje.exito {
            display: block;

            background-color: #e8f5e9;
            color: #1b5e20;
        }

        .mensaje.error {
            display: block;

            background-color: #ffebee;
            color: #b71c1c;
        }

        .mensaje.info {
            display: block;

            background-color: #e3f2fd;
            color: #0d47a1;
        }

    </style>

</head>


<body>


    <div class="contenedor">


        <div class="encabezado">

            <div class="logo">
                LOGO
            </div>

            <h1>
                HABILITAR ESTUDIANTES
            </h1>

            <p>
                Examen de Evaluación · A1
            </p>

        </div>


        <div class="contenido">


            <div class="campo">

                <label for="cedula">
                    Cédula
                </label>

                <input
                    type="text"
                    id="cedula"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="Ingrese la cédula"
                >

            </div>


            <div class="campo">

                <label for="nombres">
                    Nombres
                </label>

                <input
                    type="text"
                    id="nombres"
                    autocomplete="off"
                    placeholder="Ingrese los nombres"
                >

            </div>


            <div class="campo">

                <label for="apellidos">
                    Apellidos
                </label>

                <input
                    type="text"
                    id="apellidos"
                    autocomplete="off"
                    placeholder="Ingrese los apellidos"
                >

            </div>


            <button
                type="button"
                id="btnHabilitar"
            >
                HABILITAR ESTUDIANTE
            </button>


            <div
                id="mensaje"
                class="mensaje"
            ></div>


        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        alert(
            "1. EL JAVASCRIPT PRINCIPAL ESTÁ CARGANDO"
        );

    </script>


    <script type="module">

        /*
         * =================================================
         * PRUEBA DEL MÓDULO
         * =================================================
         */

        alert(
            "2. EL MÓDULO ESTÁ FUNCIONANDO"
        );


        /*
         * =================================================
         * IMPORTACIONES
         * =================================================
         */

        import {
            db
        } from "./firebase-config.js";


        import {
            doc,
            setDoc,
            serverTimestamp
        }
        from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        /*
         * =================================================
         * PRUEBA DE FIREBASE
         * =================================================
         */

        alert(
            "3. FIREBASE Y FIRESTORE FUERON IMPORTADOS"
        );


        /*
         * =================================================
         * ELEMENTOS
         * =================================================
         */

        const campoCedula =
            document.getElementById("cedula");

        const campoNombres =
            document.getElementById("nombres");

        const campoApellidos =
            document.getElementById("apellidos");

        const botonHabilitar =
            document.getElementById("btnHabilitar");

        const mensaje =
            document.getElementById("mensaje");


        /*
         * =================================================
         * CONFIGURACIÓN
         * =================================================
         */

        const EXAMEN = "A1";

        const COLECCION =
            "estudiantes_examen";


        /*
         * =================================================
         * MENSAJES
         * =================================================
         */

        function mostrarMensaje(
            texto,
            tipo
        ) {

            mensaje.textContent = texto;

            mensaje.className =
                "mensaje " + tipo;

        }


        /*
         * =================================================
         * HABILITAR ESTUDIANTE
         * =================================================
         */

        botonHabilitar.addEventListener(
            "click",
            async function() {

                const cedula =
                    campoCedula.value.trim();

                const nombres =
                    campoNombres.value.trim();

                const apellidos =
                    campoApellidos.value.trim();


                /*
                 * VALIDACIÓN CÉDULA
                 */

                if (!/^\d{10}$/.test(cedula)) {

                    mostrarMensaje(
                        "La cédula debe contener exactamente 10 dígitos.",
                        "error"
                    );

                    campoCedula.focus();

                    return;
                }


                /*
                 * VALIDACIÓN NOMBRES
                 */

                if (nombres === "") {

                    mostrarMensaje(
                        "Ingrese los nombres del estudiante.",
                        "error"
                    );

                    campoNombres.focus();

                    return;
                }


                /*
                 * VALIDACIÓN APELLIDOS
                 */

                if (apellidos === "") {

                    mostrarMensaje(
                        "Ingrese los apellidos del estudiante.",
                        "error"
                    );

                    campoApellidos.focus();

                    return;
                }


                /*
                 * BLOQUEAR BOTÓN
                 */

                botonHabilitar.disabled = true;


                mostrarMensaje(
                    "Guardando estudiante...",
                    "info"
                );


                try {

                    /*
                     * DOCUMENTO IDENTIFICADO
                     * POR LA CÉDULA
                     */

                    const referencia =
                        doc(
                            db,
                            COLECCION,
                            cedula
                        );


                    /*
                     * GUARDAR ESTUDIANTE
                     */

                    await setDoc(
                        referencia,
                        {

                            cedula: cedula,

                            nombres: nombres,

                            apellidos: apellidos,

                            examen: EXAMEN,

                            habilitado: true,

                            fechaRegistro:
                                serverTimestamp()

                        },

                        {
                            merge: true
                        }

                    );


                    /*
                     * ÉXITO
                     */

                    mostrarMensaje(
                        "Estudiante habilitado correctamente.",
                        "exito"
                    );


                    /*
                     * LIMPIAR FORMULARIO
                     */

                    campoCedula.value = "";

                    campoNombres.value = "";

                    campoApellidos.value = "";


                    campoCedula.focus();


                } catch (error) {

                    console.error(
                        "ERROR COMPLETO DE FIREBASE:",
                        error
                    );


                    mostrarMensaje(
                        "ERROR: " +
                        (
                            error.code ||
                            "sin código"
                        ) +
                        " — " +
                        (
                            error.message ||
                            "sin mensaje"
                        ),
                        "error"
                    );

                } finally {

                    botonHabilitar.disabled = false;

                }

            }
        );


    </script>


</body>

</html>
