    <label for="filtroGrupo">Grupo:</label>

    <button type="button" id="btnFiltrar">Filtrar</button>
</div>

const resultadoAsistencia = document.getElementById("resultadoAsistencia");

function mostrarAlumnos(lista, fechaInicioFiltro = "", fechaFinFiltro = "") {

    resultadoAsistencia.innerHTML = "";

    if (lista.length === 0) {
        return;
    }

    const tabla = document.createElement("table");

    tabla.style.borderCollapse = "collapse";
    tabla.style.width = "100%";

    /*
     * --------------------------------------------------
     * OBTENER LAS FECHAS REALES DEL EXCEL
     * --------------------------------------------------
     */

    const fechasRegistradas = [];

    lista.forEach(alumno => {

        if (!alumno.sesiones) {
            return;
        }

        alumno.sesiones.forEach(sesion => {

            if (!sesion.fecha) {
                return;
            }

            const textoFecha = String(sesion.fecha);

            const coincidencia = textoFecha.match(
                /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/
            );

            if (!coincidencia) {
                return;
            }

            const dia = parseInt(coincidencia[1]);
            const mesTexto = coincidencia[2];
            const año = parseInt(coincidencia[3]);

            const meses = {
                Jan: 0,
                Feb: 1,
                Mar: 2,
                Apr: 3,
                May: 4,
                Jun: 5,
                Jul: 6,
                Aug: 7,
                Sep: 8,
                Oct: 9,
                Nov: 10,
                Dec: 11
            };

            const mes = meses[mesTexto];

            if (mes === undefined) {
                return;
            }

            const fecha = new Date(año, mes, dia);

            if (!fechasRegistradas.some(
                fechaExistente =>
                    fechaExistente.getTime() === fecha.getTime()
            )) {
                fechasRegistradas.push(fecha);
            }

        });

    });

    if (fechasRegistradas.length === 0) {
        return;
    }

    /*
     * Ordenar fechas
     */

    fechasRegistradas.sort((a, b) => a - b);

    /*
     * --------------------------------------------------
     * CREAR CALENDARIO CONTINUO
     * --------------------------------------------------
     */

    const fechaInicial = fechaInicioFiltro
        ? new Date(fechaInicioFiltro + "T00:00:00")
        : new Date(fechasRegistradas[0]);

    const fechaFinal = fechaFinFiltro
        ? new Date(fechaFinFiltro + "T00:00:00")
        : new Date(
            fechasRegistradas[fechasRegistradas.length - 1]
        );

    const fechas = [];

    const fechaActual = new Date(fechaInicial);

    while (fechaActual <= fechaFinal) {

        fechas.push(new Date(fechaActual));

        fechaActual.setDate(fechaActual.getDate() + 1);

    }

    /*
     * --------------------------------------------------
     * ENCABEZADO
     * --------------------------------------------------
     */

    const filaEncabezado = document.createElement("tr");

    const thAlumno = document.createElement("th");

    thAlumno.textContent = "Alumnos";

    thAlumno.style.border = "1px solid #ccc";
    thAlumno.style.padding = "8px";
    thAlumno.style.whiteSpace = "nowrap";

    filaEncabezado.appendChild(thAlumno);

    fechas.forEach(fecha => {

        const th = document.createElement("th");

        const dia = String(fecha.getDate()).padStart(2, "0");
        const mes = String(fecha.getMonth() + 1).padStart(2, "0");
        const año = fecha.getFullYear();

        th.textContent = `${dia}/${mes}/${año}`;

        th.style.border = "1px solid #ccc";
        th.style.padding = "8px";
        th.style.textAlign = "center";
        th.style.whiteSpace = "nowrap";

        filaEncabezado.appendChild(th);

    });

    tabla.appendChild(filaEncabezado);

    /*
     * --------------------------------------------------
     * FILAS DE ALUMNOS
     * --------------------------------------------------
     */

    lista.forEach(alumno => {

        const fila = document.createElement("tr");

        /*
         * Nombre completo en una sola línea
         */

        const celdaAlumno = document.createElement("td");

        celdaAlumno.textContent =
            `${alumno.apellidos} ${alumno.nombres}`;

        celdaAlumno.style.border = "1px solid #ccc";
        celdaAlumno.style.padding = "8px";
        celdaAlumno.style.whiteSpace = "nowrap";

        fila.appendChild(celdaAlumno);

        /*
         * Crear mapa de asistencia
         */

        const asistenciaPorFecha = {};

        if (alumno.sesiones) {

            alumno.sesiones.forEach(sesion => {

                if (!sesion.fecha) {
                    return;
                }

                const textoFecha = String(sesion.fecha);

                const coincidencia = textoFecha.match(
                    /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/
                );

                if (!coincidencia) {
                    return;
                }

                const dia = parseInt(coincidencia[1]);
                const mesTexto = coincidencia[2];
                const año = parseInt(coincidencia[3]);

                const meses = {
                    Jan: 0,
                    Feb: 1,
                    Mar: 2,
                    Apr: 3,
                    May: 4,
                    Jun: 5,
                    Jul: 6,
                    Aug: 7,
                    Sep: 8,
                    Oct: 9,
                    Nov: 10,
                    Dec: 11
                };

                const mes = meses[mesTexto];

                if (mes === undefined) {
                    return;
                }

                const fecha = new Date(año, mes, dia);

                const clave =
                    `${fecha.getFullYear()}-${String(
                        fecha.getMonth() + 1
                    ).padStart(2, "0")}-${String(
                        fecha.getDate()
                    ).padStart(2, "0")}`;

                /*
                 * Solo guardar P, L, E o A
                 */

                const asistencia = String(
                    sesion.asistencia || ""
                ).trim();

                const resultado = asistencia.charAt(0);

                asistenciaPorFecha[clave] =
                    ["P", "L", "E", "A"].includes(resultado)
                        ? resultado
                        : "?";

            });

        }

        /*
         * --------------------------------------------------
         * DETERMINAR DÍAS DE CLASE SEGÚN EL GRUPO
         * --------------------------------------------------
         */

        let tipoHorario = "";

        if (alumno.grupo) {

            if (/\bMJ\d/.test(alumno.grupo)) {
                tipoHorario = "MJ";
            }
            else if (/\bL\d/.test(alumno.grupo)) {
                tipoHorario = "L";
            }
            else if (/\bS\d/.test(alumno.grupo)) {
                tipoHorario = "S";
            }

        }

        /*
         * --------------------------------------------------
         * CREAR CELDAS
         * --------------------------------------------------
         */

        fechas.forEach(fecha => {

            const celda = document.createElement("td");

            const diaSemana = fecha.getDay();

            let correspondeClase = false;

            /*
             * getDay():
             * 0 = domingo
             * 1 = lunes
             * 2 = martes
             * 3 = miércoles
             * 4 = jueves
             * 5 = viernes
             * 6 = sábado
             */

            if (tipoHorario === "L") {

                correspondeClase =
                    diaSemana === 1 ||
                    diaSemana === 3 ||
                    diaSemana === 5;

            }
            else if (tipoHorario === "MJ") {

                correspondeClase =
                    diaSemana === 2 ||
                    diaSemana === 4;

            }
            else if (tipoHorario === "S") {

                correspondeClase =
                    diaSemana === 6;

            }

            const clave =
                `${fecha.getFullYear()}-${String(
                    fecha.getMonth() + 1
                ).padStart(2, "0")}-${String(
                    fecha.getDate()
                ).padStart(2, "0")}`;

            if (!correspondeClase) {

                celda.textContent = "---";

            }
            else if (asistenciaPorFecha[clave]) {

                celda.textContent =
                    asistenciaPorFecha[clave];

            }
            else {

                celda.textContent = "?";

            }

            celda.style.border = "1px solid #ccc";
            celda.style.padding = "8px";
            celda.style.textAlign = "center";

            fila.appendChild(celda);

        });

        tabla.appendChild(fila);

    });

    resultadoAsistencia.appendChild(tabla);

}
