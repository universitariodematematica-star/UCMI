<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Bridge - Control de Asistencia</title>

    <style>

        body {
            font-family: Arial, sans-serif;
        }

        #archivoAsistencia {
            margin-bottom: 20px;
        }

        #filtroAsistencia,
        #fechaInicio,
        #fechaFin,
        #filtroGrupo,
        #btnFiltrar {
            margin-right: 10px;
            margin-bottom: 15px;
        }

        #resultadoAsistencia {
            margin-top: 15px;
        }

        #resultadoAsistencia div {
            margin-bottom: 8px;
        }

                .btn-enviar-mensaje {
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .mensaje-no-enviado {
            background-color: #28a745;
        }

        .mensaje-enviado {
            background-color: #e91e63;
        }

    </style>
</head>

<body>

    <h1>Learning Bridge</h1>
    <h2>Control de Asistencia</h2>

<div>
    <label for="archivoAsistencia">Archivo de asistencias:</label>
    <input type="file" id="archivoAsistencia" accept=".xlsx,.xls">
</div>    

<div>
    <label for="filtroAsistencia">Alumnos:</label>
    <select id="filtroAsistencia">
        <option value="todos">Todos</option>
        <option value="asistentes">Asistentes</option>
        <option value="inasistentes">Inasistentes</option>
    </select>

    <label for="fechaInicio">Fecha de inicio:</label>
    <input type="date" id="fechaInicio">

    <label for="fechaFin">Fecha de fin:</label>
    <input type="date" id="fechaFin">

    <label for="filtroGrupo">Grupo:</label>
    <select id="filtroGrupo">
        <option value="todos">Todos</option>
    </select>

        <button type="button" id="btnFiltrar">Filtrar</button>
    <button type="button" id="btnPrepararInforme">Preparar informe</button>
    
</div>

/*
 * ==================================================
 * CALCULAR TOTAL PROYECTADO DE CLASES DEL GRUPO
 * ==================================================
 *
 * Se toma la primera fecha registrada en el Excel
 * como inicio del curso y se proyectan 7 meses.
 *
 * El total depende del horario del grupo:
 *
 * L  = lunes, miércoles y viernes
 * MJ = martes y jueves
 * S  = sábado
 *
 * No se cuentan otros días.
 */

function calcularTotalClasesProyectadas(
    grupo,
    primeraFecha
) {

    if (!grupo || !primeraFecha) {
        return 0;
    }

    /*
     * Determinar días de clase del grupo
     */

    let diasClase = [];

    if (/\bMJ\d/.test(grupo)) {

        diasClase = [2, 4];

    }
    else if (/\bL\d/.test(grupo)) {

        diasClase = [1, 3, 5];

    }
    else if (/\bS\d/.test(grupo)) {

        diasClase = [6];

    }

    /*
     * Si no conocemos el horario,
     * no podemos calcular el total.
     */

    if (diasClase.length === 0) {
        return 0;
    }

    /*
     * Fecha inicial
     */

    const inicio = new Date(primeraFecha);

    inicio.setHours(0, 0, 0, 0);

    /*
     * Fecha final:
     * exactamente 7 meses después.
     */

    const fin = new Date(inicio);

    fin.setMonth(fin.getMonth() + 7);

    /*
     * Recorrer todos los días proyectados
     * y contar solamente los días de clase.
     */

    let totalClases = 0;

    const fechaActual = new Date(inicio);

    while (fechaActual <= fin) {

        if (diasClase.includes(fechaActual.getDay())) {

            totalClases++;

        }

        fechaActual.setDate(
            fechaActual.getDate() + 1
        );

    }

    return totalClases;
}        

function obtenerDatosInasistencia(alumno) {

    const primerNombre =
        String(alumno.nombres || "")
        .trim()
        .split(/\s+/)[0];

    const diasInasistencias = [];

    if (alumno.sesiones) {

        alumno.sesiones.forEach(sesion => {

            const asistencia =
                String(sesion.asistencia || "")
                .trim()
                .charAt(0);

            if (asistencia !== "A") {
                return;
            }

            if (!sesion.fecha) {
                return;
            }

            const textoFecha = String(sesion.fecha);

            const coincidencia = textoFecha.match(
                /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/
            );

            if (!coincidencia) {
                return;
            }

            const dia = parseInt(coincidencia[1]);
            const mesTexto = coincidencia[2];
            const año = parseInt(coincidencia[3]);

            const meses = {
                Jan: 0,
                Feb: 1,
                Mar: 2,
                Apr: 3,
                May: 4,
                Jun: 5,
                Jul: 6,
                Aug: 7,
                Sep: 8,
                Oct: 9,
                Nov: 10,
                Dec: 11
            };

            const mesesTexto = {
                Jan: "enero",
                Feb: "febrero",
                Mar: "marzo",
                Apr: "abril",
                May: "mayo",
                Jun: "junio",
                Jul: "julio",
                Aug: "agosto",
                Sep: "septiembre",
                Oct: "octubre",
                Nov: "noviembre",
                Dec: "diciembre"
            };

            if (meses[mesTexto] === undefined) {
                return;
            }

            const fecha = new Date(
                año,
                meses[mesTexto],
                dia
            );

            const diasSemana = [
                "domingo",
                "lunes",
                "martes",
                "miércoles",
                "jueves",
                "viernes",
                "sábado"
            ];

            diasInasistencias.push(
                `${diasSemana[fecha.getDay()]} ${dia} de ${mesesTexto[mesTexto]}`
            );

        });

    }

    return {
        primerNombre,
        diasInasistencias,
        porcentajeActual: null,
        porcentajeProyectado: null,
        limiteInasistencia: 10
    };

}

function obtenerDatosInasistencia(
    alumno,
    fechaInicioSemana,
    fechaFinSemana
) {

    /*
     * --------------------------------------------------
     * PRIMER NOMBRE
     * --------------------------------------------------
     */

    const primerNombre =
        String(alumno.nombres || "")
        .trim()
        .split(/\s+/)[0];

    /*
     * --------------------------------------------------
     * TOTAL DE CLASES DEL CURSO
     * --------------------------------------------------
     */

    const totalClasesCurso =
        calcularTotalClasesProyectadas(
            alumno.grupo,
            primeraFechaExcel
        );

    /*
     * --------------------------------------------------
     * FECHAS DE LA SEMANA CORRIENTE
     * --------------------------------------------------
     */

    const inicioSemana =
        new Date(fechaInicioSemana + "T00:00:00");

    const finSemana =
        new Date(fechaFinSemana + "T00:00:00");

    /*
     * --------------------------------------------------
     * CONTADORES
     * --------------------------------------------------
     */

    let inasistenciasAntesSemana = 0;

    let inasistenciasSemana = 0;

    const diasInasistencias = [];

    /*
     * --------------------------------------------------
     * RECORRER SESIONES
     * --------------------------------------------------
     */

    if (alumno.sesiones) {

        alumno.sesiones.forEach(sesion => {

            /*
             * Solo A = inasistencia
             */

            const asistencia =
                String(sesion.asistencia || "")
                .trim()
                .charAt(0);

            if (asistencia !== "A") {
                return;
            }

            if (!sesion.fecha) {
                return;
            }

            /*
             * --------------------------------------------------
             * INTERPRETAR FECHA DEL EXCEL
             * --------------------------------------------------
             */

            const textoFecha =
                String(sesion.fecha);

            const coincidencia =
                textoFecha.match(
                    /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/
                );

            if (!coincidencia) {
                return;
            }

            const dia =
                parseInt(coincidencia[1]);

            const mesTexto =
                coincidencia[2];

            const año =
                parseInt(coincidencia[3]);

            const meses = {

                Jan: 0,
                Feb: 1,
                Mar: 2,
                Apr: 3,
                May: 4,
                Jun: 5,
                Jul: 6,
                Aug: 7,
                Sep: 8,
                Oct: 9,
                Nov: 10,
                Dec: 11

            };

            const mesesTexto = {

                Jan: "enero",
                Feb: "febrero",
                Mar: "marzo",
                Apr: "abril",
                May: "mayo",
                Jun: "junio",
                Jul: "julio",
                Aug: "agosto",
                Sep: "septiembre",
                Oct: "octubre",
                Nov: "noviembre",
                Dec: "diciembre"

            };

            const mes =
                meses[mesTexto];

            if (mes === undefined) {
                return;
            }

            const fecha =
                new Date(año, mes, dia);

            fecha.setHours(0, 0, 0, 0);

            /*
             * --------------------------------------------------
             * INASISTENCIAS ANTERIORES A LA SEMANA
             * --------------------------------------------------
             */

            if (fecha < inicioSemana) {

                inasistenciasAntesSemana++;

            }

            /*
             * --------------------------------------------------
             * INASISTENCIAS DE LA SEMANA CORRIENTE
             * --------------------------------------------------
             */

            else if (
                fecha >= inicioSemana &&
                fecha <= finSemana
            ) {

                inasistenciasSemana++;

                const diasSemana = [

                    "domingo",
                    "lunes",
                    "martes",
                    "miércoles",
                    "jueves",
                    "viernes",
                    "sábado"

                ];

                diasInasistencias.push({

                    fecha,

                    texto:
                        `${diasSemana[fecha.getDay()]} ${dia} de ${mesesTexto[mesTexto]}`

                });

            }

        });

    }

    /*
     * --------------------------------------------------
     * INASISTENCIAS ACUMULADAS DESPUÉS DE LA SEMANA
     * --------------------------------------------------
     */

    const inasistenciasAcumuladas =
        inasistenciasAntesSemana +
        inasistenciasSemana;

    /*
     * --------------------------------------------------
     * ORDENAR DÍAS
     * --------------------------------------------------
     */

    diasInasistencias.sort(
        (a, b) => a.fecha - b.fecha
    );

    /*
     * --------------------------------------------------
     * TEXTO DE LOS DÍAS
     * --------------------------------------------------
     */

    const textoDiasInasistencias =
        diasInasistencias
        .map(item => item.texto)
        .join(", ");

    /*
     * --------------------------------------------------
     * PORCENTAJE ACTUAL
     * --------------------------------------------------
     *
     * Se consideran solamente las A anteriores
     * a la semana que se está notificando.
     */

    const porcentajeActual =
        totalClasesCurso > 0
            ? (
                inasistenciasAntesSemana /
                totalClasesCurso
            ) * 100
            : 0;

    /*
     * --------------------------------------------------
     * PORCENTAJE SI NO JUSTIFICA
     * --------------------------------------------------
     *
     * Se agregan las A de la semana corriente.
     */

    const porcentajeProyectado =
        totalClasesCurso > 0
            ? (
                inasistenciasAcumuladas /
                totalClasesCurso
            ) * 100
            : 0;

    /*
     * --------------------------------------------------
     * RESULTADO
     * --------------------------------------------------
     */

    return {

        primerNombre,

        diasInasistencias:
            diasInasistencias.map(
                item => item.texto
            ),

        textoDiasInasistencias,

        inasistenciasAntesSemana,

        inasistenciasSemana,

        inasistenciasAcumuladas,

        totalClasesCurso,

        porcentajeActual,

        porcentajeProyectado,

        limiteInasistencia: 10

    };

}

/*
 * ==================================================
 * OBTENER DÍAS DE CLASE SEGÚN EL GRUPO
 * ==================================================
 */

function obtenerDiasClase(grupo) {

    if (!grupo) {
        return [];
    }

    if (/\bMJ\d/.test(grupo)) {
        return [2, 4];
    }

    if (/\bL\d/.test(grupo)) {
        return [1, 3, 5];
    }

    if (/\bS\d/.test(grupo)) {
        return [6];
    }

    return [];

}        

/*
 * ==================================================
 * CONVERTIR FECHA DEL EXCEL
 * ==================================================
 */

function convertirFechaExcel(textoFecha) {

    const texto = String(textoFecha || "");

    const coincidencia = texto.match(
        /^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/
    );

    if (!coincidencia) {
        return null;
    }

    const dia = parseInt(coincidencia[1]);
    const mesTexto = coincidencia[2];
    const año = parseInt(coincidencia[3]);

    const meses = {
        Jan: 0,
        Feb: 1,
        Mar: 2,
        Apr: 3,
        May: 4,
        Jun: 5,
        Jul: 6,
        Aug: 7,
        Sep: 8,
        Oct: 9,
        Nov: 10,
        Dec: 11
    };

    const mes = meses[mesTexto];

    if (mes === undefined) {
        return null;
    }

    const fecha = new Date(
        año,
        mes,
        dia
    );

    fecha.setHours(0, 0, 0, 0);

    return fecha;

}


function calcularDatosInasistencia(alumno) {

    /*
     * ----------------------------------------------
     * FECHA DE HOY
     * ----------------------------------------------
     */

    const hoy = new Date();

    hoy.setHours(0, 0, 0, 0);


    /*
     * ----------------------------------------------
     * LUNES DE LA SEMANA CORRIENTE
     * ----------------------------------------------
     */

    const lunesActual = new Date(hoy);

    const diasDesdeLunes = hoy.getDay() === 0
        ? 6
        : hoy.getDay() - 1;

    lunesActual.setDate(
        hoy.getDate() - diasDesdeLunes
    );

    lunesActual.setHours(0, 0, 0, 0);


/*
 * ----------------------------------------------
 * DETERMINAR DÍAS DE CLASE DEL GRUPO
 * ----------------------------------------------
 */

const diasClase = obtenerDiasClase(alumno.grupo);


    /*
     * ----------------------------------------------
     * OBTENER TODAS LAS SESIONES VÁLIDAS
     * ----------------------------------------------
     */

    const sesionesValidas = [];

    if (alumno.sesiones) {

        alumno.sesiones.forEach(sesion => {

            if (!sesion.fecha) {
                return;
            }

const fecha = convertirFechaExcel(sesion.fecha);

if (!fecha) {
    return;
}

            /*
             * Solo considerar días correspondientes
             * al horario del alumno.
             */

            if (!diasClase.includes(fecha.getDay())) {
                return;
            }

            sesionesValidas.push({
                fecha,
                asistencia: String(
                    sesion.asistencia || ""
                )
                .trim()
                .charAt(0)
            });

        });

    }


    /*
     * ----------------------------------------------
     * INASISTENCIAS HASTA LA SEMANA ANTERIOR
     * ----------------------------------------------
     */

    const inasistenciasAcumuladas =
        sesionesValidas.filter(sesion => {

            return (
                sesion.fecha < lunesActual &&
                sesion.asistencia === "A"
            );

        }).length;


    /*
     * ----------------------------------------------
     * INASISTENCIAS DE LA SEMANA CORRIENTE
     * ----------------------------------------------
     */

    const inasistenciasSemana = sesionesValidas.filter(sesion => {

        return (
            sesion.fecha >= lunesActual &&
            sesion.fecha <= hoy &&
            sesion.asistencia === "A"
        );

    });


    /*
     * ----------------------------------------------
     * TEXTO DE LOS DÍAS DE INASISTENCIA
     * ----------------------------------------------
     */

    const nombresDias = [
        "domingo",
        "lunes",
        "martes",
        "miércoles",
        "jueves",
        "viernes",
        "sábado"
    ];

    const textoDiasInasistencias =
        inasistenciasSemana
            .sort((a, b) => a.fecha - b.fecha)
            .map(sesion => {

                const dia = nombresDias[
                    sesion.fecha.getDay()
                ];

                const numero = String(
                    sesion.fecha.getDate()
                ).padStart(2, "0");

                const mes = String(
                    sesion.fecha.getMonth() + 1
                ).padStart(2, "0");

                return `${dia} ${numero}/${mes}`;

            })
            .join(" y ");


    /*
     * ----------------------------------------------
     * FECHA MÍNIMA DEL EXCEL
     * ----------------------------------------------
     */

    if (!primeraFechaExcel) {

        console.warn(
            "No existe primeraFechaExcel."
        );

        return {
            textoDiasInasistencias,
            porcentajeActual: 0,
            porcentajeProyectado: 0
        };

    }


    /*
     * ----------------------------------------------
     * FIN DEL PERÍODO PROYECTADO
     * 7 MESES DESDE LA PRIMERA FECHA DEL EXCEL
     * ----------------------------------------------
     */

    const fechaFinProyeccion =
        new Date(primeraFechaExcel);

    fechaFinProyeccion.setMonth(
        fechaFinProyeccion.getMonth() + 7
    );

    fechaFinProyeccion.setHours(0, 0, 0, 0);


/*
 * ----------------------------------------------
 * CONTAR TODAS LAS CLASES DEL PERÍODO
 * 7 MESES SEGÚN LOS DÍAS DEL GRUPO
 * ----------------------------------------------
 */

let cantidadClasesPeriodo = 0;

const fechaPeriodo =
    new Date(primeraFechaExcel);

fechaPeriodo.setHours(0, 0, 0, 0);

while (fechaPeriodo < fechaFinProyeccion) {

    if (
        diasClase.includes(
            fechaPeriodo.getDay()
        )
    ) {

        cantidadClasesPeriodo++;

    }

    fechaPeriodo.setDate(
        fechaPeriodo.getDate() + 1
    );

}

console.log(
    "CLASES PROYECTADAS EN 7 MESES:",
    alumno.nombres,
    {
        grupo: alumno.grupo,
        diasClase,
        primeraFechaExcel,
        fechaFinProyeccion,
        cantidadClasesPeriodo
    }
);


    /*
     * ----------------------------------------------
     * PORCENTAJE ACTUAL
     * ----------------------------------------------
     */

    const porcentajeActual =
        cantidadClasesPeriodo > 0
            ? (
                inasistenciasAcumuladas /
                cantidadClasesPeriodo
            ) * 100
            : 0;


    /*
     * ----------------------------------------------
     * PORCENTAJE PROYECTADO
     * ----------------------------------------------
     */

    const totalInasistenciasProyectadas =
        inasistenciasAcumuladas +
        inasistenciasSemana.length;

    const porcentajeProyectado =
        cantidadClasesPeriodo > 0
            ? (
                totalInasistenciasProyectadas /
                cantidadClasesPeriodo
            ) * 100
            : 0;


    /*
     * ----------------------------------------------
     * RESULTADO
     * ----------------------------------------------
     */

    const resultado = {

        textoDiasInasistencias,

        porcentajeActual,

        porcentajeProyectado

    };


    console.log(
        "DATOS CALCULADOS PARA INASISTENCIA:",
        alumno.nombres,
        resultado
    );


    return resultado;

}

     */

    if (filtroAlumnos === "asistentes" ||
        filtroAlumnos === "inasistentes") {

        /*
         * Fecha de hoy.
         * Solo se evalúan los días operativos
         * que ya han ocurrido.
         */

        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);

        alumnosFiltrados = alumnosFiltrados.filter(alumno => {

/*

 */

const diasClase = obtenerDiasClase(alumno.grupo);

            /*
             * Si no conocemos el horario,
             * no podemos determinar asistencia.
             */

            if (diasClase.length === 0) {
                return false;
            }

            /*
             * Obtener las fechas de las sesiones
             * que ya corresponden al horario del alumno.
             */

/*
 * Obtener las fechas de las sesiones
 * que corresponden al período seleccionado.
 */

const fechasOperativas = [];

if (alumno.sesiones) {

    alumno.sesiones.forEach(sesion => {

        if (!sesion.fecha) {
            return;
        }

const fecha = convertirFechaExcel(sesion.fecha);

if (!fecha) {
    return;
}

        fecha.setHours(0, 0, 0, 0);

        /*
         * Solo incluir:
         *
         * 1. días que corresponden al horario
         * 2. fechas dentro del período seleccionado
         * 3. días que ya ocurrieron
         */

        const fechaInicioDate = fechaInicio
            ? new Date(fechaInicio + "T00:00:00")
            : null;

        const fechaFinDate = fechaFin
            ? new Date(fechaFin + "T00:00:00")
            : hoy;

        if (
            diasClase.includes(fecha.getDay()) &&
            (!fechaInicioDate || fecha >= fechaInicioDate) &&
            fecha <= fechaFinDate &&
            fecha <= hoy
        ) {

            fechasOperativas.push({
                fecha,
                asistencia:
                    String(
                        sesion.asistencia || ""
                    )
                    .trim()
                    .charAt(0)
            });

        }

    });

}

            /*
             * Si todavía no existe ningún día operativo
             * para este alumno, no se considera asistente
             * ni inasistente.
             */

            if (fechasOperativas.length === 0) {
                return false;
            }

            /*
             * ASISTENTES:
             *
             * Todas las fechas operativas ya ocurridas
             * deben tener P.
             */

            const esAsistente =
                fechasOperativas.every(
                    sesion => sesion.asistencia === "P"
                );

            /*
             * INASISTENTES:
             *
             * Basta con que una fecha operativa ya ocurrida
             * no tenga P.
             */

            const esInasistente =
                fechasOperativas.some(
                    sesion => sesion.asistencia !== "P"
                );

            if (filtroAlumnos === "asistentes") {
                return esAsistente;
            }

            return esInasistente;

        });

    }
    else if (filtroAlumnos === "inasistentes") {

        alumnosFiltrados = alumnosFiltrados.filter(alumno => {

            if (!alumno.sesiones) {
                return true;
            }

            return !alumno.sesiones.some(sesion => {

                const asistencia =
                    String(sesion.asistencia || "")
                    .trim()
                    .charAt(0);

                return ["P", "L", "E"].includes(asistencia);

            });

        });

    }


    /*

     * --------------------------------------------------
     */

    if (alumnosFiltrados.length === 0) {

        resultadoAsistencia.innerHTML = "";

        const mensaje = document.createElement("div");

        return;

    }

     */

    mostrarAlumnos(

        fechaInicio,
        fechaFin
    );

});

     * PREPARAR INFORME DE INASISTENTES
     * --------------------------------------------------
     */

    /*
     * Alumnos → Inasistentes
     */

    document.getElementById("filtroAsistencia").value = "inasistentes";


    /*
     * Grupo → Todos
     */

    document.getElementById("filtroGrupo").value = "todos";


    /*
     * Fecha de hoy
     */

    const hoy = new Date();

    hoy.setHours(0, 0, 0, 0);


    /*
     * Buscar el lunes pasado más reciente.
     *
     * getDay():
     * 0 = domingo
     * 1 = lunes
     * 2 = martes
     * 3 = miércoles
     * 4 = jueves
     * 5 = viernes
     * 6 = sábado
     */

    const lunes = new Date(hoy);

    const diasDesdeLunes = hoy.getDay() === 0
        ? 6
        : hoy.getDay() - 1;

    lunes.setDate(
        hoy.getDate() - diasDesdeLunes
    );


    /*
     * Convertir fechas a formato YYYY-MM-DD
     */

    const convertirFechaInput = function(fecha) {

        const año = fecha.getFullYear();

        const mes = String(
            fecha.getMonth() + 1
        ).padStart(2, "0");

        const dia = String(
            fecha.getDate()
        ).padStart(2, "0");

        return `${año}-${mes}-${dia}`;

    };


    /*
     * Fecha de inicio → lunes
     * Fecha de fin → hoy
     */

    document.getElementById("fechaInicio").value =
        convertirFechaInput(lunes);

    document.getElementById("fechaFin").value =
        convertirFechaInput(hoy);


    /*
     * Ejecutar el filtrado
     */

    document.getElementById("btnFiltrar").click();

});
