```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Bridge</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            width: 95%;
            max-width: 420px;
        }

        .encabezado {
            background-color: #5c1d53;
            color: white;
            text-align: center;
            padding: 25px 20px;
            border-radius: 10px 10px 0 0;
        }

        .encabezado h1 {
            margin: 0;
            font-size: 30px;
        }

        .encabezado p {
            margin: 8px 0 0;
            font-size: 15px;
        }

        .panel {
            background-color: white;
            padding: 30px;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
        }

        .panel h2 {
            margin: 0 0 25px;
            color: #178a75;
            text-align: center;
            font-size: 22px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        .campo input:focus {
            outline: none;
            border-color: #178a75;
        }

        #btnIngresar {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #178a75;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #btnIngresar:hover {
            opacity: .88;
        }

        #estado {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .pie {
            margin-top: 18px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="encabezado">

            <h1>Learning Bridge</h1>

            <p>Control académico</p>

        </div>


        <div class="panel">

            <h2>Iniciar sesión</h2>


            <form id="formLogin">

                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="btnIngresar"
                >
                    Ingresar
                </button>

            </form>


            <div id="estado"></div>

        </div>


        <div class="pie">
            Learning Bridge
        </div>

    </div>


    <script>

        /*
         * ==================================================
         * INICIO DE SESIÓN
         * ==================================================
         *
         * La conexión con Firebase Authentication se añadirá
         * en el siguiente paso.
         *
         * Por ahora esta página solamente contiene la
         * interfaz de acceso.
         *
         * ==================================================
         */

        const formulario =
            document.getElementById("formLogin");

        const estado =
            document.getElementById("estado");


        formulario.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                estado.textContent =
                    "La conexión con Firebase todavía no está configurada.";

                estado.style.display = "block";

                estado.style.backgroundColor =
                    "#fff3cd";

                estado.style.color =
                    "#856404";

            }
        );

    </script>

</body>

</html>
```
