```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Bridge - Ingreso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            color: #222;
        }

        h1 {
            margin: 0;
            padding: 20px;
            background-color: #5c1d53;
            color: white;
            text-align: center;
        }

        .contenedor {
            width: 95%;
            max-width: 450px;
            margin: 60px auto;
        }

        .tarjeta {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #5c1d53;
            text-align: center;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #178a75;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: .88;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 18px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        .mensaje-error {
            background-color: #f8d7da;
            color: #842029;
        }

        .mensaje-exito {
            background-color: #d1e7dd;
            color: #0f5132;
        }
    </style>
</head>

<body>

    <h1>Learning Bridge</h1>

    <div class="contenedor">

        <div class="tarjeta">

            <h2>Ingreso</h2>

            <form id="formularioLogin">

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" id="btnIngresar">
                    Ingresar
                </button>

            </form>

            <div id="mensaje"></div>

        </div>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        // ==========================================
        // CONFIGURACIÓN FIREBASE - LEARNING BRIDGE
        // ==========================================

        const firebaseConfig = {

            apiKey: "AIzaSyDRtE0WVvfZpQBGqaIAlo4DgT9KIDxP8Kk",

            authDomain: "learning-bridge-c8080.firebaseapp.com",

            projectId: "learning-bridge-c8080",

            storageBucket: "learning-bridge-c8080.firebasestorage.app",

            messagingSenderId: "133644983307",

            appId: "1:133644983307:web:e2740b73d58dc62026fb0e"

        };


        // ==========================================
        // INICIAR FIREBASE
        // ==========================================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        // ==========================================
        // ELEMENTOS
        // ==========================================

        const formularioLogin =
            document.getElementById("formularioLogin");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const btnIngresar =
            document.getElementById("btnIngresar");

        const mensaje =
            document.getElementById("mensaje");


        // ==========================================
        // MOSTRAR MENSAJE
        // ==========================================

        function mostrarMensaje(texto, tipo) {

            mensaje.textContent = texto;

            mensaje.className =
                tipo === "error"
                    ? "mensaje-error"
                    : "mensaje-exito";

            mensaje.style.display = "block";
        }


        // ==========================================
        // INICIAR SESIÓN
        // ==========================================

        formularioLogin.addEventListener(
            "submit",
            async function(evento) {

                evento.preventDefault();

                const correo =
                    email.value.trim();

                const clave =
                    password.value;

                btnIngresar.disabled = true;

                mostrarMensaje(
                    "Ingresando...",
                    "exito"
                );

                try {

                    await signInWithEmailAndPassword(
                        auth,
                        correo,
                        clave
                    );

                    mostrarMensaje(
                        "Ingreso correcto.",
                        "exito"
                    );

                    // Por ahora iremos a asistencia.html
                    window.location.href =
                        "asistencia.html";

                } catch (error) {

                    console.error(
                        "Error de autenticación:",
                        error
                    );

                    mostrarMensaje(
                        "Correo o contraseña incorrectos.",
                        "error"
                    );

                    btnIngresar.disabled = false;
                }
            }
        );


        // ==========================================
        // COMPROBAR SI YA EXISTE UNA SESIÓN
        // ==========================================

        onAuthStateChanged(
            auth,
            function(usuario) {

                if (usuario) {

                    window.location.href =
                        "asistencia.html";
                }
            }
        );

    </script>

</body>

</html>
```
