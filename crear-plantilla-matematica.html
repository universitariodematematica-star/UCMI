<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plantillas matemáticas - UCMI</title>

    <style>

        body {
            margin: 0;
            padding: 40px;
            background: #06090f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
        }

        h1,
        h2 {
            color: #c5a059;
        }

        .panel {
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #c5a059;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background: #1a2a3a;
            color: white;
            border: 1px solid #c5a059;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            padding: 12px 20px;
            background: #c5a059;
            color: #06090f;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .parametro {
            padding: 20px;
            margin-bottom: 15px;
            background: #1a2a3a;
            border-radius: 10px;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }

        .btn-eliminar {
            margin-top: 10px;
            background: #8b2f2f;
            color: white;
        }

        .seccion {
            margin-top: 35px;
        }

        #btnGuardar {
            margin-top: 30px;
            width: 100%;
            font-size: 16px;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>
            Constructor de plantillas matemáticas
        </h1>

        <div class="panel">


            <div class="campo">

                <label>
                    Nombre de la plantilla
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ejemplo: Pendiente entre dos puntos"
                >

            </div>


            <div class="campo">

                <label>
                    Enunciado parametrizado
                </label>

                <textarea
                    id="enunciado"
                    placeholder="Use {{nombreParametro}} para insertar parámetros."
                ></textarea>

            </div>


            <div class="seccion">

                <h2>
                    Parámetros
                </h2>

                <div id="listaParametros"></div>

                <button id="btnAgregarParametro">
                    Agregar parámetro
                </button>

            </div>


            <div class="seccion">

                <h2>
                    Restricciones
                </h2>

                <div class="campo">

                    <label>
                        Una restricción por línea
                    </label>

                    <textarea
                        id="restricciones"
                        placeholder="Ejemplo:&#10;x1 != x2"
                    ></textarea>

                </div>

            </div>


            <div class="seccion">

                <h2>
                    Respuesta parametrizada
                </h2>

                <textarea
                    id="respuesta"
                    placeholder="Ejemplo: $m=\frac{{{y2}}-{{y1}}}{{{x2}}-{{x1}}}$"
                ></textarea>

            </div>


            <button id="btnGuardar">
                Guardar plantilla
            </button>


        </div>

    </div>


    <script type="module">

        import { db } from "./firebase-config.js";

        import {
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        const nombre =
            document.getElementById("nombre");

        const enunciado =
            document.getElementById("enunciado");

        const listaParametros =
            document.getElementById("listaParametros");

        const btnAgregarParametro =
            document.getElementById("btnAgregarParametro");

        const restricciones =
            document.getElementById("restricciones");

        const respuesta =
            document.getElementById("respuesta");

        const btnGuardar =
            document.getElementById("btnGuardar");


        // ===============================================
        // AGREGAR PARÁMETRO
        // ===============================================

        btnAgregarParametro.addEventListener(
            "click",
            function () {

                agregarParametro();

            }
        );


        function agregarParametro() {


            const bloque =
                document.createElement("div");


            bloque.className = "parametro";


            bloque.innerHTML = `

                <div class="fila">

                    <div>

                        <label>
                            Nombre
                        </label>

                        <input
                            type="text"
                            class="parametro-nombre"
                            placeholder="Ejemplo: x1"
                        >

                    </div>


                    <div>

                        <label>
                            Tipo
                        </label>

                        <select class="parametro-tipo">

                            <option value="entero">
                                Entero
                            </option>

                        </select>

                    </div>


                    <div>

                        <label>
                            Mínimo
                        </label>

                        <input
                            type="number"
                            class="parametro-minimo"
                        >

                    </div>


                    <div>

                        <label>
                            Máximo
                        </label>

                        <input
                            type="number"
                            class="parametro-maximo"
                        >

                    </div>

                </div>


                <div class="campo">

                    <label>
                        Valores excluidos
                    </label>

                    <input
                        type="text"
                        class="parametro-excluir"
                        placeholder="Ejemplo: 0, 2, -2"
                    >

                </div>


                <button
                    type="button"
                    class="btn-eliminar"
                >
                    Eliminar parámetro
                </button>

            `;


            const btnEliminar =
                bloque.querySelector(".btn-eliminar");


            btnEliminar.addEventListener(
                "click",
                function () {

                    bloque.remove();

                }
            );


            listaParametros.appendChild(bloque);


        }


        // ===============================================
        // OBTENER PARÁMETROS
        // ===============================================

        function obtenerParametros() {


            const parametros = {};


            const bloques =
                listaParametros.querySelectorAll(
                    ".parametro"
                );


            for (const bloque of bloques) {


                const nombreParametro =
                    bloque
                        .querySelector(".parametro-nombre")
                        .value
                        .trim();


                const tipo =
                    bloque
                        .querySelector(".parametro-tipo")
                        .value;


                const minimoTexto =
                    bloque
                        .querySelector(".parametro-minimo")
                        .value;


                const maximoTexto =
                    bloque
                        .querySelector(".parametro-maximo")
                        .value;


                const excluirTexto =
                    bloque
                        .querySelector(".parametro-excluir")
                        .value
                        .trim();


                if (!nombreParametro) {

                    throw new Error(
                        "Todos los parámetros deben tener nombre."
                    );

                }


                if (
                    minimoTexto === "" ||
                    maximoTexto === ""
                ) {

                    throw new Error(
                        "Todos los parámetros deben tener mínimo y máximo."
                    );

                }


                const minimo =
                    Number(minimoTexto);


                const maximo =
                    Number(maximoTexto);


                if (minimo > maximo) {

                    throw new Error(
                        "El mínimo no puede ser mayor que el máximo."
                    );

                }


                if (
                    Object.prototype.hasOwnProperty.call(
                        parametros,
                        nombreParametro
                    )
                ) {

                    throw new Error(
                        "El parámetro " +
                        nombreParametro +
                        " está repetido."
                    );

                }


                let excluir = [];


                if (excluirTexto) {


                    excluir =
                        excluirTexto
                            .split(",")
                            .map(function (valor) {

                                return Number(
                                    valor.trim()
                                );

                            });


                    if (
                        excluir.some(
                            function (valor) {

                                return Number.isNaN(valor);

                            }
                        )
                    ) {

                        throw new Error(
                            "Los valores excluidos deben ser números."
                        );

                    }


                }


                parametros[nombreParametro] = {

                    tipo: tipo,

                    minimo: minimo,

                    maximo: maximo,

                    excluir: excluir

                };


            }


            return parametros;


        }


        // ===============================================
        // OBTENER RESTRICCIONES
        // ===============================================

        function obtenerRestricciones() {


            return restricciones
                .value
                .split("\n")
                .map(function (restriccion) {

                    return restriccion.trim();

                })
                .filter(function (restriccion) {

                    return restriccion !== "";

                });


        }


        // ===============================================
        // GUARDAR PLANTILLA
        // ===============================================

        btnGuardar.addEventListener(
            "click",
            async function () {


                const nombrePlantilla =
                    nombre.value.trim();


                const enunciadoPlantilla =
                    enunciado.value.trim();


                const respuestaPlantilla =
                    respuesta.value.trim();


                if (!nombrePlantilla) {

                    alert(
                        "Escriba el nombre de la plantilla."
                    );

                    return;

                }


                if (!enunciadoPlantilla) {

                    alert(
                        "Escriba el enunciado parametrizado."
                    );

                    return;

                }


                btnGuardar.disabled = true;

                btnGuardar.textContent =
                    "Guardando...";


                try {


                    const parametros =
                        obtenerParametros();


                    if (
                        Object.keys(parametros).length === 0
                    ) {

                        throw new Error(
                            "Debe agregar al menos un parámetro."
                        );

                    }


                    const listaRestricciones =
                        obtenerRestricciones();


                    const plantilla = {


                        nombre:
                            nombrePlantilla,


                        tipo:
                            "matematica_parametrizada",


                        enunciado:
                            enunciadoPlantilla,


                        parametros:
                            parametros,


                        restricciones:
                            listaRestricciones,


                        respuesta:
                            respuestaPlantilla,


                        fechaCreacion:
                            serverTimestamp()


                    };


                    const plantillaRef =
                        await addDoc(
                            collection(
                                db,
                                "plantillas_matematicas"
                            ),
                            plantilla
                        );


                    console.log(
                        "PLANTILLA CREADA:",
                        plantillaRef.id
                    );


                    console.log(
                        "DATOS DE LA PLANTILLA:",
                        plantilla
                    );


                    alert(
                        "Plantilla matemática guardada correctamente."
                    );


                } catch (error) {


                    console.error(
                        "ERROR AL GUARDAR PLANTILLA:",
                        error
                    );


                    alert(
                        error.message
                    );


                } finally {


                    btnGuardar.disabled = false;

                    btnGuardar.textContent =
                        "Guardar plantilla";


                }


            }
        );


        // ===============================================
        // PARÁMETRO INICIAL
        // ===============================================

        agregarParametro();


    </script>

</body>

</html>
