<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba UCMIBlogger</title>


<style>

body{

    font-family:Arial,sans-serif;
    background:#f2f2f2;
    padding:40px;

}


h1{

    color:#071426;

}


#prueba{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    overflow:hidden;
}


/* Panel creado por UCMIBlogger */

#ucmiBloggerPanel{

    width:100%;

}


#ucmiBloggerPanel textarea{
    width:100%;
    max-width:100%;
    height:200px;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    border:2px solid #071426;
    font-size:15px;
    resize:vertical;
    display:block;
}


#estadoBlogger{

    margin-top:15px;
    font-weight:bold;
    color:#071426;

}


</style>


</head>


<body>


<h1>
Prueba módulo UCMIBlogger
</h1>



<div id="prueba"></div>



<script src="js/ucmi-blogger.js"></script>



<script>


UCMIBlogger.iniciar({

    contenedor:"#prueba"

});


UCMIBlogger.mostrar();


</script>



</body>

</html>
