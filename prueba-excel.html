<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba Excel - UCMI</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #06090f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #c5a059;
        }

        .panel {
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #555;
            text-align: left;
        }

        th {
            background: #1a2a3a;
            color: #c5a059;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Cargar preguntas desde Excel</h1>

        <div class="panel">

            <p>Seleccione un archivo Excel.</p>

            <input
                type="file"
                id="archivoExcel"
                accept=".xlsx,.xls"
            >

            <div id="resultado"></div>

<button id="btnEnviar" style="
    display: none;
    margin-top: 25px;
    padding: 12px 25px;
    background: #c5a059;
    color: #06090f;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
">
    Enviar preguntas
</button>

        </div>

    </div>


    <script type="module">

    import { db } from "./firebase-config.js";

    import {
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";


    const archivoExcel = document.getElementById("archivoExcel");
    const resultado = document.getElementById("resultado");
    const btnEnviar = document.getElementById("btnEnviar");

    let filasExcel = [];


    archivoExcel.addEventListener("change", function (evento) {

        const archivo = evento.target.files[0];

        if (!archivo) {
            return;
        }


        const lector = new FileReader();


        lector.onload = function (e) {

            const datos = new Uint8Array(e.target.result);


            const libro = window.XLSX.read(datos, {
                type: "array"
            });


            const nombreHoja = libro.SheetNames[0];

            const hoja = libro.Sheets[nombreHoja];


            filasExcel = window.XLSX.utils.sheet_to_json(hoja, {
                header: 1
            });


            mostrarTabla(filasExcel);

            btnEnviar.style.display = "block";

        };


        lector.readAsArrayBuffer(archivo);

    });


    btnEnviar.addEventListener("click", async function () {

        if (filasExcel.length <= 1) {

            alert("No hay preguntas para enviar.");

            return;

        }


        const preguntas = filasExcel.slice(1);


        btnEnviar.disabled = true;
        btnEnviar.textContent = "Enviando...";


        try {

            for (const fila of preguntas) {

                const pregunta = fila[0];
                const opcionA = fila[1];
                const opcionB = fila[2];
                const opcionC = fila[3];
                const opcionD = fila[4];
                const correcta = fila[5];


                await addDoc(
                    collection(db, "preguntas_test"),
                    {
                        pregunta: pregunta,

                        opciones: [
                            opcionA,
                            opcionB,
                            opcionC,
                            opcionD
                        ],

                        correcta: correcta,

                        fechaCreacion: serverTimestamp()
                    }
                );

            }


            alert(
                preguntas.length +
                " preguntas guardadas correctamente en Firestore."
            );


            console.log("PREGUNTAS GUARDADAS:", preguntas);


        } catch (error) {

            console.error("ERROR FIRESTORE:", error);

            alert(
                "Error al guardar las preguntas: " +
                error.message
            );

        } finally {

            btnEnviar.disabled = false;
            btnEnviar.textContent = "Enviar preguntas";

        }

    });


    function mostrarTabla(filas) {

        resultado.innerHTML = "";


        if (filas.length === 0) {

            resultado.innerHTML = "<p>El archivo está vacío.</p>";

            btnEnviar.style.display = "none";

            return;

        }


        const tabla = document.createElement("table");


        filas.forEach(function (fila, indice) {

            const tr = document.createElement("tr");


            fila.forEach(function (celda) {

                const elemento = indice === 0
                    ? document.createElement("th")
                    : document.createElement("td");


                elemento.textContent = celda;


                tr.appendChild(elemento);

            });


            tabla.appendChild(tr);

        });


        resultado.appendChild(tabla);

    }

</script>

</body>

</html>
