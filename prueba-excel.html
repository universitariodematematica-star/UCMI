<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba Excel - UCMI</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #06090f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #c5a059;
        }

        .panel {
            padding: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #555;
            text-align: left;
        }

        th {
            background: #1a2a3a;
            color: #c5a059;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Cargar preguntas desde Excel</h1>

        <div class="panel">

            <p>Nombre del examen:</p>

<input
    type="text"
    id="nombreExamen"
    placeholder="Ejemplo: Examen de ubicación de inglés"
    style="
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        background: #1a2a3a;
        color: white;
        border: 1px solid #c5a059;
        border-radius: 8px;
        box-sizing: border-box;
    "
>

<button id="btnCrearExamen" style="
    padding: 12px 25px;
    background: #c5a059;
    color: #06090f;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
">
    Crear examen
</button>

<div id="zonaExcel" style="display: none; margin-top: 30px;">

    <p id="examenActual"></p>

    <hr style="
        margin: 30px 0;
        border: none;
        border-top: 1px solid rgba(255,255,255,0.15);
    ">

    <p>Agregar plantilla matemática:</p>

    <select
        id="selectorPlantilla"
        style="
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1a2a3a;
            color: white;
            border: 1px solid #c5a059;
            border-radius: 8px;
            box-sizing: border-box;
        "
    >

        <option value="">
            Seleccione una plantilla
        </option>

    </select>

    <button id="btnAgregarPlantilla" style="
        padding: 12px 25px;
        background: #c5a059;
        color: #06090f;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    ">
        Agregar plantilla matemática
    </button>

    <hr style="
        margin: 30px 0;
        border: none;
        border-top: 1px solid rgba(255,255,255,0.15);
    ">

    <p>Seleccione un archivo Excel.</p>

    <input
        type="file"
        id="archivoExcel"
        accept=".xlsx,.xls"
    >

</div>

            <div id="resultado"></div>

<button id="btnEnviar" style="
    display: none;
    margin-top: 25px;
    padding: 12px 25px;
    background: #c5a059;
    color: #06090f;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
">
    Enviar preguntas
</button>

        </div>

    </div>


    <script type="module">

    import { db } from "./firebase-config.js";

    import {
    collection,
    addDoc,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    const nombreExamen = document.getElementById("nombreExamen");
    const btnCrearExamen = document.getElementById("btnCrearExamen");

    const zonaExcel = document.getElementById("zonaExcel");
    const examenActual = document.getElementById("examenActual");

    const archivoExcel = document.getElementById("archivoExcel");
const resultado = document.getElementById("resultado");
const btnEnviar = document.getElementById("btnEnviar");

const selectorPlantilla =
    document.getElementById("selectorPlantilla");

const btnAgregarPlantilla =
    document.getElementById("btnAgregarPlantilla");


    let examenId = null;

let nombreExamenActual = null;

let filasExcel = [];


    // ===============================================
    // CREAR EXAMEN
    // ===============================================

    btnCrearExamen.addEventListener("click", async function () {

        const nombre = nombreExamen.value.trim();


        if (!nombre) {

            alert("Escriba el nombre del examen.");

            return;

        }


        btnCrearExamen.disabled = true;

        btnCrearExamen.textContent = "Creando...";


        try {

            const examenRef = await addDoc(
                collection(db, "examenes"),
                {
                    nombre: nombre,
                    fechaCreacion: serverTimestamp()
                }
            );


            examenId = examenRef.id;

            nombreExamenActual = nombre;


            examenActual.innerHTML = `
                <strong>Examen actual:</strong>
                ${nombre}
            `;


            nombreExamen.disabled = true;

            btnCrearExamen.style.display = "none";

            zonaExcel.style.display = "block";


            console.log("EXAMEN CREADO:", examenId);


            alert("Examen creado correctamente.");


        } catch (error) {

            console.error("ERROR AL CREAR EXAMEN:", error);


            alert(
                "Error al crear el examen: " +
                error.message
            );


            btnCrearExamen.disabled = false;

            btnCrearExamen.textContent = "Crear examen";

        }

    });

        
// ===============================================
// CARGAR PLANTILLAS MATEMÁTICAS
// ===============================================

async function cargarPlantillasMatematicas() {

    try {

        const snapshot = await getDocs(
            collection(
                db,
                "plantillas_matematicas"
            )
        );


        selectorPlantilla.innerHTML = `

            <option value="">
                Seleccione una plantilla
            </option>

        `;


        snapshot.forEach(function (documento) {

            const datos = documento.data();


            const opcion =
                document.createElement("option");


            opcion.value = documento.id;

            opcion.textContent = datos.nombre;


            selectorPlantilla.appendChild(opcion);

        });


    } catch (error) {

        console.error(
            "ERROR AL CARGAR PLANTILLAS:",
            error
        );

    }

}


// ===============================================
// AGREGAR PLANTILLA AL EXAMEN
// ===============================================

btnAgregarPlantilla.addEventListener(
    "click",
    async function () {


        if (!examenId) {

            alert(
                "Primero debe crear un examen."
            );

            return;

        }


        const plantillaId =
            selectorPlantilla.value;


        if (!plantillaId) {

            alert(
                "Seleccione una plantilla matemática."
            );

            return;

        }


        btnAgregarPlantilla.disabled = true;

        btnAgregarPlantilla.textContent =
            "Agregando...";


        try {


            await addDoc(
                collection(
                    db,
                    "preguntas_test"
                ),
                {

                    examenId:
                        examenId,

                    nombreExamen:
                        nombreExamenActual,

                    tipo:
                        "matematica_parametrizada",

                    plantillaId:
                        plantillaId,

                    fechaCreacion:
                        serverTimestamp()

                }
            );


            alert(
                "Plantilla matemática agregada al examen."
            );


            selectorPlantilla.value = "";


        } catch (error) {


            console.error(
                "ERROR AL AGREGAR PLANTILLA:",
                error
            );


            alert(
                "Error al agregar la plantilla: " +
                error.message
            );


        } finally {


            btnAgregarPlantilla.disabled = false;

            btnAgregarPlantilla.textContent =
                "Agregar plantilla matemática";


        }


    }
);


cargarPlantillasMatematicas();

    // ===============================================
    // LEER EXCEL
    // ===============================================

    archivoExcel.addEventListener("change", function (evento) {

        const archivo = evento.target.files[0];


        if (!archivo) {

            return;

        }


        const lector = new FileReader();


        lector.onload = function (e) {

            const datos = new Uint8Array(e.target.result);


            const libro = window.XLSX.read(datos, {
                type: "array"
            });


            const nombreHoja = libro.SheetNames[0];


            const hoja = libro.Sheets[nombreHoja];


            filasExcel = window.XLSX.utils.sheet_to_json(
                hoja,
                {
                    header: 1
                }
            );


            mostrarTabla(filasExcel);


            btnEnviar.style.display = "block";

        };


        lector.readAsArrayBuffer(archivo);

    });


    // ===============================================
    // GUARDAR PREGUNTAS
    // ===============================================

    btnEnviar.addEventListener("click", async function () {


        if (!examenId) {

            alert("Primero debe crear un examen.");

            return;

        }


        if (filasExcel.length <= 1) {

            alert("No hay preguntas para enviar.");

            return;

        }


        const preguntas = filasExcel.slice(1);


        btnEnviar.disabled = true;

        btnEnviar.textContent = "Enviando...";


        try {


            for (const fila of preguntas) {


                const pregunta = fila[0];

const opcionA = fila[1];

const opcionB = fila[2];

const opcionC = fila[3];

const opcionD = fila[4];

const correcta = fila[5];

const explicacion = fila[6];

const competencia = fila[7];

const nivel = fila[8];

const dificultad = Number(fila[9]);

const tipo = fila[10];


                await addDoc(
    collection(db, "preguntas_test"),
    {

        examenId: examenId,

        nombreExamen: nombreExamenActual,

        pregunta: pregunta,

        opciones: [
            opcionA,
            opcionB,
            opcionC,
            opcionD
        ],

        correcta: correcta,

        explicacion: explicacion,

        competencia: competencia,

        nivel: nivel,

        dificultad: dificultad,

        tipo: tipo,

        fechaCreacion: serverTimestamp()

    }
);

            }


            alert(
                preguntas.length +
                " preguntas guardadas correctamente."
            );


            console.log(
                "PREGUNTAS ASOCIADAS AL EXAMEN:",
                examenId
            );


        } catch (error) {


            console.error(
                "ERROR FIRESTORE:",
                error
            );


            alert(
                "Error al guardar las preguntas: " +
                error.message
            );


        } finally {


            btnEnviar.disabled = false;

            btnEnviar.textContent = "Enviar preguntas";

        }

    });


    // ===============================================
    // MOSTRAR TABLA
    // ===============================================

    function mostrarTabla(filas) {


        resultado.innerHTML = "";


        if (filas.length === 0) {


            resultado.innerHTML =
                "<p>El archivo está vacío.</p>";


            btnEnviar.style.display = "none";


            return;

        }


        const tabla = document.createElement("table");


        filas.forEach(function (fila, indice) {


            const tr = document.createElement("tr");


            fila.forEach(function (celda) {


                const elemento = indice === 0
                    ? document.createElement("th")
                    : document.createElement("td");


                elemento.textContent = celda;


                tr.appendChild(elemento);

            });


            tabla.appendChild(tr);

        });


        resultado.appendChild(tabla);

    }

</script>
</body>

</html>
