<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UCMI - Plantilla</title>

    <link rel="stylesheet" href="css/ucmi-estilos.css">
    <link rel="stylesheet" href="css/pizarra.css">
    <link rel="stylesheet" href="css/reproductor.css">

</head>

<body>

    <!-- Navegación -->
    <div id="navegacionUCMI" class="navegacion-ucmi">

        <a class="boton-interactivo" href="#">
            VOLVER AL TEMARIO
        </a>

        <a class="boton-interactivo" id="botonSiguiente" href="#">
            SEGUIR
        </a>

        <a class="boton-interactivo" href="#">
            VOLVER A SKILLS
        </a>

    </div>

    <!-- Encabezado -->
    <div id="ucmiEncabezado"></div>

    <!-- Contenido -->
    <p>
        Aquí irá el contenido académico.
    </p>

    <!-- Audios de prueba -->

<div class="audioUCMI"></div>

<div class="audioUCMI"></div>

    <!-- Pizarra -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Scripts -->
    <script src="js/pizarra.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/encabezado.js"></script>
    <script src="js/reproductor.js"></script>

    <script>

        // Iniciar pizarra
        UCMIPizarra.iniciar();

        // Configurar navegación
        UCMINavegacion.iniciar("grammar");

        // Configurar encabezado
        UCMIEncabezado.iniciar({
            titulo: "ENGLISH GRAMMAR A1",
            skill: "Grammar"
        });

            UCMIAudio.cargar([


{

titulo:"Audio 1 - AG 9.1.1 B2",

archivo:"audios/AG.9.1.1.B2.mp3"

},


{

titulo:"Audio 2 - AG 1.1.1",

archivo:"audios/AG_1_1_1.mp3"

}


]);

    </script>

    UCMIAudio.iniciar({

    contenedor:0,

    titulo:"Audio 1 - AG 9.1.1 B2",

    archivo:"audios/AG.9.1.1.B2.mp3"

});


UCMIAudio.iniciar({

    contenedor:1,

    titulo:"Audio 2 - AG 1.1.1",

    archivo:"audios/AG_1_1_1.mp3"

});

</body>

</html>
