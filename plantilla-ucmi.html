<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UCMI - Plantilla</title>

    <link rel="stylesheet" href="css/ucmi-estilos.css">

</head>

<body>

    <!-- Navegación -->
    <div id="navegacionUCMI" class="navegacion-ucmi">

        <a class="boton-interactivo" href="#">
            VOLVER AL TEMARIO
        </a>

        <a class="boton-interactivo" id="botonSiguiente" href="#">
            SEGUIR
        </a>

        <a class="boton-interactivo" href="#">
            VOLVER A SKILLS
        </a>

    </div>

    <!-- Encabezado -->
    <div id="ucmiEncabezado"></div>

    <!-- Contenido -->
    <p>
        Aquí irá el contenido académico.
    </p>

    <!-- Pizarra -->
    <canvas id="drawingCanvas"></canvas>

    <!-- Scripts -->
    <script src="js/pizarra.js"></script>
    <script src="js/navegacion.js"></script>
    <script src="js/encabezado.js"></script>

    <script>

        // Iniciar pizarra
        UCMIPizarra.iniciar();

        // Configurar navegación
        UCMINavegacion.iniciar("grammar");

        // Configurar encabezado
        UCMIEncabezado.iniciar({
            titulo: "ENGLISH GRAMMAR A1",
            skill: "Grammar"
        });

    </script>

</body>

</html>
