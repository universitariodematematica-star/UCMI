<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Constructor Grammar</title>

<style>

:root{

    --azul:#071426;
    --dorado:#FFD700;

}

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background-image:url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png");

    background-size:cover;

    background-position:center;

}

.contenedor{

    display:flex;

    gap:25px;

    padding:25px;

    min-height:100vh;

}

.panel{

    background:white;

    border-radius:18px;

    padding:20px;

    box-shadow:8px 8px 20px rgba(0,0,0,.45);

}

.izquierda{

    width:22%;

}

.centro{

    width:38%;

}

.derecha{

    width:40%;

}

h2{

    margin-top:0;

    color:#071426;

}

button{

    width:100%;

    margin-top:15px;

    padding:14px;

    border:none;

    border-radius:12px;

    background:#FFD700;

    color:#071426;

    font-weight:bold;

    cursor:pointer;

}

button:hover{

    transform:translateY(-2px);

}

pre{

    background:#071426;

    color:white;

    border-radius:12px;

    padding:15px;

    height:650px;

    overflow:auto;

    white-space:pre-wrap;

}

iframe{

    width:100%;

    height:650px;

    border:none;

    border-radius:12px;

    background:white;

}

input[type=file]{

    width:100%;

    margin-top:15px;

}

</style>

</head>

<body>

<div class="contenedor">

    <!-- PANEL IZQUIERDO -->

    <div class="panel izquierda">

        <h2>Proyecto</h2>

        <button>
            Descargar plantilla Excel
        </button>

        <input type="file"
               accept=".xlsx">

        <button disabled>
            Página generada automáticamente
        </button>

    </div>

    <!-- PANEL CENTRAL -->

    <div class="panel centro">

        <h2>Código generado</h2>

        <button>
            Copiar código
        </button>

        <button>
            Descargar HTML
        </button>

        <button>
            Abrir en pestaña nueva
        </button>

        <pre id="codigo"></pre>

    </div>

    <!-- PANEL DERECHO -->

    <div class="panel derecha">

        <h2>Vista previa</h2>

        <iframe id="preview"></iframe>

    </div>

</div>

<script>

function generarCodigo(){

const codigo = `<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI</title>

<link rel="stylesheet" href="css/ucmi-estilos.css">

<link rel="stylesheet" href="css/pizarra.css">

<link rel="stylesheet" href="css/reproductor.css">

</head>

<body>

<div id="navegacionUCMI" class="navegacion-ucmi">

<a class="boton-interactivo">
VOLVER AL TEMARIO
</a>

<a class="boton-interactivo" id="botonSiguiente">
SEGUIR
</a>

<a class="boton-interactivo">
VOLVER A SKILLS
</a>

</div>

<div id="ucmiEncabezado"></div>

<table class="barra-carmesi">

<tr>

<td>

<p>

VOCABULARY

</p>

</td>

</tr>

</table>

<div id="contenidoUCMI">

</div>

<canvas id="drawingCanvas"></canvas>

<script src="js/pizarra.js"><\/script>

<script src="js/navegacion.js"><\/script>

<script src="js/encabezado.js"><\/script>

<script src="js/reproductor.js"><\/script>

<script>

UCMIPizarra.iniciar();

UCMINavegacion.iniciar("grammar");

UCMIEncabezado.iniciar({

titulo:"",

skill:"Grammar"

});

UCMIAudio.cargar([]);

<\/script>

</body>

</html>`;

document.getElementById("codigo").textContent = codigo;

document.getElementById("preview").srcdoc = codigo;

}

generarCodigo();

</script>    

</body>

</html>
