<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba Reproductor UCMI</title>

<style>

/*=========================================================
    COLORES UCMI
=========================================================*/

:root{

    --ucmi-azul-profundo:#071426;
    --ucmi-azul:#123d73;
    --ucmi-azul-claro:#2563a8;

    --ucmi-dorado:#d4af37;
    --ucmi-dorado-claro:#f0d77a;

}

/*=========================================================
    PÁGINA
=========================================================*/

body{

    margin:0;

    background:#f3f6fb;

    font-family:Segoe UI,Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

/*=========================================================
    REPRODUCTOR
=========================================================*/

.audio-ucmi{

    width:420px;

    max-width:90%;

    display:flex;

    align-items:center;

    gap:15px;

    padding:12px 16px;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        var(--ucmi-azul-profundo),
        var(--ucmi-azul)
    );

    border:1px solid rgba(212,175,55,.8);

    box-shadow:8px 8px 20px rgba(0,0,0,.45);

}

.audio-ucmi-boton{

    width:42px;
    height:42px;

    border-radius:50%;

    border:2px solid var(--ucmi-dorado);

    background:var(--ucmi-dorado);

    color:var(--ucmi-azul-profundo);

    font-size:18px;

    cursor:pointer;

    transition:.2s;

}

.audio-ucmi-boton:hover{

    transform:scale(1.08);

    background:var(--ucmi-dorado-claro);

}

.audio-ucmi-contenido{

    flex:1;

}

.audio-ucmi-titulo{

    color:white;

    font-size:12px;

    font-weight:bold;

    letter-spacing:1px;

    margin-bottom:8px;

}

.audio-ucmi-progreso{

    width:100%;

    height:6px;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;

    background:rgba(255,255,255,.25);

}

.audio-ucmi-barra{

    width:0%;

    height:100%;

    background:linear-gradient(
        90deg,
        var(--ucmi-dorado),
        var(--ucmi-dorado-claro)
    );

}

.audio-ucmi-tiempo{

    color:white;

    opacity:.85;

    font-size:12px;

    text-align:right;

    margin-top:6px;

}

</style>

</head>

<body>

<div class="audio-ucmi">

<button class="audio-ucmi-boton" id="playAudio">

▶

</button>

<div class="audio-ucmi-contenido">

<div class="audio-ucmi-titulo">

AUDIO UCMI · PRUEBA

</div>

<div class="audio-ucmi-progreso" id="barraProgreso">

<div class="audio-ucmi-barra" id="progreso"></div>

</div>

<div class="audio-ucmi-tiempo" id="tiempoAudio">

00:00 / 00:00

</div>

</div>

<audio id="audioUCMI">
    <source src="https://universitariodematematica-star.github.io/UCMI/The%20God%20That%20Failed%20%28Remastered%29.mp3" type="audio/mpeg">
</audio>

</div>

<script>

const audio=document.getElementById("audioUCMI");

const boton=document.getElementById("playAudio");

const barra=document.getElementById("barraProgreso");

const progreso=document.getElementById("progreso");

const tiempo=document.getElementById("tiempoAudio");

function formato(seg){

    if(isNaN(seg)) return "00:00";

    let m=Math.floor(seg/60);

    let s=Math.floor(seg%60);

    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

}

audio.addEventListener("loadedmetadata",()=>{

    tiempo.textContent="00:00 / "+formato(audio.duration);

});

boton.addEventListener("click",()=>{

    if(audio.paused){

        audio.play();

        boton.textContent="❚❚";

    }else{

        audio.pause();

        boton.textContent="▶";

    }

});

audio.addEventListener("timeupdate",()=>{

    let porcentaje=(audio.currentTime/audio.duration)*100;

    progreso.style.width=porcentaje+"%";

    tiempo.textContent=formato(audio.currentTime)+" / "+formato(audio.duration);

});

audio.addEventListener("ended",()=>{

    boton.textContent="▶";

    progreso.style.width="0%";

});

barra.addEventListener("click",(e)=>{

    const rect=barra.getBoundingClientRect();

    const pos=(e.clientX-rect.left)/rect.width;

    audio.currentTime=pos*audio.duration;

});

</script>

</body>
</html>
