<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Plantilla -->
    <link rel="stylesheet" href="componentes/plantilla-academia.css">

    <style>

        .panel-cristal{
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:18px;
            padding:30px;
            max-width:900px;
        }

        .form-control{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.2);
            color:white;
        }

        .form-control:focus{
            background:rgba(255,255,255,.12);
            color:white;
            border-color:#c5a059;
            box-shadow:none;
        }

        .form-control::placeholder{
            color:rgba(255,255,255,.5);
        }

        .btn-registrar{
            background:#c5a059;
            border:none;
            color:#111;
            font-weight:600;
            padding:0 25px;
        }

        .btn-registrar:hover{
            background:#d8b26a;
        }

    </style>

</head>
<body>

<div id="plantilla"></div>

<script type="module">

import { db, auth } from "./componentes/firebase-config.js";

import {
    collection,
    addDoc,
    serverTimestamp,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    updateDoc,
    deleteDoc,
    onSnapshot,
    orderBy,
    writeBatch,
    Timestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// =========================
// CARGA PLANTILLA
// =========================
const html = await fetch("componentes/plantilla-academia.html");
document.getElementById("plantilla").innerHTML = await html.text();

document.getElementById("contenido").innerHTML = `
<div class="panel-cristal mb-4">
    <h5 class="mb-4">
        Escriba el nombre del aula y pulse <strong>Registrar</strong>.
    </h5>

    <div class="d-flex gap-3">
        <input id="txtNombre" type="text" class="form-control" placeholder="Escriba aquí...">
        <button id="btnRegistrar" class="btn btn-registrar">Registrar</button>
    </div>
</div>

<div id="listaAulas"></div>
`;

await import("./componentes/plantilla-academia.js");

const txtNombre = document.getElementById("txtNombre");
const btnRegistrar = document.getElementById("btnRegistrar");
const listaAulas = document.getElementById("listaAulas");

// =========================
// GLOBALS IMPORTANTES
// =========================
let datosUsuario = null;
let currentUser = null;

// =========================
// POPUP INTEGRANTES
// =========================
const popupIntegrantes = document.createElement("div");
popupIntegrantes.id = "popupIntegrantes";
popupIntegrantes.style = `
position:fixed;
display:none;
background:#111;
color:white;
padding:12px;
border-radius:10px;
border:1px solid rgba(255,255,255,.2);
min-width:260px;
max-width:320px;
max-height:320px;
overflow-y:auto;
box-shadow:0 10px 30px rgba(0,0,0,.5);
z-index:999999;
pointer-events:none;
`;
document.body.appendChild(popupIntegrantes);

// =========================
// AUTH
// =========================
onAuthStateChanged(auth, async (user) => {

    if (!user) return;

    console.log("AUTH OK");

    currentUser = user;

    const usuarioSnap = await getDoc(doc(db, "usuarios", user.uid));

    if (!usuarioSnap.exists()) return;

    datosUsuario = usuarioSnap.data();

    console.log("USUARIO CARGADO", datosUsuario);

    // =========================
    // SNAPSHOT AULAS
    // =========================
    const q = query(
        collection(db, "aulas"),
        where("entidad", "==", datosUsuario.entidad),
        orderBy("nombre_aula")
    );

    onSnapshot(q, (snapshot) => {

        let htmlAulas = "";

        snapshot.forEach((docSnap) => {

            const aula = docSnap.data();

            htmlAulas += `
            <div class="panel-cristal aula-card mb-3"
                data-id="${docSnap.id}">

                <h5>${aula.nombre_aula}</h5>

                <div class="d-flex gap-2">

                    <button class="btn btn-sm btn-info btnAlumnos" data-id="${docSnap.id}">
                        Alumnos
                    </button>

                    <button class="btn btn-sm btn-secondary btnProfesores" data-id="${docSnap.id}">
                        Profesores
                    </button>

                </div>

            </div>`;
        });

        listaAulas.innerHTML = htmlAulas;

    });

});

// =========================
// CLICK GLOBAL (FIX REAL)
// =========================
document.addEventListener("click", async (e) => {

    const btn = e.target.closest("button");

    if (!btn) return;

    console.log("CLICK DETECTADO", btn.className);

    if (btn.classList.contains("btnProfesores")) {

        console.log("CLICK PROFESORES OK");

        abrirSelectorProfesores(btn.dataset.id, datosUsuario.entidad);
    }

    if (btn.classList.contains("btnAlumnos")) {

        abrirSelectorAlumnos(btn.dataset.id, datosUsuario.entidad);
    }
});

// =========================
// MODAL PROFESORES
// =========================
async function abrirSelectorProfesores(aulaId, entidad) {

    console.log("ABRIENDO MODAL");

    const overlay = document.createElement("div");

    overlay.style = `
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.75);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
    `;

    overlay.innerHTML = `
        <div style="width:900px;max-width:95%;background:#111;color:white;padding:25px;border-radius:16px;">
            <h4>Asignar profesores</h4>
            <div id="listaProfesores">Cargando...</div>

            <div class="mt-3 d-flex justify-content-between">
                <button id="cerrar" class="btn btn-danger">Cerrar</button>
                <button id="guardar" class="btn btn-success">Guardar</button>
            </div>
        </div>
    `;

    document.body.appendChild(overlay);

    document.getElementById("cerrar").onclick = () => overlay.remove();

    const lista = document.getElementById("listaProfesores");

    const docentesSnap = await getDocs(
        query(
            collection(db, "usuarios"),
            where("entidad", "==", entidad),
            where("perfil", "==", "Docente Academia")
        )
    );

    lista.innerHTML = "";

    docentesSnap.forEach(d => {

        const data = d.data();

        lista.innerHTML += `
        <div>
            <input type="checkbox" value="${d.id}">
            ${data.nombreResponsable}
        </div>`;
    });

    document.getElementById("guardar").onclick = async () => {

        const checks = overlay.querySelectorAll("input[type=checkbox]:checked");

        const batch = writeBatch(db);

        checks.forEach(c => {

            const ref = doc(db, "aula_integrantes", aulaId + "_" + c.value);

            batch.set(ref, {
                aulaId,
                usuarioId: c.value,
                perfil: "Docente Academia",
                entidad
            });

        });

        await batch.commit();

        overlay.remove();
        alert("Guardado");
    };
}
    
</script>

</body>
</html>
