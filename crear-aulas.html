<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Plantilla -->
    <link rel="stylesheet" href="componentes/plantilla-academia.css">

    <style>

        .panel-cristal{
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:18px;
            padding:30px;
            max-width:900px;
        }

        .form-control{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.2);
            color:white;
        }

        .form-control:focus{
            background:rgba(255,255,255,.12);
            color:white;
            border-color:#c5a059;
            box-shadow:none;
        }

        .form-control::placeholder{
            color:rgba(255,255,255,.5);
        }

        .btn-registrar{
            background:#c5a059;
            border:none;
            color:#111;
            font-weight:600;
            padding:0 25px;
        }

        .btn-registrar:hover{
            background:#d8b26a;
        }

    </style>

</head>
<body>

<div id="plantilla"></div>

<script type="module">

import { db, auth } from "./componentes/firebase-config.js";

import {
    collection,
    addDoc,
    serverTimestamp,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    updateDoc,
    deleteDoc,
    onSnapshot,
    orderBy,
    writeBatch,
    Timestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// =========================
// CARGA PLANTILLA
// =========================
const html = await fetch("componentes/plantilla-academia.html");
document.getElementById("plantilla").innerHTML = await html.text();

document.getElementById("contenido").innerHTML = `
<div class="panel-cristal mb-4">
    <h5 class="mb-4">
        Escriba el nombre del aula y pulse <strong>Registrar</strong>.
    </h5>

    <div class="d-flex gap-3">
        <input id="txtNombre" type="text" class="form-control" placeholder="Escriba aquí...">
        <button id="btnRegistrar" class="btn btn-registrar">Registrar</button>
    </div>
</div>

<div id="listaAulas"></div>
`;

await import("./componentes/plantilla-academia.js");

const txtNombre = document.getElementById("txtNombre");
const btnRegistrar = document.getElementById("btnRegistrar");
const listaAulas = document.getElementById("listaAulas");

// =========================
// POPUP INTEGRANTES
// =========================
const popupIntegrantes = document.createElement("div");
popupIntegrantes.style.position = "fixed";
popupIntegrantes.style.display = "none";
popupIntegrantes.style.background = "#111";
popupIntegrantes.style.color = "white";
popupIntegrantes.style.padding = "12px";
popupIntegrantes.style.borderRadius = "10px";
popupIntegrantes.style.zIndex = "999999";
popupIntegrantes.style.pointerEvents = "none";
document.body.appendChild(popupIntegrantes);

// =========================
// AUTH
// =========================
onAuthStateChanged(auth, async (user) => {

if (!user) return;

const usuarioSnap = await getDoc(doc(db, "usuarios", user.uid));
if (!usuarioSnap.exists()) return;

const datosUsuario = usuarioSnap.data();

// =========================
// AULAS
// =========================
const q = query(
    collection(db, "aulas"),
    where("entidad", "==", datosUsuario.entidad),
    orderBy("nombre_aula")
);

onSnapshot(q, async (snapshot) => {

let htmlAulas = "";

for (const docSnap of snapshot.docs) {

    const aula = docSnap.data();

    let asignaturasCurso = [];

    if (aula.cursoId) {

        const asignaturasSnap = await getDocs(
            query(
                collection(db, "curso_asignaturas"),
                where("cursoId", "==", aula.cursoId),
                where("entidad", "==", datosUsuario.entidad)
            )
        );

        asignaturasCurso = asignaturasSnap.docs.map(d => d.data().asignatura);
    }

    htmlAulas += `
    <div class="panel-cristal aula-card mb-3 d-flex justify-content-between"
        data-id="${docSnap.id}">

        <div>
            <h5>${aula.nombre_aula}</h5>
        </div>

        <div class="d-flex gap-2">

            <button class="btn btn-sm btn-info btnAlumnos" data-id="${docSnap.id}">
                👥 Alumnos
            </button>

            <button class="btn btn-sm btn-secondary btnProfesores" data-id="${docSnap.id}">
                👨‍🏫 Profesores
            </button>

        </div>
    </div>
    `;
}

listaAulas.innerHTML = htmlAulas;

});

// =========================
// CLICK GLOBAL
// =========================
document.addEventListener("click", async (e) => {

const btn = e.target.closest("button");
if (!btn) return;

if (btn.classList.contains("btnProfesores")) {
    abrirSelectorProfesores(btn.dataset.id, datosUsuario.entidad);
}

if (btn.classList.contains("btnAlumnos")) {
    abrirSelectorAlumnos(btn.dataset.id, datosUsuario.entidad);
}

});

// =========================
// PROFESORES
// =========================
async function abrirSelectorProfesores(aulaId, entidad) {

const overlay = document.createElement("div");
overlay.style = `
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.75);display:flex;
justify-content:center;align-items:center;z-index:99999;
`;

overlay.innerHTML = `
<div style="background:#111;padding:20px;color:white;width:800px;">
    <h4>Profesores disponibles</h4>
    <div id="listaProfesores">Cargando...</div>
    <button id="guardar">Guardar</button>
    <button id="cerrar">Cerrar</button>
</div>
`;

document.body.appendChild(overlay);

document.getElementById("cerrar").onclick = () => overlay.remove();

// Aula
const aulaSnap = await getDoc(doc(db, "aulas", aulaId));
const aula = aulaSnap.data();

// asignaturas del curso
const asignaturasSnap = await getDocs(
    query(
        collection(db, "curso_asignaturas"),
        where("cursoId", "==", aula.cursoId),
        where("entidad", "==", entidad)
    )
);

const asignaturasCurso = asignaturasSnap.docs.map(d => d.data().asignatura);

// docentes
const docentesSnap = await getDocs(
    query(
        collection(db, "usuarios"),
        where("entidad", "==", entidad)
    )
);

const lista = document.getElementById("listaProfesores");
lista.innerHTML = "";

let encontrados = 0;

docentesSnap.forEach(d => {

    const data = d.data();

    const nombre = data.repNombre ?? data.nombreResponsable ?? data.email ?? "Sin nombre";

    const modulos = Array.isArray(data.modulos)
        ? data.modulos.map(m => m.asignatura ?? m)
        : [];

    const coincide = modulos.some(m => asignaturasCurso.includes(m));

    if (!coincide) return;

    encontrados++;

    lista.innerHTML += `
        <div>
            <input type="checkbox" value="${d.id}">
            👨‍🏫 ${nombre}
        </div>
    `;
});

if (encontrados === 0) {
    lista.innerHTML = "No hay docentes compatibles.";
}

// guardar
document.getElementById("guardar").onclick = async () => {

const checks = overlay.querySelectorAll("input:checked");

const batch = writeBatch(db);

checks.forEach(c => {

    const ref = doc(db, "aula_integrantes", aulaId + "_" + c.value);

    batch.set(ref, {
        aulaId,
        usuarioId: c.value,
        perfil: "Docente Academia",
        entidad
    });

});

await batch.commit();

overlay.remove();
alert("Guardado");
};

}

});

</script>

</body>
</html>
