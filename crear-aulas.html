<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Plantilla -->
    <link rel="stylesheet" href="componentes/plantilla-academia.css">

    <style>

        .panel-cristal{
            background:rgba(255,255,255,.08);
            backdrop-filter:blur(18px);
            -webkit-backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:18px;
            padding:30px;
            max-width:900px;
        }

        .form-control{
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.2);
            color:white;
        }

        .form-control:focus{
            background:rgba(255,255,255,.12);
            color:white;
            border-color:#c5a059;
            box-shadow:none;
        }

        .form-control::placeholder{
            color:rgba(255,255,255,.5);
        }

        .btn-registrar{
            background:#c5a059;
            border:none;
            color:#111;
            font-weight:600;
            padding:0 25px;
        }

        .btn-registrar:hover{
            background:#d8b26a;
        }

    </style>

</head>
<body>

<div id="plantilla"></div>

<script type="module">

import { db, auth } from "./componentes/firebase-config.js";
import {
    collection, addDoc, doc, getDoc, getDocs, query, where, 
    writeBatch, onSnapshot, orderBy
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// Variables globales para control de estado
let datosUsuario = null;
let unsubscribeAulas = null;

// Inicialización de la UI
async function initApp() {
    const html = await fetch("componentes/plantilla-academia.html");
    document.getElementById("plantilla").innerHTML = await html.text();
    document.getElementById("contenido").innerHTML = `
        <div class="panel-cristal mb-4">
            <h5 class="mb-4">Escriba el nombre del aula y pulse <strong>Registrar</strong>.</h5>
            <div class="d-flex gap-3">
                <input id="txtNombre" type="text" class="form-control" placeholder="Escriba aquí...">
                <button id="btnRegistrar" class="btn btn-registrar">Registrar</button>
            </div>
        </div>
        <div id="listaAulas"></div>
    `;
    await import("./componentes/plantilla-academia.js");
}

await initApp();

const listaAulas = document.getElementById("listaAulas");

onAuthStateChanged(auth, async (user) => {
    if (unsubscribeAulas) unsubscribeAulas(); // Limpiar listener previo
    if (!user) return;

    const usuarioSnap = await getDoc(doc(db, "usuarios", user.uid));
    if (!usuarioSnap.exists()) return;

    datosUsuario = usuarioSnap.data();

    const q = query(
        collection(db, "aulas"),
        where("entidad", "==", datosUsuario.entidad),
        orderBy("nombre_aula")
    );

    unsubscribeAulas = onSnapshot(q, (snapshot) => {
        listaAulas.innerHTML = "";
        snapshot.forEach((docSnap) => {
            const aula = docSnap.data();
            const div = document.createElement("div");
            div.className = "panel-cristal aula-card mb-3";
            div.innerHTML = `
                <h5>${aula.nombre_aula}</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-info btnAlumnos" data-id="${docSnap.id}">Alumnos</button>
                    <button class="btn btn-sm btn-secondary btnProfesores" data-id="${docSnap.id}">Profesores</button>
                </div>
            `;
            listaAulas.appendChild(div);
        });
    });
});

document.addEventListener("click", (e) => {
    if (e.target.classList.contains("btnProfesores")) {
        abrirSelectorProfesores(e.target.dataset.id);
    }
});

async function abrirSelectorProfesores(aulaId) {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.style = "position:fixed; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,.8); display:flex; justify-content:center; align-items:center; z-index:9999;";

    overlay.innerHTML = `
        <div style="width:500px; background:#111; color:white; padding:25px; border-radius:16px;">
            <h4>Asignar Profesores</h4>
            <div id="listaProfesores" style="max-height:300px; overflow-y:auto;">Cargando...</div>
            <div class="mt-3 d-flex justify-content-between">
                <button id="cerrarModal" class="btn btn-danger">Cerrar</button>
                <button id="guardarModal" class="btn btn-success">Guardar</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);

    // Obtener docentes de la entidad y los ya asignados
    const [docentes, asignados] = await Promise.all([
        getDocs(query(collection(db, "usuarios"), where("entidad", "==", datosUsuario.entidad), where("perfil", "==", "Docente Academia"))),
        getDocs(query(collection(db, "aula_integrantes"), where("aulaId", "==", aulaId)))
    ]);

    const lista = document.getElementById("listaProfesores");
    const asignadosIds = asignados.docs.map(d => d.data().usuarioId);
    
    lista.innerHTML = "";
    docentes.forEach(d => {
        const checked = asignadosIds.includes(d.id) ? "checked" : "";
        lista.innerHTML += `<div><input type="checkbox" value="${d.id}" ${checked}> ${d.data().nombreResponsable}</div>`;
    });

    document.getElementById("cerrarModal").onclick = () => overlay.remove();
    document.getElementById("guardarModal").onclick = async () => {
        const batch = writeBatch(db);
        const seleccionados = Array.from(overlay.querySelectorAll("input:checked")).map(i => i.value);
        
        // Aquí podrías agregar lógica para eliminar los que se desmarcaron si fuera necesario
        seleccionados.forEach(id => {
            const ref = doc(db, "aula_integrantes", `${aulaId}_${id}`);
            batch.set(ref, { aulaId, usuarioId: id, perfil: "Docente Academia", entidad: datosUsuario.entidad });
        });
        
        await batch.commit();
        overlay.remove();
        alert("Cambios guardados");
    };
}
    
</script>

</body>
</html>
