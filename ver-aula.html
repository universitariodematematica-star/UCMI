<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI - Panel de Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="componentes/plantilla-academia.css">

    <style>
        /* Mantén aquí tus estilos específicos de esta vista o muévelos a la plantilla */
        body { 
            background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png') no-repeat center center fixed;
            background-size: cover; 
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <div id="plantilla"></div>

    <script type="module">
        // 1. Cargar la plantilla global
        const html = await fetch("componentes/plantilla-academia.html");
        document.getElementById("plantilla").innerHTML = await html.text();

        // 2. Cargar el JS de la plantilla (que maneja el sidebar y logout)
        await import("./componentes/plantilla-academia.js");

        // 3. Cargar el contenido específico de esta página dinámicamente
        // Nota: Asegúrate de tener un archivo 'contenido-solicitudes.html' o similar
        const contenido = await fetch("componentes/contenido-solicitudes.html");
        document.getElementById("contenido").innerHTML = await contenido.text();

        // 4. Inicializar la lógica específica de esta vista
        // Puedes importar aquí el script que antes estaba embebido
        await import("./componentes/solicitudes-logica.js");
    </script>

</body>
</html>
