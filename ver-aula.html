<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI - Panel de Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="componentes/plantilla-academia.css">

    <style>
        body { 
            background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png') no-repeat center center fixed;
            background-size: cover; 
            min-height: 100vh;
        }
        .panel-cristal {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body>

    <div id="plantilla"></div>

    <script type="module">
    import { db } from "./componentes/firebase-config.js";
    import {
        doc,
        getDoc,
        collection,
        query,
        where,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Cargar plantilla
    const html = await fetch("componentes/plantilla-academia.html");
    document.getElementById("plantilla").innerHTML = await html.text();
    await import("./componentes/plantilla-academia.js");

    // Obtener ID del aula
    const params = new URLSearchParams(window.location.search);
    const aulaId = params.get("id");
    const contenidoDiv = document.getElementById("contenido");

    if (!aulaId) {
        contenidoDiv.innerHTML = `<div class="panel-cristal">No se recibió el ID del aula.</div>`;
    } else {
        try {
            // 1. Cargar datos del aula una sola vez
            const aulaSnap = await getDoc(doc(db, "aulas", aulaId));
            
            if (aulaSnap.exists()) {
                const aulaData = aulaSnap.data();

                // 2. Renderizar estructura inicial
                contenidoDiv.innerHTML = `
                <div class="container-fluid py-4">
                    <h2 class="text-white mb-4">${aulaData.nombre_aula}</h2>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="panel-cristal mb-3">
                                <h5><i class="bi bi-person-video3"></i> Profesores Asignados</h5>
                                <ul class="list-group mt-3" id="lista-profesores">
                                    <li class="list-group-item bg-transparent text-white border-0">Cargando...</li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="panel-cristal mb-3">
                                <h5><i class="bi bi-people"></i> Estudiantes</h5>
                                <ul class="list-group mt-3" id="lista-estudiantes">
                                    <li class="list-group-item bg-transparent text-white border-0">Cargando...</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                `;

                // 3. Listener en Tiempo Real para Profesores
                const profQuery = query(collection(db, "aula_docente_asignacion"), where("aulaId", "==", aulaId));
                onSnapshot(profQuery, (profSnap) => {
                    const lista = document.getElementById("lista-profesores");
                    const htmlProf = profSnap.docs.map(d => `
                        <li class="list-group-item bg-transparent text-white border-secondary">
                            ${d.data().asignatura}: <strong>${d.data().nombreResponsable}</strong>
                        </li>
                    `).join('');
                    lista.innerHTML = htmlProf || '<li class="list-group-item bg-transparent text-white border-0">Sin asignaciones</li>';
                });

                // 4. Listener en Tiempo Real para Estudiantes
                const alumQuery = query(collection(db, "aula_integrantes"), where("aulaId", "==", aulaId));
                onSnapshot(alumQuery, (alumSnap) => {
                    const lista = document.getElementById("lista-estudiantes");
                    const htmlAlum = alumSnap.docs.map(d => `
                        <li class="list-group-item bg-transparent text-white border-secondary">
                            ${d.data().nombreResponsable}
                        </li>
                    `).join('');
                    lista.innerHTML = htmlAlum || '<li class="list-group-item bg-transparent text-white border-0">Sin estudiantes</li>';
                });

            } else {
                contenidoDiv.innerHTML = `<div class="panel-cristal">El aula no existe.</div>`;
            }
        } catch (error) {
            console.error("Error cargando aula:", error);
            contenidoDiv.innerHTML = `<div class="panel-cristal">Error al cargar la información.</div>`;
        }
    }
</script>
</body>
</html>
