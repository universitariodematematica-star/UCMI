<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI - Panel de Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="componentes/plantilla-academia.css">

    <style>
        /* Mantén aquí tus estilos específicos de esta vista o muévelos a la plantilla */
        body { 
            background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png') no-repeat center center fixed;
            background-size: cover; 
            min-height: 100vh;
        }
    </style>
</head>
<body>

    <div id="plantilla"></div>

    <script type="module">

import { db } from "./componentes/firebase-config.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// =========================
// CARGAR PLANTILLA
// =========================

const html = await fetch("componentes/plantilla-academia.html");
document.getElementById("plantilla").innerHTML = await html.text();

await import("./componentes/plantilla-academia.js");

// =========================
// CONTENIDO
// =========================

document.getElementById("contenido").innerHTML = `
<div class="container-fluid py-4">

    <h2 id="tituloAula" style="color:white;">
        Cargando...
    </h2>

</div>
`;

// =========================
// LEER ID DEL AULA
// =========================

const params = new URLSearchParams(window.location.search);
const aulaId = params.get("id");

if (!aulaId) {

    document.getElementById("tituloAula").textContent = "Aula no encontrada.";
    throw new Error("No se recibió el parámetro id.");

}

// =========================
// CARGAR NOMBRE DEL AULA
// =========================

const aulaSnap = await getDoc(doc(db, "aulas", aulaId));

if (!aulaSnap.exists()) {

    document.getElementById("tituloAula").textContent = "Aula no encontrada.";

} else {

    document.getElementById("tituloAula").textContent =
        aulaSnap.data().nombre_aula;

}

</script>

</body>
</html>
