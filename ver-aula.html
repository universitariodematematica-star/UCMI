<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI - Panel de Control</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="componentes/plantilla-academia.css">

    <style>
        body { 
            background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png') no-repeat center center fixed;
            background-size: cover; 
            min-height: 100vh;
        }
        .panel-cristal {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body>

    <div id="plantilla"></div>

    <script type="module">
    import { db } from "./componentes/firebase-config.js";
    import {
        doc,
        getDoc,
        collection,
        query,
        where,
        onSnapshot // IMPORTANTE: Agregado para tiempo real
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Cargar plantilla
    const html = await fetch("componentes/plantilla-academia.html");
    document.getElementById("plantilla").innerHTML = await html.text();
    await import("./componentes/plantilla-academia.js");

    const params = new URLSearchParams(window.location.search);
    const aulaId = params.get("id");
    const contenidoDiv = document.getElementById("contenido");

    if (!aulaId) {
        contenidoDiv.innerHTML = `<div class="panel-cristal">No se recibió el ID del aula.</div>`;
    } else {
        // Renderizamos la estructura base una sola vez
        contenidoDiv.innerHTML = `
            <div class="container-fluid py-4">
                <h2 class="text-white mb-4" id="titulo-aula">Cargando aula...</h2>
                <div class="row">
                    <div class="col-md-6">
                        <div class="panel-cristal mb-3">
                            <h5><i class="bi bi-person-video3"></i> Profesores Asignados</h5>
                            <ul class="list-group mt-3" id="lista-profesores"></ul>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="panel-cristal mb-3">
                            <h5><i class="bi bi-people"></i> Estudiantes</h5>
                            <ul class="list-group mt-3" id="lista-estudiantes"></ul>
                        </div>
                    </div>
                </div>
            </div>`;

        // 1. Cargar datos del aula (snapshot para el título)
        onSnapshot(doc(db, "aulas", aulaId), (aulaSnap) => {
            if (aulaSnap.exists()) {
                document.getElementById("titulo-aula").innerText = aulaSnap.data().nombre_aula;
            }
        });

        // 2. Listener para Profesores (en tiempo real)
        const profQuery = query(collection(db, "aula_docente_asignacion"), where("aulaId", "==", aulaId));
        onSnapshot(profQuery, (profSnap) => {
            const htmlProf = profSnap.docs.map(d => `<li class="list-group-item bg-transparent text-white border-secondary">${d.data().asignatura}: <strong>${d.data().nombreResponsable}</strong></li>`).join('');
            document.getElementById("lista-profesores").innerHTML = htmlProf || '<li class="list-group-item bg-transparent text-white border-0">Sin asignaciones</li>';
        });

        // 3. Listener para Estudiantes (en tiempo real)
        const alumQuery = query(collection(db, "aula_integrantes"), where("aulaId", "==", aulaId));
        onSnapshot(alumQuery, (alumSnap) => {
            const htmlAlum = alumSnap.docs.map(d => `<li class="list-group-item bg-transparent text-white border-secondary">${d.data().nombreResponsable}</li>`).join('');
            document.getElementById("lista-estudiantes").innerHTML = htmlAlum || '<li class="list-group-item bg-transparent text-white border-0">Sin estudiantes</li>';
        });
    }
</script>
</body>
</html>
