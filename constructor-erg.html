<!DOCTYPE html>
<html lang="es">

<title>UCMI - Constructor Grammar</title>

<style>

:root{
    --azul:#071426;
    --dorado:#FFD700;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background-image:url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png");
    background-size:cover;
    background-position:center;
}

.contenedor{
    display:flex;
    gap:25px;
    padding:25px;
    min-height:100vh;
}

.panel{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:8px 8px 20px rgba(0,0,0,.45);
}

.izquierda{
    width:22%;
}

.centro{
    width:38%;
}

.derecha{
    width:40%;
}

h2{
    margin-top:0;
    color:#071426;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#FFD700;
    color:#071426;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:translateY(-2px);
}

pre{
    background:#071426;
    color:white;
    border-radius:12px;
    padding:15px;
    height:650px;
    overflow:auto;
    white-space:pre-wrap;
}

iframe{
    width:100%;
    height:650px;
    border:none;
    border-radius:12px;
    background:white;
}

input[type=file]{
    width:100%;
    margin-top:15px;
}

/*==================================================
 UCMI CONTENT BUILDER
==================================================*/

.cabecera-builder{
    background:#071426;
    color:white;
    padding:18px 35px;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
}

.builder-titulo{
    margin:0;
    color:#FFD700;
    font-size:30px;
    font-weight:bold;
    letter-spacing:1px;
}

.builder-subtitulo{
    margin:6px 0 0 0;
    font-size:22px;
    font-weight:bold;
    color:white;
}

.builder-descripcion{
    margin:8px 0 0 0;
    font-size:14px;
    color:#d8d8d8;
}

.builder-info{
    margin-top:10px;
    font-size:13px;
    color:#bdbdbd;
}

.separador-builder{
height:8px;
background:#FFD700;
}    

.barra-turquesa{

width:92%;
margin:25px auto;
border-collapse:collapse;
background:#00b8b8;
border-radius:12px;
overflow:hidden;

}

.barra-turquesa td{

padding:15px;
text-align:center;

}

.barra-turquesa p{

margin:0;
font-size:22px;
font-weight:bold;
color:white;
letter-spacing:1px;

}

.contenedor-relacionar{

display:flex;
gap:40px;
justify-content:center;
margin:20px;

}


.columna-relacionar{

width:300px;

}


.elemento-relacionar{

padding:12px;
margin:10px;
border:2px solid #071426;
border-radius:8px;
cursor:pointer;
background:white;

}


.izquierda-relacionar{

background:#e8f1ff;

}


.derecha-relacionar{

background:#fff8dc;

}    
    
</style>

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="js/ucmi-utilidades.js"></script>
<script src="js/constructor-estado.js"></script>
<script src="js/constructor-utilidades.js"></script>
<script src="js/generador-html-erg.js"></script>
<script src="js/constructor-exportacion.js"></script>
<script src="js/constructor-excel.js"></script>
<script src="js/constructor-lectura.js"></script>    
    
</head>

<body>

<div class="cabecera-builder">
    <h1 class="builder-titulo">
        UCMI CONTENT BUILDER
    </h1>
<div class="builder-subtitulo">
    ERG Constructor
</div>
    <div class="builder-descripcion">
        Constructor de Ejercicios Resueltos de Grammar
    </div>
    <div class="builder-info">
        Versión 1.0 • Ejercicios Resueltos de Grammar
    </div>
</div>    

<div class="contenedor">
    <!-- PANEL IZQUIERDO -->
    <div class="panel izquierda">
        <h2>Proyecto ERG</h2>
        <button onclick="descargarPlantilla()">
            Descargar plantilla Excel ERG
        </button>
        <button onclick="descargarPlantillaUCMI()">
            Descargar plantilla UCMI ERG
        </button>
        <input 
            id="excelInput"
            type="file"
            accept=".xlsx">

    </div>

    <!-- PANEL CENTRAL -->

    <div class="panel centro">

        <h2>Editor HTML</h2>

        <button onclick="copiarCodigo()">
            Copiar HTML
        </button>

        <button onclick="descargarHTML()">
            Exportar HTML
        </button>

        <button onclick="abrirNuevaPestana()">
            Vista previa completa
        </button>

        <pre id="codigo"></pre>

    </div>

    <div class="separador-builder"></div>

    <!-- PANEL DERECHO -->

    <div class="panel derecha">

        <h2>Vista previa</h2>

        <iframe id="preview"></iframe>

    </div>

</div>

<!--==================================================
FIN - CABECERA DEL CONSTRUCTOR
===================================================-->

</html>
