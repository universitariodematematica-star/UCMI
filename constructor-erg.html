<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background-image:url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png");
    background-size:cover;
    background-position:center;
}    

.barra-turquesa{

width:92%;
margin:25px auto;
border-collapse:collapse;
background:#00b8b8;
border-radius:12px;
overflow:hidden;

}

.barra-turquesa td{

padding:15px;
text-align:center;

}

.barra-turquesa p{

margin:0;
font-size:22px;
font-weight:bold;
color:white;
letter-spacing:1px;

}

.contenedor-relacionar{

display:flex;
gap:40px;
justify-content:center;
margin:20px;

}


.columna-relacionar{

width:300px;

}


.elemento-relacionar{

padding:12px;
margin:10px;
border:2px solid #071426;
border-radius:8px;
cursor:pointer;
background:white;

}


.izquierda-relacionar{

background:#e8f1ff;

}


.derecha-relacionar{

background:#fff8dc;

}    
    
</style>

<link rel="stylesheet" href="css/constructor-base.css">
<link rel="stylesheet" href="css/constructor-layout.css">
<link rel="stylesheet" href="css/constructor-builder.css">    

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<script src="js/ucmi-utilidades.js"></script>
<script src="js/constructor-estado.js"></script>
<script src="js/constructor-utilidades.js"></script>
<script src="js/generador-html-erg.js"></script>
<script src="js/constructor-generador.js"></script>
<script src="js/constructor-exportacion.js"></script>
<script src="js/constructor-excel.js"></script>
<script src="js/constructor-lectura.js"></script>
<script src="js/constructor-eventos.js"></script>    
    
</head>

<body>

<div class="cabecera-builder">
    <h1 class="builder-titulo">
        UCMI CONTENT BUILDER
    </h1>
<div class="builder-subtitulo">
    ERG Constructor
</div>
    <div class="builder-descripcion">
        Constructor de Ejercicios Resueltos de Grammar
    </div>
    <div class="builder-info">
        Versión 1.0 • Ejercicios Resueltos de Grammar
    </div>
</div>    

<div class="contenedor">
    <!-- PANEL IZQUIERDO -->
    <div class="panel izquierda">
        <h2>Proyecto ERG</h2>
        <button onclick="descargarPlantilla()">
            Descargar plantilla Excel ERG
        </button>
        <button onclick="descargarPlantillaUCMI()">
            Descargar plantilla UCMI ERG
        </button>
        <input 
            id="excelInput"
            type="file"
            accept=".xlsx">

    </div>

    <!-- PANEL CENTRAL -->

    <div class="panel centro">

        <h2>Editor HTML</h2>

        <button onclick="copiarCodigo()">
            Copiar HTML
        </button>

        <button onclick="descargarHTML()">
            Exportar HTML
        </button>

        <button onclick="abrirNuevaPestana()">
            Vista previa completa
        </button>

        <pre id="codigo"></pre>

    </div>

    <div class="separador-builder"></div>

    <!-- PANEL DERECHO -->

    <div class="panel derecha">

        <h2>Vista previa</h2>

        <iframe id="preview"></iframe>

    </div>

</div>

</script>
