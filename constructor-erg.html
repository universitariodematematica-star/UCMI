function leerCelda(celda){

    let valor = celda.value;

    if (valor === null || valor === undefined){
        return "";
    }

    // Si ya es texto, número o booleano
    if (typeof valor !== "object"){
        return String(valor);
    }

    // Fórmula con resultado calculado
    if ("result" in valor){
        if (valor.result === null || valor.result === undefined){
            return "";
        }
        return String(valor.result);
    }

    // Texto enriquecido
    if (valor.richText){
        return valor.richText.map(x => x.text || "").join("");
    }

    // Texto
    if ("text" in valor){
        return String(valor.text || "");
    }

    // Hipervínculo
    if ("hyperlink" in valor){
        return String(valor.hyperlink || "");
    }

    // Fecha
    if (valor instanceof Date){
        return valor.toISOString();
    }

    // Último recurso
    return "";
}

    function normalizarTexto(texto){

    return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ñ/g,"n")
    .replace(/[^a-z0-9]/g,"");

}

/*====================================================
NORMALIZAR RESPUESTA DE TRADUCCIÓN
====================================================*/

function normalizarRespuestaTraduccion(texto){

    if(texto === null || texto === undefined){

        return "";

    }

    texto = String(texto)

        .toLowerCase()

        .trim()

        .replace(/\s+/g," ")

        // eliminar signos de puntuación excepto apóstrofe
        .replace(/[.,!?;:]/g,"");


    //========================================
    // Expandir contracciones
    //========================================

    const contracciones = {

        "i'm":"i am",
        "you're":"you are",
        "he's":"he is",
        "she's":"she is",
        "it's":"it is",
        "we're":"we are",
        "they're":"they are",

        "i've":"i have",
        "you've":"you have",
        "we've":"we have",
        "they've":"they have",

        "i'll":"i will",
        "you'll":"you will",
        "he'll":"he will",
        "she'll":"she will",
        "we'll":"we will",
        "they'll":"they will",

        "don't":"do not",
        "doesn't":"does not",
        "didn't":"did not",

        "can't":"cannot",
        "won't":"will not",

        "isn't":"is not",
        "aren't":"are not",
        "wasn't":"was not",
        "weren't":"were not",

        "hasn't":"has not",
        "haven't":"have not",
        "hadn't":"had not",

        "shouldn't":"should not",
        "wouldn't":"would not",
        "couldn't":"could not",

        "there's":"there is",
        "that's":"that is",
        "what's":"what is",
        "who's":"who is",
        "where's":"where is",
        "when's":"when is",
        "why's":"why is",
        "how's":"how is"

    };


    Object.entries(contracciones).forEach(

        ([contraccion, expansion])=>{

            texto = texto.replace(

                new RegExp("\\b"+contraccion+"\\b","g"),

                expansion

            );

        }

    );

    return texto;

}

async function copiarCodigo(){

    const codigo = document.getElementById("codigo").textContent;

    try{

        await navigator.clipboard.writeText(codigo);

        alert("Código copiado al portapapeles.");

    }catch(error){

        // Compatibilidad con navegadores antiguos
        const textarea = document.createElement("textarea");

        textarea.value = codigo;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        document.body.removeChild(textarea);

        alert("Código copiado al portapapeles.");

    }

}


function descargarHTML(){

    const codigo = document.getElementById("codigo").textContent;

    if(!codigo.trim()){

        alert("No hay ningún código generado.");

        return;

    }

    // Nombre automático del archivo
    let nombre = "grammar";

    if(datosPagina.unidad && datosPagina.tema){

        nombre = `grammar-U${datosPagina.unidad}-T${datosPagina.tema}`;

    }

    const blob = new Blob(
        [codigo],
        {type:"text/html;charset=utf-8"}
    );

    const enlace = document.createElement("a");

    enlace.href = URL.createObjectURL(blob);

    enlace.download = nombre + ".html";

    document.body.appendChild(enlace);

    enlace.click();

    document.body.removeChild(enlace);

    URL.revokeObjectURL(enlace.href);

}
