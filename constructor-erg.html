function leerCelda(celda){

    let valor = celda.value;

    if (valor === null || valor === undefined){
        return "";
    }

    // Si ya es texto, número o booleano
    if (typeof valor !== "object"){
        return String(valor);
    }

    // Fórmula con resultado calculado
    if ("result" in valor){
        if (valor.result === null || valor.result === undefined){
            return "";
        }
        return String(valor.result);
    }

    // Texto enriquecido
    if (valor.richText){
        return valor.richText.map(x => x.text || "").join("");
    }

    // Texto
    if ("text" in valor){
        return String(valor.text || "");
    }

    // Hipervínculo
    if ("hyperlink" in valor){
        return String(valor.hyperlink || "");
    }

    // Fecha
    if (valor instanceof Date){
        return valor.toISOString();
    }

    // Último recurso
    return "";
}

function capitalizar(texto){

    texto = String(texto).trim();

    if(texto===""){
        return "";
    }

    texto = texto.toLowerCase();

    return texto.replace(
        /^([¡¿]*)([a-záéíóúñ])/i,
        function(_, signos, letra){
            return signos + letra.toUpperCase();
        }
    );

}

function extraerImagenesBlogger(){

    const codigo =
    document.getElementById("codigoBlogger").value;


    const patron =
    /https:\/\/blogger\.googleusercontent\.com\/[^"]+/gi;


    const coincidencias =
    codigo.match(patron);


    if(!coincidencias){

        console.log("No se encontraron imágenes");

        alert("No se encontraron URLs de Blogger");

        return;

    }


    imagenesBlogger =
    coincidencias.map(url=>url);


    console.log("URLs encontradas:");

    console.log(imagenesBlogger);


    asignarImagenes();

}  

    function normalizarTexto(texto){

    return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ñ/g,"n")
    .replace(/[^a-z0-9]/g,"");

}



function asignarImagenes(){

    vocabularioGlobal.forEach(item=>{


        let palabrasBuscar = [

            normalizarTexto(item.ingles),

            normalizarTexto(item.espanol)

        ];



        let encontrada = imagenesBlogger.find(url=>{


            let nombreArchivo = url
            .split("/")
            .pop()
            .replace(/\.(png|jpg|jpeg|webp)$/i,"");



            nombreArchivo = normalizarTexto(nombreArchivo);



            return palabrasBuscar.some(palabra=>

                nombreArchivo.includes(palabra)

            );


        });



        if(encontrada){

            item.imagen = encontrada;

        }


    });



    generarCodigoActualizado();

}

async function copiarCodigo(){

    const codigo = document.getElementById("codigo").textContent;

    try{

        await navigator.clipboard.writeText(codigo);

        alert("Código copiado al portapapeles.");

    }catch(error){

        // Compatibilidad con navegadores antiguos
        const textarea = document.createElement("textarea");

        textarea.value = codigo;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        document.body.removeChild(textarea);

        alert("Código copiado al portapapeles.");

    }

}


function descargarHTML(){

    const codigo = document.getElementById("codigo").textContent;

    if(!codigo.trim()){

        alert("No hay ningún código generado.");

        return;

    }

    // Nombre automático del archivo
    let nombre = "grammar";

    if(datosPagina.unidad && datosPagina.tema){

        nombre = `grammar-U${datosPagina.unidad}-T${datosPagina.tema}`;

    }

    const blob = new Blob(
        [codigo],
        {type:"text/html;charset=utf-8"}
    );

    const enlace = document.createElement("a");

    enlace.href = URL.createObjectURL(blob);

    enlace.download = nombre + ".html";

    document.body.appendChild(enlace);

    enlace.click();

    document.body.removeChild(enlace);

    URL.revokeObjectURL(enlace.href);

}
