<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ver contenido</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:#06090f;
    color:white;
    padding:40px;
}

.panel{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    border: 1px solid rgba(255,255,255,0.15);
}
</style>
</head>

<body>

<div class="panel">

    <iframe
        id="visorContenido"
        style="
            width:100%;
            min-height:900px;
            border:none;
            border-radius:15px;
            background:white;
        ">
    </iframe>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import { activarRenderMatematico } from "./js/render-matematicas.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const topicoId = params.get("topicoId");

async function cargar(){

    const q = query(
        collection(db, "contenidos"),
        where("topicoId", "==", topicoId)
    );

    const snap = await getDocs(q);

    const iframe = document.getElementById("visorContenido");

    const docIframe = iframe.contentWindow.document;

    if(!snap.empty){

        const data = snap.docs[0].data();

        docIframe.open();

docIframe.write(`

<script>

window.onerror = function(
    mensaje,
    archivo,
    linea
){

    const mostrar = () => {

        const error = document.createElement("div");

        error.style.background="#5c1a1a";
        error.style.color="white";
        error.style.padding="20px";
        error.style.borderRadius="15px";
        error.style.margin="20px";
        error.style.fontFamily="Segoe UI";

        error.innerHTML =
        "<h3>Error en el contenido interactivo:</h3>" +
        "<p>" + mensaje + "</p>" +
        "<small>Línea: " + linea + "</small>";

        document.body.prepend(error);

    };

    window.addEventListener(
        "DOMContentLoaded",
        mostrar
    );

};

<\/script>

${data.html}

`);

docIframe.close();

activarRenderMatematico(docIframe);

    }else{

        docIframe.open();
        docIframe.write(`
            <!DOCTYPE html>
            <html>
            <body style="font-family:Segoe UI;padding:30px;">
                <h2>No hay contenido aún.</h2>
            </body>
            </html>
        `);
        docIframe.close();

    }

}

cargar();

</script>
<script type="module" src="js/alertas-globales.js"></script>
</body>
</html>
