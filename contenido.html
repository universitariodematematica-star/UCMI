<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ver contenido</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', sans-serif;

    background-image:
    linear-gradient(
        rgba(6,9,15,0.75),
        rgba(6,9,15,0.75)
    ),
    url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png');

    background-size:cover;
    background-position:center;

    padding:40px;
}


.panel{

    width:85%;
    max-width:1100px;
    margin:auto;

    background:
    rgba(255,255,255,0.12);

    backdrop-filter:
    blur(25px);

    -webkit-backdrop-filter:
    blur(25px);

    border-radius:25px;

    padding:35px;

    border:
    1px solid rgba(255,255,255,0.25);

    box-shadow:
    0 20px 50px rgba(0,0,0,0.6);

}
</style>
</head>

<body>

<div class="panel">

    <iframe
        id="visorContenido"
        style="
            width:100%;
            min-height:900px;
            border:none;
            border-radius:15px;
            background:rgba(255,255,255,0.95);
        ">
    </iframe>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import { activarRenderMatematico } from "./js/render-matematicas.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);

const topicoId = params.get("topicoId");

const codigoContenido = params.get("codigoContenido");


// AQUÍ PEGAREMOS EL NUEVO VISOR DINÁMICO

async function cargarContenido(codigo){

    const q = query(
        collection(db,"contenidos"),
        where("codigoContenido","==",codigo)
    );


    const snap = await getDocs(q);


    const iframe = document.getElementById("visorContenido");


    const docIframe = iframe.contentWindow.document;


    if(!snap.empty){


        const data = snap.docs[0].data();


        docIframe.open();


        docIframe.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

</head>


<body>


<script>

window.onerror = function(
    mensaje,
    archivo,
    linea
){

    const error = document.createElement("div");


    error.style.background="#5c1a1a";
    error.style.color="white";
    error.style.padding="20px";
    error.style.borderRadius="15px";
    error.style.margin="20px";
    error.style.fontFamily="Segoe UI";


    error.innerHTML =

    "<h3>Error en el contenido interactivo:</h3>" +

    "<p>" + mensaje + "</p>" +

    "<small>Línea: " + linea + "</small>";


    document.body.prepend(error);

};


<\/script>


${data.html}


</body>

</html>

`);


        docIframe.close();


        activarRenderMatematico(docIframe);


    }else{


        docIframe.open();


        docIframe.write(`

<!DOCTYPE html>

<html>

<body style="font-family:Segoe UI;padding:30px;">


<h2>No hay contenido aún.</h2>


</body>

</html>

`);


        docIframe.close();


    }


}



// CARGA INICIAL

if(codigoContenido){

    cargarContenido(codigoContenido);

}

else if(topicoId){

    const q = query(
        collection(db,"contenidos"),
        where("topicoId","==",topicoId)
    );


    getDocs(q).then(snap=>{


        if(!snap.empty){


            cargarContenido(
                snap.docs[0].data().codigoContenido
            );


        }


    });


}
    
</script>
<script type="module" src="js/alertas-globales.js"></script>
</body>
</html>
