<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Constructor Grammar</title>

<style>

:root{

    --azul:#071426;
    --dorado:#FFD700;

}

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background-image:url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png");

    background-size:cover;

    background-position:center;

}

.contenedor{

    display:flex;

    gap:25px;

    padding:25px;

    min-height:100vh;

}

.panel{

    background:white;

    border-radius:18px;

    padding:20px;

    box-shadow:8px 8px 20px rgba(0,0,0,.45);

}

.izquierda{

    width:22%;

}

.centro{

    width:38%;

}

.derecha{

    width:40%;

}

h2{

    margin-top:0;

    color:#071426;

}

button{

    width:100%;

    margin-top:15px;

    padding:14px;

    border:none;

    border-radius:12px;

    background:#FFD700;

    color:#071426;

    font-weight:bold;

    cursor:pointer;

}

button:hover{

    transform:translateY(-2px);

}

pre{

    background:#071426;

    color:white;

    border-radius:12px;

    padding:15px;

    height:650px;

    overflow:auto;

    white-space:pre-wrap;

}

iframe{

    width:100%;

    height:650px;

    border:none;

    border-radius:12px;

    background:white;

}

input[type=file]{

    width:100%;

    margin-top:15px;

}

</style>

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>    

</head>

<body>

<div class="contenedor">

    <!-- PANEL IZQUIERDO -->

    <div class="panel izquierda">

        <h2>Proyecto</h2>

        <button onclick="descargarPlantilla()">
            Descargar plantilla Excel
        </button>

        <input 
            id="excelInput"
            type="file"
            accept=".xlsx">

        <div id="panelImagenes" style="display:none; margin-top:20px;">

    <h3>Imágenes del vocabulario</h3>

    <div id="listaImagenes"></div>

</div>

        <button disabled>
            Página generada automáticamente
        </button>

    </div>

    <!-- PANEL CENTRAL -->

    <div class="panel centro">

        <h2>Código generado</h2>

        <button>
            Copiar código
        </button>

        <button>
            Descargar HTML
        </button>

        <button onclick="abrirNuevaPestana()">
            Abrir en pestaña nueva
        </button>

        <pre id="codigo"></pre>

    </div>

    <!-- PANEL DERECHO -->

    <div class="panel derecha">

        <h2>Vista previa</h2>

        <iframe id="preview"></iframe>

    </div>

</div>

<script>

function generarCodigo(
    tituloIngles="",
    unidad="",
    tema="",
    video="",
    audios=[],
    nivel="",
    vocabulario=[]
){

const codigo = `<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI</title>

<link rel="stylesheet" href="css/ucmi-estilos.css">

<link rel="stylesheet" href="css/pizarra.css">

<link rel="stylesheet" href="css/reproductor.css">

<style>

.tabla-vocabulario{

width:80%;

margin-top:20px;

border-collapse:separate;

border-spacing:0 10px;

background:#3498db;

border-radius:10px;

overflow:hidden;

}



.tabla-vocabulario td{

border:1px solid #000;

padding:8px;

background:white;

color:black;

text-align:center;

}



.tabla-vocabulario img{

width:110px;

height:110px;

object-fit:contain;

display:block;

margin:auto;

}


</style>

</head>

<body>

<div id="navegacionUCMI" class="navegacion-ucmi">

<a class="boton-interactivo">
VOLVER AL TEMARIO
</a>

<a class="boton-interactivo" id="botonSiguiente">
SEGUIR
</a>

<a class="boton-interactivo">
VOLVER A SKILLS
</a>

</div>

<div id="ucmiEncabezado"></div>

${video ? `

<a class="boton-interactivo"
href="${video}"
target="_blank">

Video G.${unidad}.${tema}

</a>

` : ""}

<table class="barra-carmesi">

<tr>

<td>

<p>

VOCABULARY

</p>

</td>

</tr>

</table>


${audios.length > 0 ? `

<div class="audioUCMI">

<audio controls>

<source src="${audios[0].archivo}" type="audio/mpeg">

Tu navegador no soporta audio.

</audio>


<p>

AG.${unidad}.${tema}.1.${nivel}

</p>


</div>

` : ""}



<div id="contenidoUCMI">


${vocabulario.length > 0 ? `

<table class="tabla-vocabulario">


<tr>

${vocabulario.map(item=>`

<td>

${item.imagen ? 
`
<img src="${item.imagen}">
`
:
`
<div style="height:110px">
Sin imagen
</div>
`
}

</td>

`).join("")}

</tr>



<tr>

${vocabulario.map(item=>`

<td>

${item.ingles}

</td>

`).join("")}

</tr>



<tr>

${vocabulario.map(item=>`

<td>

${item.espanol}

</td>

`).join("")}

</tr>


</table>

` : ""}


</div>

<canvas id="drawingCanvas"></canvas>

<script src="js/pizarra.js"><\/script>

<script src="js/navegacion.js"><\/script>

<script src="js/encabezado.js"><\/script>

<script src="js/reproductor.js"><\/script>

<script>

UCMIPizarra.iniciar();

UCMINavegacion.iniciar("grammar");

UCMIEncabezado.iniciar({

titulo:"${unidad}.${tema} ${tituloIngles.toUpperCase()}",

skill:"Grammar"

});

UCMIAudio.cargar(

${JSON.stringify(
audios.map(audio=>({

titulo:
`AG.${unidad}.${tema}.${audio.numero}.${nivel}`,
    
archivo:
audio.archivo

}))
)}

);

<\/script>

</body>

</html>`;

document.getElementById("codigo").textContent = codigo;

document.getElementById("preview").srcdoc = codigo;

}

async function descargarPlantilla(){

    const libro = new ExcelJS.Workbook();

    const hoja = libro.addWorksheet("Grammar");


    // ENCABEZADOS

hoja.getCell("A1").value = "Nivel";

hoja.getCell("B1").value = "Unidad";

hoja.getCell("C1").value = "Tema";

hoja.getCell("D1").value = "Título en inglés";

hoja.getCell("E1").value = "Título en español";

hoja.getCell("F1").value = "Video";

// AUDIOS

for(let i = 1; i <= 11; i++){

    hoja.getCell(1, 6 + i).value = "Audio " + i;

}

// VOCABULARIO

let columnaVocabulario = 18; // Columna R

for(let i = 1; i <= 10; i++){

    hoja.getCell(1, columnaVocabulario).value = "Inglés " + i;

    hoja.getCell(1, columnaVocabulario + 1).value = "Español " + i;

    columnaVocabulario += 2;

}    
       

    // ESTILO ENCABEZADOS

    ["A1","B1","C1"].forEach(celda=>{

        hoja.getCell(celda).font = {
            bold:true
        };

    });



   // NIVEL: LISTA DESPLEGABLE

hoja.getCell("A2").dataValidation = {

    type:"list",

    allowBlank:false,

    formulae:[
        '"A1,A2,B1,B1+,B2,B2+,C1,C2"'
    ]

};



    // UNIDAD: ENTEROS POSITIVOS

    hoja.getCell("B2").dataValidation = {

        type:"whole",

        operator:"greaterThan",

        allowBlank:true,

        formulae:[0]

    };



    // TEMA: ENTEROS POSITIVOS

    hoja.getCell("C2").dataValidation = {

        type:"whole",

        operator:"greaterThan",

        allowBlank:true,

        formulae:[0]

    };



    // ANCHO DE COLUMNAS

hoja.getColumn("A").width = 15;

hoja.getColumn("B").width = 15;

hoja.getColumn("C").width = 15;

hoja.getColumn("D").width = 30;

hoja.getColumn("E").width = 30;

hoja.getColumn("F").width = 40;

    for(let i = 7; i <= 17; i++){

    hoja.getColumn(i).width = 40;

}   

for(let i = 18; i <= 37; i++){

    hoja.getColumn(i).width = 25;

}    



    const archivo = await libro.xlsx.writeBuffer();



    const blob = new Blob(

        [archivo],

        {
            type:
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        }

    );



    const enlace = document.createElement("a");


    enlace.href =
    URL.createObjectURL(blob);


    enlace.download =
    "plantilla-grammar.xlsx";


    enlace.click();

}

async function leerExcel(event){

    const archivo = event.target.files[0];

    if(!archivo) return;


    const buffer = await archivo.arrayBuffer();


    const libro = new ExcelJS.Workbook();


    await libro.xlsx.load(buffer);


    const hoja = libro.getWorksheet("Grammar");


    const tituloIngles =
    hoja.getCell("D2").value || "";

    const unidad =
hoja.getCell("B2").value || "";

const tema =
hoja.getCell("C2").value || "";


const video =
hoja.getCell("F2").text || "";

    let audios = [];


for(let i = 1; i <= 11; i++){

    let columna = 6 + i;


    let ruta =
hoja.getCell(2,columna).value || "";

if(typeof ruta === "object"){

    ruta = ruta.text || "";

}


    if(ruta){

        audios.push({

            numero:i,

            archivo:ruta

        });

    }

}

let vocabulario=[];


for(let i=0;i<10;i++){

    let columna =
    18 + (i*2);


    let ingles =
    hoja.getCell(2,columna).value || "";


    let espanol =
    hoja.getCell(2,columna+1).value || "";


    if(ingles && espanol){

        vocabulario.push({

            ingles:ingles,

            espanol:espanol,

            imagen:""

        });

    }

}

    document.getElementById("panelImagenes").style.display="block";

crearPanelImagenes(vocabulario);

    
    generarCodigo(
tituloIngles,
unidad,
tema,
video,
audios,
hoja.getCell("A2").text || "",
vocabulario
);

}

function crearPanelImagenes(vocabulario){

    const lista =
    document.getElementById("listaImagenes");

    lista.innerHTML="";

    vocabulario.forEach((item,indice)=>{

        const tarjeta =
        document.createElement("div");

        tarjeta.style.border="1px solid #ccc";
        tarjeta.style.borderRadius="10px";
        tarjeta.style.padding="10px";
        tarjeta.style.marginBottom="15px";
        tarjeta.style.background="white";

        tarjeta.innerHTML=`

            <b>${item.ingles}</b><br>
            <small>${item.espanol}</small>

            <br><br>

            <input
                type="file"
                accept="image/*"
                id="imagen${indice}">

        `;

        lista.appendChild(tarjeta);

    });

}    

function abrirNuevaPestana(){

    const codigo =
    document.getElementById("codigo").textContent;


    const nuevaVentana =
    window.open();


    nuevaVentana.document.open();


    nuevaVentana.document.write(codigo);


    nuevaVentana.document.close();

}    

generarCodigo();

document
.getElementById("excelInput")
.addEventListener(
"change",
leerExcel
);    

</script>    

</body>

</html>
