<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Constructor Grammar</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">


<style>

/*====================================================
    VARIABLES UCMI
====================================================*/

:root{

    --azul-ucmi:#004dc0;
    --azul-profundo:#071426;
    --dorado:#FFD700;
    --blanco:#ffffff;

}


/*====================================================
    PÁGINA
====================================================*/


body{

    margin:0;

    min-height:100vh;

    font-family:'Poppins',sans-serif;


    background-image:url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png');


    background-size:cover;

    background-position:center;

}



/*====================================================
    CONTENEDOR PRINCIPAL
====================================================*/


.constructor-container{


    display:flex;

    gap:25px;

    padding:30px;

    min-height:100vh;

    box-sizing:border-box;


}



/*====================================================
    PANELES
====================================================*/


.panel{


    background:rgba(255,255,255,0.92);

    border-radius:20px;

    padding:25px;

    box-shadow:
    8px 8px 25px rgba(0,0,0,.45);


}



.panel-constructor{


    width:35%;

}


.panel-codigo{


    width:65%;

}




/*====================================================
    TITULOS
====================================================*/


h1{


    margin-top:0;

    color:var(--azul-profundo);

    font-size:24px;

}



h2{


    color:var(--azul-ucmi);

    font-size:18px;

}



/*====================================================
    CAMPOS
====================================================*/


label{


    display:block;

    margin-top:15px;

    margin-bottom:5px;

    font-weight:600;

    color:#333;

}



input,
textarea{


    width:100%;

    padding:12px;

    border-radius:10px;

    border:1px solid #ccc;

    box-sizing:border-box;

    font-family:Poppins,sans-serif;

}



/*====================================================
    ÁREA DE CÓDIGO
====================================================*/


pre{


    background:#071426;

    color:white;

    padding:20px;

    border-radius:15px;

    min-height:500px;

    overflow:auto;

}



/*====================================================
    BOTÓN
====================================================*/


button{


    margin-top:20px;

    padding:12px 25px;

    border:none;

    border-radius:12px;

    background:var(--dorado);

    color:#071426;

    font-weight:bold;

    cursor:pointer;


}



button:hover{


    transform:scale(1.05);


}



</style>


</head>



<body>



<div class="constructor-container">



    <!-- PANEL IZQUIERDO -->

    <div class="panel panel-constructor">


        <h1>
            Constructor Grammar UCMI
        </h1>


        <h2>
            Datos de la página
        </h2>


        <label>
            Título barra negra
        </label>


        <input 
        type="text"
        placeholder="Ejemplo: ENGLISH GRAMMAR A1">



        <label>
            Skill barra azul
        </label>


        <input 
        type="text"
        value="Grammar">


    </div>





    <!-- PANEL DERECHO -->


    <div class="panel panel-codigo">


        <h1>
            Código generado
        </h1>


        <pre>

Aquí aparecerá el código HTML generado.


        </pre>


    </div>



</div>



</body>


</html>
