<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Constructor Grammar</title>


<style>

:root{

    --azul-ucmi:#004dc0;
    --azul-profundo:#071426;
    --dorado:#FFD700;

}


/*=============================
        CUERPO
=============================*/


body{

    margin:0;

    min-height:100vh;

    font-family:Arial, sans-serif;


    background-image:url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png');

    background-size:cover;

    background-position:center;

}



/*=============================
        CONTENEDOR
=============================*/


.contenedor{


    display:flex;

    gap:25px;

    padding:30px;

    box-sizing:border-box;

    min-height:100vh;


}



/*=============================
        PANELES
=============================*/


.panel{


    background:white;

    border-radius:20px;

    padding:25px;

    box-shadow:8px 8px 20px rgba(0,0,0,.5);


}



.izquierda{

    width:30%;

}



.derecha{

    width:70%;

}




h1{

    color:var(--azul-profundo);

}



label{

    font-weight:bold;

    display:block;

    margin-top:20px;

}



input{


    width:100%;

    padding:12px;

    margin-top:8px;

    border-radius:10px;

    border:1px solid #ccc;

    box-sizing:border-box;

}




pre{

    background:#071426;

    color:white;

    padding:20px;

    border-radius:15px;

    height:650px;

    overflow:auto;

    white-space:pre-wrap;

}



</style>


</head>



<body>


<div class="contenedor">



<!-- =========================
        FORMULARIO
========================= -->


<div class="panel izquierda">


<h1>
Constructor Grammar
</h1>



<label>

Título barra negra:

</label>


<input 
id="titulo"
placeholder="Ejemplo: ENGLISH GRAMMAR A1">



</div>




<!-- =========================
        CODIGO GENERADO
========================= -->


<div class="panel derecha">


<h1>
Código generado
</h1>


<button onclick="copiarCodigo()">
    Copiar código
</button>


<pre id="codigo"></pre>


</div>



</div>




<script>


function generarCodigo(){


let titulo =
document.getElementById("titulo").value;



let codigo = `

<!DOCTYPE html>
<html lang="es">

<head>

<link rel="stylesheet" href="css/ucmi-estilos.css">

<link rel="stylesheet" href="css/pizarra.css">

<link rel="stylesheet" href="css/reproductor.css">


</head>


<body>



<!-- NAVEGACIÓN -->

<div id="navegacionUCMI" class="navegacion-ucmi">


<a class="boton-interactivo">

VOLVER AL TEMARIO

</a>


<a class="boton-interactivo" id="botonSiguiente">

SEGUIR

</a>


<a class="boton-interactivo">

VOLVER A SKILLS

</a>


</div>





<!-- ENCABEZADO -->

<div id="ucmiEncabezado"></div>





<!-- CONTENIDO GRAMMAR -->

<div id="contenidoUCMI">


</div>





<!-- PIZARRA -->

<canvas id="drawingCanvas"></canvas>






<script src="js/pizarra.js"><\/script>

<script src="js/navegacion.js"><\/script>

<script src="js/encabezado.js"><\/script>

<script src="js/reproductor.js"><\/script>



<script>


UCMIPizarra.iniciar();



UCMINavegacion.iniciar("grammar");



UCMIEncabezado.iniciar({

titulo:"${titulo}",

skill:"Grammar"

});



<\/script>




</body>

</html>

`;



document.getElementById("codigo").textContent=codigo;



}



document
.getElementById("titulo")
.addEventListener(
"input",
generarCodigo
);



// Generar al abrir

generarCodigo();



</script>



</body>

</html>
