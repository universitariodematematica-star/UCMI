<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Constructor Grammar</title>

<style>

:root{

    --azul:#071426;
    --dorado:#FFD700;

}

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background-image:url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png");

    background-size:cover;

    background-position:center;

}

.contenedor{

    display:flex;

    padding:25px;

}

.panel{

    background:white;

}

.izquierda{

}

.centro{

}

.derecha{

}

h2{

}

button{

    width:100%;

    color:#071426;

    font-weight:bold;

    cursor:pointer;

}

button:hover{

    transform:translateY(-2px);

}

pre{

    background:#071426;

    color:white;

    padding:15px;

    overflow:auto;

    white-space:pre-wrap;

}

iframe{

    width:100%;

}

input[type=file]{

    width:100%;

    margin-top:15px;

}

</style>

<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>    

</head>

<body>

<div class="contenedor">

    <!-- PANEL IZQUIERDO -->

    <div class="panel izquierda">

        <h2>Proyecto</h2>

        <button onclick="descargarPlantilla()">
            Descargar plantilla Excel
        </button>

        <input 
            id="excelInput"
            type="file"
            accept=".xlsx">

        <div style="margin-top:20px;">

<h3>Código de Blogger</h3>

<textarea
id="codigoBlogger"
placeholder="Pega aquí el código HTML generado por Blogger"
style="width:100%;height:180px;">
</textarea>

<button onclick="extraerImagenesBlogger()">
Cargar imágenes Blogger
</button>

</div>

        <button disabled>
            Página generada automáticamente
        </button>

    </div>

    <!-- PANEL CENTRAL -->

    <div class="panel centro">

        <h2>Código generado</h2>

        <button>
            Copiar código
        </button>

        <button>
            Descargar HTML
        </button>

        <button onclick="abrirNuevaPestana()">
            Abrir en pestaña nueva
        </button>

        <pre id="codigo"></pre>

    </div>

    <!-- PANEL DERECHO -->

    <div class="panel derecha">

        <h2>Vista previa</h2>

        <iframe id="preview"></iframe>

    </div>

</div>

<script>

let datosPagina = {

tituloIngles:"",
tituloEspanol:"",
unidad:"",
tema:"",
video:"",
audios:[],
nivel:""

};

let vocabularioGlobal = [];

let imagenesBlogger = [];    


function crearTabla(lista){

    return `

<table class="tabla-vocabulario">

<tr>

${lista.map(item=>`

<td>

${item.imagen ?

`<img src="${item.imagen}">`

:

`<div style="height:120px;display:flex;align-items:center;justify-content:center;color:#888;">
Imagen pendiente
</div>`

}

</td>

`).join("")}

</tr>

<tr>

${lista.map(item=>`

<td>${item.ingles}</td>

`).join("")}

</tr>

<tr>

${lista.map(item=>`

<td>${item.espanol}</td>

`).join("")}

</tr>

</table>

`;

}    

function generarCodigo(
    tituloIngles="",
    tituloEspanol="",
    unidad="",
    tema="",
    video="",
    audios=[],
    nivel="",
    vocabulario=[],
    introduccionGeneral=""
){

const codigo = `<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI</title>

<link rel="stylesheet" href="css/ucmi-estilos.css">

<link rel="stylesheet" href="css/pizarra.css">

<link rel="stylesheet" href="css/reproductor.css">

<style>

.tabla-vocabulario{

width:95%;
margin:30px auto;
border-collapse:separate;
border-spacing:18px;

}

.tabla-vocabulario td{

background:white;
border-radius:18px;
padding:12px;
text-align:center;
box-shadow:0 8px 18px rgba(0,0,0,.18);
transition:.25s;

}

.tabla-vocabulario td:hover{

transform:translateY(-4px);
box-shadow:0 12px 28px rgba(0,0,0,.28);

}

.tabla-vocabulario img{

width:120px;
height:120px;
object-fit:contain;
display:block;
margin:auto;
border-radius:12px;
background:#f5f5f5;
padding:10px;

}

.tabla-vocabulario tr:nth-child(2) td{

background:linear-gradient(135deg,#071426,#163d6c);
color:#FFD700;
font-size:20px;
font-weight:bold;
text-transform:uppercase;
letter-spacing:1px;

}

.tabla-vocabulario tr:nth-child(3) td{

background:#eef3fb;
color:#071426;
font-size:17px;
font-weight:600;

}

.introduccion-general{

width:92%;
margin:25px auto;
padding:22px 26px;

background:white;

border-radius:18px;

box-shadow:0 8px 18px rgba(0,0,0,.18);

font-size:18px;

line-height:1.8;

text-align:justify;

color:#222;

}

</style>

</head>

<body>

<div id="navegacionUCMI" class="navegacion-ucmi">

<a class="boton-interactivo">
VOLVER AL TEMARIO
</a>

<a class="boton-interactivo" id="botonSiguiente">
SEGUIR
</a>

<a class="boton-interactivo">
VOLVER A SKILLS
</a>

</div>

<div id="ucmiEncabezado"></div>

${video ? `

<a class="boton-interactivo"
href="${video}"
target="_blank">

Video G.${unidad}.${tema}

</a>

` : ""}

<table class="barra-carmesi">

<tr>

<td>

<p>

VOCABULARY

</p>

</td>

</tr>

</table>


${audios.length > 0 ? `

<div class="audioUCMI">

<audio controls>

<source src="${audios[0].archivo}" type="audio/mpeg">

Tu navegador no soporta audio.

</audio>


<p>

AG.${unidad}.${tema}.1.${nivel}

</p>


</div>

` : ""}



<div id="contenidoUCMI">


${vocabulario.length > 0 ? `

${crearTabla(vocabulario.slice(0,5))}

${vocabulario.length>5 ? crearTabla(vocabulario.slice(5,10)) : ""}

` : ""}

<table class="barra-rosada">

<tr>

<td>

<p>

${tituloEspanol}

</p>

</td>

</tr>

</table>

${introduccionGeneral ? `

<div class="introduccion-general">

${introduccionGeneral}

</div>

` : ""}

</div>


</div>

<canvas id="drawingCanvas"></canvas>

<script src="js/pizarra.js"><\/script>

<script src="js/navegacion.js"><\/script>

<script src="js/encabezado.js"><\/script>

<script src="js/reproductor.js"><\/script>

<script>

UCMIPizarra.iniciar();

UCMINavegacion.iniciar("grammar");

UCMIEncabezado.iniciar({

titulo:"${unidad}.${tema} ${tituloIngles.toUpperCase()}",

skill:"Grammar"

});

UCMIAudio.cargar(

${JSON.stringify(
audios.map(audio=>({

titulo:
`AG.${unidad}.${tema}.${audio.numero}.${nivel}`,
    
archivo:
audio.archivo

}))
)}

);

<\/script>

</body>

</html>`;

document.getElementById("codigo").textContent = codigo;

document.getElementById("preview").srcdoc = codigo;

}

async function descargarPlantilla(){

    const libro = new ExcelJS.Workbook();

    const hoja = libro.addWorksheet("Grammar");

    const hojaSubtitulos = libro.addWorksheet("Subtitulos");


    // ENCABEZADOS

hoja.getCell("A1").value = "Nivel";

hoja.getCell("B1").value = "Unidad";

hoja.getCell("C1").value = "Tema";

hoja.getCell("D1").value = "Título en inglés";

hoja.getCell("E1").value = "Título en español";

hoja.getCell("F1").value = "Video";

hoja.getCell("G1").value = "Audio de vocabulario";
hoja.getCell("H1").value = "Introducción general";

// HOJA SUBTITULOS

hojaSubtitulos.getCell("A1").value = "Número";
hojaSubtitulos.getCell("B1").value = "Subtítulo";
hojaSubtitulos.getCell("C1").value = "Introducción";
hojaSubtitulos.getCell("D1").value = "Oración 1";
hojaSubtitulos.getCell("E1").value = "Oración 2";
hojaSubtitulos.getCell("F1").value = "Oración 3";
hojaSubtitulos.getCell("G1").value = "Audio";    

for(let i=1;i<=10;i++){

    hojaSubtitulos.getCell(i+1,1).value = i;

}

hojaSubtitulos.getColumn("A").width = 12;
hojaSubtitulos.getColumn("B").width = 40;
hojaSubtitulos.getColumn("C").width = 70;
hojaSubtitulos.getColumn("D").width = 40;
hojaSubtitulos.getColumn("E").width = 40;
hojaSubtitulos.getColumn("F").width = 40;
hojaSubtitulos.getColumn("G").width = 40;    

// VOCABULARIO

let columnaVocabulario = 8; // Columna H

for(let i = 1; i <= 10; i++){

    hoja.getCell(1,columnaVocabulario).value = "Inglés " + i;

    hoja.getCell(1,columnaVocabulario + 1).value = "Español " + i;

    columnaVocabulario += 2;

}

// INTRODUCCIÓN GENERAL

hoja.getCell(1,columnaVocabulario).value = "Introducción general";    
       

    // ESTILO ENCABEZADOS

    ["A1","B1","C1"].forEach(celda=>{

        hoja.getCell(celda).font = {
            bold:true
        };

    });



   // NIVEL: LISTA DESPLEGABLE

hoja.getCell("A2").dataValidation = {

    type:"list",

    allowBlank:false,

    formulae:[
        '"A1,A2,B1,B1+,B2,B2+,C1,C2"'
    ]

};



    // UNIDAD: ENTEROS POSITIVOS

    hoja.getCell("B2").dataValidation = {

        type:"whole",

        operator:"greaterThan",

        allowBlank:true,

        formulae:[0]

    };



    // TEMA: ENTEROS POSITIVOS

    hoja.getCell("C2").dataValidation = {

        type:"whole",

        operator:"greaterThan",

        allowBlank:true,

        formulae:[0]

    };



    // ANCHO DE COLUMNAS

hoja.getColumn("A").width = 15;

hoja.getColumn("B").width = 15;

hoja.getColumn("C").width = 15;

hoja.getColumn("D").width = 30;

hoja.getColumn("E").width = 30;

hoja.getColumn("F").width = 40;

    for(let i = 7; i <= 17; i++){

    hoja.getColumn(i).width = 40;

}   

for(let i = 18; i <= 37; i++){

    hoja.getColumn(i).width = 25;

}    



    const archivo = await libro.xlsx.writeBuffer();



    const blob = new Blob(

        [archivo],

        {
            type:
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        }

    );



    const enlace = document.createElement("a");


    enlace.href =
    URL.createObjectURL(blob);


    enlace.download =
    "plantilla-grammar.xlsx";


    enlace.click();

}

async function leerExcel(event){

    const archivo = event.target.files[0];

    if(!archivo) return;


    const buffer = await archivo.arrayBuffer();


    const libro = new ExcelJS.Workbook();


    await libro.xlsx.load(buffer);


    const hojaSubtitulos = libro.getWorksheet("Subtitulos");
    const hoja = libro.getWorksheet("Grammar");


    const tituloIngles =
hoja.getCell("D2").value || "";

const tituloEspanol =
hoja.getCell("E2").value || "";

const unidad =
hoja.getCell("B2").value || "";

const tema =
hoja.getCell("C2").value || "";


const video =
hoja.getCell("F2").text || "";

const introduccionGeneral =
hoja.getCell(2,28).value || "";    


    let audios = [];


for(let i = 1; i <= 11; i++){

    let columna = 6 + i;


    let ruta =
hoja.getCell(2,columna).value || "";

if(typeof ruta === "object"){

    ruta = ruta.text || "";

}


    if(ruta){

        console.log("Audio encontrado:", ruta);

        audios.push({

            numero:i,

            archivo:ruta

        });

    }

}  

vocabularioGlobal = [];

let subtitulosGlobal = [];


for(let i = 2; i <= 11; i++){

    let subtitulo =
    hojaSubtitulos.getCell(i,2).value || "";


    let introduccion =
    hojaSubtitulos.getCell(i,3).value || "";


    let oracion1 =
    hojaSubtitulos.getCell(i,4).value || "";


    let oracion2 =
    hojaSubtitulos.getCell(i,5).value || "";


    let oracion3 =
    hojaSubtitulos.getCell(i,6).value || "";


    let audio =
    hojaSubtitulos.getCell(i,7).value || "";



    if(subtitulo){

        subtitulosGlobal.push({

            subtitulo: subtitulo,

            introduccion: introduccion,

            oraciones:[
                oracion1,
                oracion2,
                oracion3
            ],

            audio:audio

        });

    }

}    


for(let i=0;i<10;i++){

    let columna =
    8 + (i*2);


    let ingles =
    hoja.getCell(2,columna).value || "";


    let espanol =
    hoja.getCell(2,columna+1).value || "";


    if(ingles && espanol){

        vocabularioGlobal.push({

    ingles: ingles,

    espanol: espanol.charAt(0).toUpperCase() + espanol.slice(1).toLowerCase(),

    imagen:""

});

    }

}

    datosPagina = {

tituloIngles: tituloIngles,

tituloEspanol: tituloEspanol,

unidad: unidad,

tema: tema,

video: video,

audios: audios,

nivel: hoja.getCell("A2").text || "",

introduccionGeneral: introduccionGeneral,

subtitulos: subtitulosGlobal

};
    
    generarCodigo(

        datosPagina.tituloIngles,

        datosPagina.tituloEspanol,

        datosPagina.unidad,

        datosPagina.tema,

        datosPagina.video,

        datosPagina.audios,

        datosPagina.nivel,

        vocabularioGlobal,

        datosPagina.introduccionGeneral

);

}  

    

generarCodigo();

document
.getElementById("excelInput")
.addEventListener(
"change",
leerExcel
); 

function extraerImagenesBlogger(){

    const codigo =
    document.getElementById("codigoBlogger").value;


    const patron =
    /https:\/\/blogger\.googleusercontent\.com\/[^"]+/gi;


    const coincidencias =
    codigo.match(patron);


    if(!coincidencias){

        console.log("No se encontraron imágenes");

        alert("No se encontraron URLs de Blogger");

        return;

    }


    imagenesBlogger =
    coincidencias.map(url=>url);


    console.log("URLs encontradas:");

    console.log(imagenesBlogger);


    asignarImagenes();

}  

    function normalizarTexto(texto){

    return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ñ/g,"n")
    .replace(/[^a-z0-9]/g,"");

}



function asignarImagenes(){

    vocabularioGlobal.forEach(item=>{


        let palabrasBuscar = [

            normalizarTexto(item.ingles),

            normalizarTexto(item.espanol)

        ];



        let encontrada = imagenesBlogger.find(url=>{


            let nombreArchivo = url
            .split("/")
            .pop()
            .replace(/\.(png|jpg|jpeg|webp)$/i,"");



            nombreArchivo = normalizarTexto(nombreArchivo);



            return palabrasBuscar.some(palabra=>

                nombreArchivo.includes(palabra)

            );


        });



        if(encontrada){

            item.imagen = encontrada;

        }


    });



    generarCodigoActualizado();

}

console.log("Audios enviados:", datosPagina.audios);
    
function generarCodigoActualizado(){

    generarCodigo(

        datosPagina.tituloIngles,

        datosPagina.tituloEspanol,

        datosPagina.unidad,

        datosPagina.tema,

        datosPagina.video,

        datosPagina.audios,

        datosPagina.nivel,

        vocabularioGlobal

    );

}   

function abrirNuevaPestana(){

    const codigo =
    document.getElementById("codigo").textContent;

    const nuevaVentana =
    window.open();

    nuevaVentana.document.open();

    nuevaVentana.document.write(codigo);

    nuevaVentana.document.close();

}    

</script>    

</body>

</html>
