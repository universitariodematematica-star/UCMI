<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba Panel Estudiante</title>

<link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">    

<link rel="stylesheet" href="componentes/plantilla-estudiantes.css">

</head>

<body>

<div id="app"></div>


<script type="module">

fetch("componentes/plantilla-estudiantes.html")
.then(res => res.text())
.then(async html => {

    document.getElementById("app").innerHTML = html;

const modulo = await import("./componentes/plantilla-estudiantes.js");

modulo.iniciarPlantillaEstudiante();

});


</script>


</body>
</html>
