<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Aula Academia</title>

</head>


<body>


<div id="app"></div>



<script type="module">


// ==========================================
// CARGAR PLANTILLA ESTUDIANTE
// ==========================================

fetch("componentes/plantilla-estudiantes.html")

.then(res => res.text())

.then(html => {


    document.getElementById("app").innerHTML = html;



    // Cargar lógica del componente

    import("./componentes/plantilla-estudiantes.js")

    .then(modulo => {


        if(modulo.iniciarPlantillaEstudiante){

            modulo.iniciarPlantillaEstudiante();

        }


    });


});



</script>



</body>

</html>
