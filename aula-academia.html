<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Aula Academia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="componentes/plantilla-estudiantes.css">

</head>

<body>

<div id="app"></div>

<script type="module">

fetch("componentes/plantilla-estudiantes.html")
.then(res=>res.text())
.then(html=>{

    document.getElementById("app").innerHTML = html;

    import("./componentes/plantilla-estudiantes.js")
    .then(mod=>{

        if(mod.iniciarPlantillaEstudiante){
            mod.iniciarPlantillaEstudiante();
        }

    });

import("./js/panel-estudiante.js")
.then(mod=>{

    if(mod.iniciarPanelEstudiante){

        mod.iniciarPanelEstudiante();

    }

});    

});

</script>

</body>
</html>
