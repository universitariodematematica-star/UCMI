<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCMI - Mis Asignaturas</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{

    background:#06090f;
    font-family:'Segoe UI',sans-serif;
    color:white;
    padding:30px;

}


.panel-ucmi{

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:30px;

}



.titulo{

    color:#c5a059;
    font-weight:bold;

}



.tarjeta-asignatura{

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:25px;
    height:100%;
    transition:.3s;

}



.tarjeta-asignatura:hover{

    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(197,160,89,.4);

}



.nombre-asignatura{

    color:#c5a059;
    font-size:1.4rem;
    font-weight:bold;

}



.dato{

    margin-bottom:10px;
    color:white;

}



.btn-ucmi{

    background:#c5a059;
    color:#000;
    font-weight:bold;
    border:none;
    border-radius:12px;

}



</style>


</head>


<body>



<div class="container-fluid">


<div class="panel-ucmi">


<h2 class="titulo">

📚 Mis Asignaturas

</h2>


<p class="text-white-50">

Asignaturas asignadas dentro de la academia.

</p>

<div class="row mt-4">

    <div id="listaAsignaturas" class="row">

    </div>

</div>

</div>

</div>

</div>

</div>

</div>

<script type="module" src="js/mis-asignaturas-academia.js"></script>

</body>

</html>
