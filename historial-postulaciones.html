<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI - Historial de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
    :root { 
        --azul-ucmi: #06090f;
        --azul-sidebar: #1a2a3a;
        --verde-exito: #27ae60;
        --dorado-ucmi: #c5a059; 
        --sidebar-width: 260px;
        --rojo-peligro: #e74c3c;
        --rojo-logout: #e74c3c;
        --cian-tech: #00f2ff;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        color: white;
        background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png') no-repeat center center fixed;
        background-size: cover;
        overflow: hidden;
        height: 100vh;
    }

    .wrapper { 
        display: flex; 
        height: 100vh; 
        width: 100vw; 
        overflow: hidden;
    }

    /* --- SIDEBAR IGUAL A POSTULACIONES --- */
    .sidebar {
        background: rgba(26, 42, 58, 0.4); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px); 
        border-right: 1px solid rgba(255, 255, 255, 0.15); 
        width: 260px; 
        flex-shrink: 0; 
        padding: 25px 15px; 
        display: flex; 
        flex-direction: column;
    }

    .logo-sidebar { 
        height: 100px; 
        width: auto; 
        margin-bottom: 30px; 
        display: block; 
        margin-left: auto; 
        margin-right: auto; 
    }

    .sidebar-nav { flex-grow: 1; }

    .nav-item-ucmi { 
        display: flex; 
        align-items: center; 
        color: rgba(255,255,255,0.6); 
        text-decoration: none; 
        padding: 10px 15px; 
        margin-bottom: 5px; 
        border-radius: 10px; 
        transition: 0.3s all ease; 
        font-size: 0.85rem; 
    }

    .nav-item-ucmi i { margin-right: 12px; font-size: 1.1rem; }

    .nav-item-ucmi:hover { 
        color: white; 
        background: rgba(255,255,255,0.1); 
        transform: translateX(5px); 
    }

    .nav-item-ucmi.active { 
        background: rgba(197, 160, 89, 0.15); 
        color: var(--dorado-ucmi); 
        font-weight: 600; 
        box-shadow: inset 0 0 10px rgba(197, 160, 89, 0.1); 
    }

    .btn-sidebar-action { 
        background: transparent; 
        border: 1px solid rgba(255, 255, 255, 0.4) !important; 
        color: white !important; 
        font-weight: 600; 
        text-transform: uppercase; 
        font-size: 0.7rem; 
        border-radius: 50px; 
        padding: 10px; 
        text-decoration: none; 
        text-align: center; 
        transition: all 0.3s ease-in-out; 
        display: block; 
        margin-bottom: 10px; 
    }

    .btn-sidebar-action:hover { 
        background: rgba(255, 255, 255, 0.1); 
        border-color: #ffffff !important; 
        color: #ffffff !important; 
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
        transform: translateY(-2px); 
    }

    .btn-logout { border-color: rgba(231, 76, 60, 0.4) !important; color: rgba(231, 76, 60, 0.8) !important; }
    .btn-logout:hover { 
        background: rgba(231, 76, 60, 0.1) !important; 
        border-color: var(--rojo-logout) !important; 
        color: white !important; 
        box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); 
    }

    /* --- CONTENEDOR PRINCIPAL Y TABLA VINCULADOS A TU HTML --- */
    .main-content {
        flex-grow: 1;
        width: calc(100vw - var(--sidebar-width));
        padding: 40px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    /* Adapta tu .glass-panel al estilo de contenedor de Postulaciones */
    .glass-panel {
        background: rgba(255, 255, 255, 0.03) !important;
        backdrop-filter: blur(15px) saturate(150%);
        -webkit-backdrop-filter: blur(15px) saturate(150%);
        border-radius: 28px;
        padding: 30px;
        color: white;
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
    }

    /* Adapta tu .table-historial para visibilidad de texto y diseño */
    .table-historial { 
        width: 100%; 
        border-collapse: separate; 
        border-spacing: 0 5px; 
        color: white !important; 
    }

    .table-historial thead th { 
        color: rgba(255, 255, 255, 0.6) !important; 
        font-weight: 800; 
        text-transform: uppercase; 
        font-size: 0.75rem; 
        letter-spacing: 1px; 
        border: none; 
        padding: 12px 15px; 
    }

    .table-historial tr { 
        background-color: transparent !important; 
        transition: all 0.3s ease-in-out; 
    }

    .table-historial td { 
        padding: 18px 15px; 
        vertical-align: middle; 
        border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important; 
        color: white !important; 
    }

    .table-historial td .fw-bold { 
        color: #ffffff !important; 
        font-size: 1rem; 
    }

    .table-historial tbody tr:hover td { 
        background-color: rgba(255, 255, 255, 0.05) !important; 
        color: #ffffff !important; 
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.9); 
    }

    /* BADGES Y CHIPS OFICIALES */
    .badge-status { padding: 6px 14px; border-radius: 100px; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; }
    .status-aprobado { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid #00ff8844; }
    .status-rechazado { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d44; }
    .status-pendiente { background: rgba(255, 204, 0, 0.1); color: #ffcc00; border: 1px solid #ffcc0044; }
    .neon-gold { color: var(--dorado-ucmi); font-weight: bold; }
    .date-chip { font-family: 'Courier New', monospace; background: rgba(0, 242, 255, 0.05); color: var(--cian-tech); padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(0, 242, 255, 0.2); }
    </style>
</head>
<body>

<div class="wrapper">

    <div id="sidebar-ucmi"></div>

    <main class="main-content">
        <h2 class="neon-gold text-uppercase mb-4">Historial de Solicitudes</h2>
        <div class="glass-panel">
            <div class="table-responsive">
                <table class="table-historial text-white">
                    <thead>
                        <tr class="text-white-50 small text-uppercase">
                            <th class="ps-4">Solicitante</th>
                            <th>Fecha</th>
                            <th>Perfil</th>
                            <th>Estado</th>
                            <th>WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA2eMtX0I2u1iKdtHjNisMrqVSlpJbzHNI",
    authDomain: "ucmi-13796634.firebaseapp.com",
    projectId: "ucmi-13796634",
    storageBucket: "ucmi-13796634.firebasestorage.app",
    messagingSenderId: "1090719609536",
    appId: "1:1090719609536:web:8d7f269d991d8dc3c6b325"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
    console.log("Usuario actual:", user?.uid);
});
    const tablaCuerpo = document.getElementById('tablaCuerpo');

onSnapshot(
    collection(db, "historial_postulaciones"),
    (snapshot) => {

        console.log("LECTURA EXITOSA");
        console.log("DEBUG: Documentos detectados:", snapshot.size);

        tablaCuerpo.innerHTML = '';

        if (snapshot.empty) {
            console.warn("DEBUG: La colección está vacía.");
            tablaCuerpo.innerHTML =
                '<tr><td colspan="5" class="text-center">No hay registros en el historial.</td></tr>';
            return;
        }

        snapshot.forEach(doc => {
            const p = doc.data();

            const perfil = p.perfil || p.tipoSolicitante || 'ACADEMIA';
            const esDocente = String(perfil).toLowerCase().includes("docente");
            const decision = String(p.decisionFinal || "").toUpperCase().trim();
            const whatsapp = p.whatsapp || '';

            let statusClass = 'status-pendiente';
            let estadoTexto = 'PENDIENTE';

            if (decision === 'ACEPTADO') {
                statusClass = 'status-aprobado';
                estadoTexto = 'ACEPTADO';
            } else if (decision === 'RECHAZADO') {
                statusClass = 'status-rechazado';
                estadoTexto = 'RECHAZADO';
            }

            tablaCuerpo.innerHTML += `
                <tr>
                    <td>
                        <div class="fw-bold">${p.entidad || 'N/A'}</div>
                        <div class="small text-white-50">${p.nombreResponsable || p.nombreEstudiante || '---'}</div>
                    </td>
                    <td><span class="date-chip">${p.fechaProceso || '---'}</span></td>
                    <td><div class="fw-bold ${esDocente ? 'text-info' : 'text-warning'}">${String(perfil).toUpperCase()}</div></td>
                    <td><span class="badge-status ${statusClass}">${estadoTexto}</span></td>
                    <td>
                        ${whatsapp
                            ? `<a href="https://wa.me/${whatsapp}" target="_blank" class="text-decoration-none text-info"><i class="bi bi-whatsapp"></i> ${whatsapp}</a>`
                            : '---'}
                    </td>
                </tr>
            `;
        });

    },
    (error) => {
        console.error("ERROR FIRESTORE:", error);
    }
);

</script>
<script type="module" src="js/alertas-globales.js"></script> 
<script src="js/sidebar-ucmi.js"></script>    
</body>
</html>
