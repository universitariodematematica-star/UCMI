<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCMI - Historial de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
    :root {
        --azul-ucmi: #06090f;
        --azul-sidebar: #1a2a3a;
        --verde-exito: #27ae60;
        --dorado-ucmi: #c5a059;
        --rojo-logout: #e74c3c;
        --indigo-ucmi: #4b0082;
    }

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEha-pig9aN462AKJSlSnHrqcseuCYM6l9W6-N57xQaB53nmVFnuXEWdVN4KSaYZSR7S9Fm0BIL2MjAZeZFngTHSIgeGDJNdrApWfqwOF1ZcJgrQbWF6sdjaMDcpnVgen1_5o-kKXdRo46Q_Ly3xjyS-oJbOYRjmoA9-t82SgBcvHEmXsC0_tQhExYyoBvRV/s1408/Gemini_Generated_Image_x1m01x1m01x1m01x.png') no-repeat center center fixed;
    background-size: cover;
    overflow: hidden;
    height: 100vh;
}

.wrapper { 
    display: flex; 
    height: 100vh; 
    width: 100vw; 
    overflow: hidden;
}

/* --- ESTILOS OFICIALES DEL SIDEBAR --- */
.sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100vh;
    background: rgba(10, 15, 25, 0.75);
    border-right: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 12px; /* Reducimos ligeramente el padding vertical */
    box-sizing: border-box;
    z-index: 1000;
    overflow: hidden; /* Evita cualquier desbordamiento general */
}

.logo-sidebar {
    max-width: 70px; /* Reducimos un poco el tamaño del logo para ganar espacio */
    height: auto;
}

.sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 4px; /* Espaciado más compacto entre botones */
    flex-grow: 1;
    overflow-y: hidden; /* Oculta la barra de scroll completamente */
    margin-top: 5px;
}

.nav-item-ucmi {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px; /* Altura de botones más compacta */
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
}
        
.nav-item-ucmi i {
    font-size: 1.1rem;
}

.nav-item-ucmi:hover, 
.nav-item-ucmi.active {
    background: linear-gradient(90deg, rgba(197, 160, 89, 0.15), transparent);
    color: var(--dorado-ucmi);
    border-left: 3px solid var(--dorado-ucmi);
}

/* Botones inferiores del sidebar */
.btn-sidebar-action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 15px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 8px;
    transition: all 0.3s ease;
}

.btn-sidebar-action:hover {
    background: rgba(197, 160, 89, 0.15);
    border-color: var(--dorado-ucmi);
    color: var(--dorado-ucmi);
}

.btn-logout:hover {
    background: rgba(231, 76, 60, 0.15);
    border-color: var(--rojo-peligro);
    color: var(--rojo-peligro);
}

/* --- CONTENIDO PRINCIPAL --- */
.main-content {
    flex-grow: 1;
    width: calc(100vw - var(--sidebar-width));
    padding: 40px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.glass-panel {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(25px);
    border-radius: 30px;
    padding: 35px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
}

.table-historial { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
.table-historial tr { background: rgba(255, 255, 255, 0.03); border-radius: 15px; }
.table-historial td { padding: 15px 20px; vertical-align: middle; border: none; }

.badge-status { padding: 6px 14px; border-radius: 100px; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; }
.status-aprobado { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid #00ff8844; }
.status-rechazado { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d44; }
.status-pendiente { background: rgba(255, 204, 0, 0.1); color: #ffcc00; border: 1px solid #ffcc0044; }
.neon-gold { color: var(--dorado-ucmi); font-weight: bold; }
.date-chip { font-family: 'Courier New', monospace; background: rgba(0, 242, 255, 0.05); color: var(--cian-tech); padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(0, 242, 255, 0.2); }
    </style>
</head>
<body>

<div class="wrapper">

    <div id="sidebar-ucmi"></div>

    <main class="main-content">
        <h2 class="neon-gold text-uppercase mb-4">Historial de Solicitudes</h2>
        <div class="glass-panel">
            <div class="table-responsive">
                <table class="table-historial text-white">
                    <thead>
                        <tr class="text-white-50 small text-uppercase">
                            <th class="ps-4">Solicitante</th>
                            <th>Fecha</th>
                            <th>Perfil</th>
                            <th>Estado</th>
                            <th>WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA2eMtX0I2u1iKdtHjNisMrqVSlpJbzHNI",
    authDomain: "ucmi-13796634.firebaseapp.com",
    projectId: "ucmi-13796634",
    storageBucket: "ucmi-13796634.firebasestorage.app",
    messagingSenderId: "1090719609536",
    appId: "1:1090719609536:web:8d7f269d991d8dc3c6b325"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
    console.log("Usuario actual:", user?.uid);
});
    const tablaCuerpo = document.getElementById('tablaCuerpo');

onSnapshot(
    collection(db, "historial_postulaciones"),
    (snapshot) => {

        console.log("LECTURA EXITOSA");
        console.log("DEBUG: Documentos detectados:", snapshot.size);

        tablaCuerpo.innerHTML = '';

        if (snapshot.empty) {
            console.warn("DEBUG: La colección está vacía.");
            tablaCuerpo.innerHTML =
                '<tr><td colspan="5" class="text-center">No hay registros en el historial.</td></tr>';
            return;
        }

        snapshot.forEach(doc => {
            const p = doc.data();

            const perfil = p.perfil || p.tipoSolicitante || 'ACADEMIA';
            const esDocente = String(perfil).toLowerCase().includes("docente");
            const decision = String(p.decisionFinal || "").toUpperCase().trim();
            const whatsapp = p.whatsapp || '';

            let statusClass = 'status-pendiente';
            let estadoTexto = 'PENDIENTE';

            if (decision === 'ACEPTADO') {
                statusClass = 'status-aprobado';
                estadoTexto = 'ACEPTADO';
            } else if (decision === 'RECHAZADO') {
                statusClass = 'status-rechazado';
                estadoTexto = 'RECHAZADO';
            }

            tablaCuerpo.innerHTML += `
                <tr>
                    <td>
                        <div class="fw-bold">${p.entidad || 'N/A'}</div>
                        <div class="small text-white-50">${p.nombreResponsable || p.nombreEstudiante || '---'}</div>
                    </td>
                    <td><span class="date-chip">${p.fechaProceso || '---'}</span></td>
                    <td><div class="fw-bold ${esDocente ? 'text-info' : 'text-warning'}">${String(perfil).toUpperCase()}</div></td>
                    <td><span class="badge-status ${statusClass}">${estadoTexto}</span></td>
                    <td>
                        ${whatsapp
                            ? `<a href="https://wa.me/${whatsapp}" target="_blank" class="text-decoration-none text-info"><i class="bi bi-whatsapp"></i> ${whatsapp}</a>`
                            : '---'}
                    </td>
                </tr>
            `;
        });

    },
    (error) => {
        console.error("ERROR FIRESTORE:", error);
    }
);

</script>
<script type="module" src="js/alertas-globales.js"></script> 
<script src="js/sidebar-ucmi.js"></script>    
</body>
</html>
